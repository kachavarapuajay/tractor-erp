<script>
/* ==== js/syncserver.js ==== */
/* ============================================================
   syncserver.js — multi-user sync through your own server
   ============================================================ */

var Srv = {
  timer: null,
  secs: 10,
  busy: false,
  lastAt: '',
  lastMsg: '',
  user: null,

  url: function () { return (settings().serverUrl || '').replace(/\/+$/, ''); },
  token: function () { return settings().serverToken || ''; },
  running: function () { return !!Srv.timer; },
  configured: function () { return !!(Srv.url() && Srv.token()); },

  api: function (pathname, opts) {
    opts = opts || {};
    var headers = { 'Content-Type': 'application/json' };
    if (Srv.token()) headers['Authorization'] = 'Bearer ' + Srv.token();
    return fetch(Srv.url() + pathname, {
      method: opts.method || 'GET',
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined,
      cache: 'no-store'
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
        return j;
      });
    });
  },

  /* ---------- sign in ---------- */
  login: function (url, username, password) {
    var clean = String(url || '').trim().replace(/\/+$/, '');
    if (!/^https?:\/\//.test(clean)) clean = 'http://' + clean;
    return fetch(clean + '/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username, password: password })
    }).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok) throw new Error(j.error || 'Sign in failed');
        var st = settings();
        st.serverUrl = clean;
        st.serverToken = j.token;
        st.serverUser = j.user;
        S.meta.updatedAt = Date.now();
        save(true);
        Srv.user = j.user;
        Srv.adoptUser(j.user);
        Srv.start(st.serverSecs || 10);
        return j.user;
      });
    });
  },

  /* the server user becomes the local session, so menus follow their permissions */
  adoptUser: function (u) {
    var id = 'srv-' + u.username;
    var existing = S.users.find(function (x) { return x.id === id; });
    var rec = existing || { id: id, username: u.username };
    rec.name = u.name || u.username;
    rec.role = u.role || 'staff';
    rec.perms = u.perms || [];
    rec.serverUser = true;
    rec.active = true;
    rec.branchId = rec.branchId || (S.branches[0] || {}).id;
    upsert('users', rec);
    S.session.userId = id;
    save(true);
    Shell.refreshDrawer();
  },

  logout: function () {
    Srv.stop();
    var st = settings();
    delete st.serverToken;
    delete st.serverUser;
    S.meta.updatedAt = Date.now();
    S.session.userId = null;
    save(true);
    Shell.refreshDrawer();
    Router.go('login');
  },

  /* ---------- the sync cycle ---------- */
  start: function (secs) {
    Srv.stop();
    Srv.secs = Math.max(3, num(secs) || 10);
    settings().serverSecs = Srv.secs;
    S.meta.updatedAt = Date.now();
    save(true);
    Srv.timer = setInterval(Srv.tick, Srv.secs * 1000);
    Srv.tick();
  },

  stop: function () {
    if (Srv.timer) clearInterval(Srv.timer);
    Srv.timer = null;
  },

  tick: function () {
    if (Srv.busy || !Srv.configured()) return;
    Srv.busy = true;
    var since = num(settings().serverSince || 0);
    var mine = deviceId();
    var got = 0;

    Srv.api('/api/sync', {
      method: 'POST',
      body: { deviceId: mine, packet: Sync.packet(), since: since }
    }).then(function (res) {
      (res.packets || []).forEach(function (p) {
        if (!p || !p.packet) return;
        if (p.packet.deviceId === mine) return;
        var st = Sync.merge(p.packet);
        got += st.added + st.updated + st.deleted;
      });
      settings().serverSince = res.at || Date.now();
      S.meta.updatedAt = Date.now();
      save(true);
      Srv.lastAt = new Date().toTimeString().slice(0, 8);
      Srv.lastMsg = 'Synced ' + Srv.lastAt + ' · ' + (res.devices || 1) + ' device(s)' +
        (got ? ' · received ' + got + ' change(s)' : ' · up to date');
      var el = document.getElementById('srvStatus');
      if (el) el.innerHTML = '<b class="green">' + esc(Srv.lastMsg) + '</b>';
      if (got && Router.current === 'sync') Router.render();
    }).catch(function (e) {
      Srv.lastMsg = 'Not connected — ' + e.message;
      var el = document.getElementById('srvStatus');
      if (el) el.innerHTML = '<b class="red">' + esc(Srv.lastMsg) + '</b>';
    }).then(function () { Srv.busy = false; });
  },

  resume: function () {
    if (Srv.configured() && settings().serverAuto !== false) {
      var u = settings().serverUser;
      if (u) { Srv.user = u; Srv.adoptUser(u); }
      Srv.start(settings().serverSecs || 10);
    }
  },

  /* ---------- user administration ---------- */
  listUsers: function () { return Srv.api('/api/users'); },
  saveUser: function (u) { return Srv.api('/api/users', { method: 'POST', body: u }); },
  changePassword: function (oldPw, newPw) {
    return Srv.api('/api/password', { method: 'POST', body: { oldPassword: oldPw, newPassword: newPw } });
  }
};

</script>
<script>
/* ==== js/cloudsync.js ==== */
/* ============================================================
   cloudsync.js — sync through a shared cloud folder
   (Google Drive / OneDrive / Dropbox folder on the PC,
    a folder picked through Android's file picker on the phone)
   ============================================================ */

var Cloud = {
  timer: null,
  secs: 15,
  lastAt: '',
  lastMsg: '',
  busy: false,
  _handle: null,
  _peers: 0,

  backend: function () {
    if (window.AppBridge && window.AppBridge.cloudWrite) return 'android';
    if (typeof window.showDirectoryPicker === 'function') return 'web';
    return 'none';
  },

  backendLabel: function () {
    var b = Cloud.backend();
    if (b === 'android') return 'Android folder picker';
    if (b === 'web') return 'Browser folder access';
    return 'not available in this browser';
  },

  name: function () {
    if (Cloud.backend() === 'android') {
      try { return window.AppBridge.cloudFolderName() || ''; } catch (e) { return ''; }
    }
    return Cloud._handle ? Cloud._handle.name : '';
  },

  running: function () { return !!Cloud.timer; },

  /* ---------- folder selection ---------- */
  pick: function () {
    if (Cloud.backend() === 'android') {
      window.AppBridge.pickCloudFolder();
      return;
    }
    if (Cloud.backend() === 'web') {
      window.showDirectoryPicker({ mode: 'readwrite' }).then(function (h) {
        Cloud._handle = h;
        return Cloud.storeHandle(h);
      }).then(function () {
        toast('Folder connected: ' + Cloud.name());
        Router.render();
      }).catch(function (e) {
        if (e && e.name === 'AbortError') return;
        toast('Could not open that folder', 'err');
      });
      return;
    }
    toast('Use Chrome or Edge on a PC, or the Android app', 'err');
  },

  /* called from the Android side once the user has chosen a folder */
  picked: function () {
    toast('Folder connected: ' + Cloud.name());
    Router.render();
  },

  /* ---------- web handle persistence ---------- */
  storeHandle: function (h) {
    return new Promise(function (res) {
      try {
        var req = indexedDB.open('terp-cloud', 1);
        req.onupgradeneeded = function () { req.result.createObjectStore('kv'); };
        req.onsuccess = function () {
          var db = req.result;
          var tx = db.transaction('kv', 'readwrite');
          tx.objectStore('kv').put(h, 'dir');
          tx.oncomplete = function () { db.close(); res(); };
          tx.onerror = function () { db.close(); res(); };
        };
        req.onerror = function () { res(); };
      } catch (e) { res(); }
    });
  },

  loadHandle: function () {
    return new Promise(function (res) {
      try {
        var req = indexedDB.open('terp-cloud', 1);
        req.onupgradeneeded = function () { req.result.createObjectStore('kv'); };
        req.onsuccess = function () {
          var db = req.result;
          var tx = db.transaction('kv', 'readonly');
          var g = tx.objectStore('kv').get('dir');
          g.onsuccess = function () { db.close(); res(g.result || null); };
          g.onerror = function () { db.close(); res(null); };
        };
        req.onerror = function () { res(null); };
      } catch (e) { res(null); }
    });
  },

  /* ---------- file access ---------- */
  list: function () {
    if (Cloud.backend() === 'android') {
      try { return Promise.resolve(JSON.parse(window.AppBridge.cloudList() || '[]')); }
      catch (e) { return Promise.reject(e); }
    }
    var dir = Cloud._handle;
    if (!dir) return Promise.resolve([]);
    var out = [];
    return (async function () {
      for await (var entry of dir.values()) {
        if (entry.kind === 'file') out.push(entry.name);
      }
      return out;
    })();
  },

  read: function (name) {
    if (Cloud.backend() === 'android') {
      try { return Promise.resolve(window.AppBridge.cloudRead(name) || ''); }
      catch (e) { return Promise.reject(e); }
    }
    var dir = Cloud._handle;
    if (!dir) return Promise.resolve('');
    return dir.getFileHandle(name).then(function (fh) { return fh.getFile(); })
      .then(function (f) { return f.text(); });
  },

  write: function (name, text) {
    if (Cloud.backend() === 'android') {
      try { return Promise.resolve(window.AppBridge.cloudWrite(name, text)); }
      catch (e) { return Promise.reject(e); }
    }
    var dir = Cloud._handle;
    if (!dir) return Promise.reject(new Error('no folder'));
    return dir.getFileHandle(name, { create: true })
      .then(function (fh) { return fh.createWritable(); })
      .then(function (w) { return w.write(text).then(function () { return w.close(); }); });
  },

  /* ---------- the sync loop ---------- */
  start: function (secs) {
    Cloud.stop();
    Cloud.secs = Math.max(5, num(secs) || 15);
    settings().cloudSecs = Cloud.secs;
    S.meta.updatedAt = Date.now();
    save(true);
    Cloud.timer = setInterval(Cloud.tick, Cloud.secs * 1000);
    Cloud.tick();
  },

  stop: function () {
    if (Cloud.timer) clearInterval(Cloud.timer);
    Cloud.timer = null;
  },

  myFile: function () { return 'terp-' + deviceId() + '.json'; },

  tick: function () {
    if (Cloud.busy) return;
    if (Cloud.backend() === 'none') { Cloud.lastMsg = 'Cloud folders are not available here'; return; }
    Cloud.busy = true;
    var got = 0, seen = 0;
    var mine = Cloud.myFile();

    var ready = Cloud.backend() === 'web' && !Cloud._handle ? Cloud.loadHandle().then(function (h) { Cloud._handle = h; }) : Promise.resolve();

    ready
      .then(function () { return Cloud.list(); })
      .then(function (names) {
        var peers = names.filter(function (n) { return /^terp-.*\.json$/i.test(n) && n !== mine; });
        seen = peers.length;
        return peers.reduce(function (chain, n) {
          return chain.then(function () {
            return Cloud.read(n).then(function (txt) {
              if (!txt) return;
              var pkt;
              try { pkt = JSON.parse(txt); } catch (e) { return; }
              var st = Sync.merge(pkt);
              got += (st.added + st.updated + st.deleted);
            }).catch(function () {});
          });
        }, Promise.resolve());
      })
      .then(function () { return Cloud.write(mine, JSON.stringify(Sync.packet())); })
      .then(function () {
        Cloud._peers = seen;
        Cloud.lastAt = new Date().toTimeString().slice(0, 8);
        Cloud.lastMsg = 'Synced ' + Cloud.lastAt + ' · ' + seen + ' other device(s)' + (got ? ' · received ' + got + ' change(s)' : '');
        if (got && Router.current === 'sync') Router.render();
        var el = document.getElementById('cloudStatus');
        if (el) el.innerHTML = '<b class="green">' + esc(Cloud.lastMsg) + '</b>';
      })
      .catch(function (e) {
        Cloud.lastMsg = 'Sync failed — ' + (e && e.message ? e.message : 'folder not reachable');
        var el = document.getElementById('cloudStatus');
        if (el) el.innerHTML = '<b class="red">' + esc(Cloud.lastMsg) + '</b>';
      })
      .then(function () { Cloud.busy = false; });
  },

  resume: function () {
    if (settings().cloudAuto !== false && (settings().cloudFolder || Cloud.name())) {
      Cloud.start(settings().cloudSecs || 15);
    }
  }
};

</script>
<script>
/* ==== js/sync.js ==== */
/* ============================================================
   sync.js — multi-device sync (Wi-Fi + file) and automatic backup
   ============================================================ */

var SYNC_COLLECTIONS = [
  'users', 'departments', 'employees', 'branches', 'parties', 'items', 'units', 'moves', 'transfers',
  'quotations', 'invoices', 'purchases', 'payments', 'notes', 'expenses', 'jobcards', 'leads',
  'attendance', 'salaries', 'tada', 'fuel', 'logbook', 'petty', 'insurers', 'policies', 'exchanges',
  'marginReceipts', 'gstSlabs', 'makes', 'models', 'mandals', 'villages', 'states', 'bankAccounts',
  'transporters', 'transports', 'warranties', 'rta', 'hsrp', 'agreements'
];

/* ---------------- sync engine ---------------- */
var Sync = {
  packet: function () {
    var data = {};
    SYNC_COLLECTIONS.forEach(function (k) { data[k] = S[k] || []; });
    return {
      app: 'tractor-erp', packetVersion: 1,
      deviceId: deviceId(), deviceName: (org().name || 'Device') + ' · ' + deviceId(),
      at: Date.now(), orgName: org().name || '',
      data: data,
      counters: S.counters || {},
      tombstones: S.tombstones || {},
      meta: { org: org(), settings: settings(), metaUpdatedAt: S.meta.updatedAt || 0 }
    };
  },

  /* cheap fingerprint: changes whenever any record is added, edited or deleted */
  rev: function () {
    var n = 0, newest = 0;
    SYNC_COLLECTIONS.forEach(function (k) {
      var arr = S[k] || [];
      n += arr.length;
      arr.forEach(function (r) { if (num(r._u) > newest) newest = num(r._u); });
    });
    return n + ':' + newest + ':' + Sync.tombstoneCount();
  },

  merge: function (pkt) {
    if (!pkt || pkt.app !== 'tractor-erp' || !pkt.data) throw new Error('This is not a Tractor ERP sync file');
    var stats = { added: 0, updated: 0, deleted: 0, unchanged: 0 };
    SYNC_COLLECTIONS.forEach(function (name) {
      var remote = pkt.data[name] || [];
      var local = coll(name);
      var index = {};
      local.forEach(function (r) { index[r.id] = r; });

      remote.forEach(function (rr) {
        if (!rr || !rr.id) return;
        var lr = index[rr.id];
        if (!lr) { local.push(rr); index[rr.id] = rr; stats.added++; return; }
        if (num(rr._u) > num(lr._u)) { Object.assign(lr, rr); stats.updated++; }
        else stats.unchanged++;
      });

      // apply incoming deletions
      var tomb = (pkt.tombstones && pkt.tombstones[name]) || {};
      Object.keys(tomb).forEach(function (id) {
        var lr = index[id];
        if (lr && num(tomb[id]) > num(lr._u)) {
          var i = local.indexOf(lr);
          if (i > -1) { local.splice(i, 1); stats.deleted++; }
        }
        S.tombstones[name] = S.tombstones[name] || {};
        if (!S.tombstones[name][id] || num(tomb[id]) > num(S.tombstones[name][id])) S.tombstones[name][id] = tomb[id];
      });
    });

    Object.keys(pkt.counters || {}).forEach(function (k) {
      S.counters[k] = Math.max(num(S.counters[k]), num(pkt.counters[k]));
    });

    if (pkt.meta && num(pkt.meta.metaUpdatedAt) > num(S.meta.updatedAt)) {
      S.meta.org = pkt.meta.org || S.meta.org;
      S.meta.settings = Object.assign({}, S.meta.settings || {}, pkt.meta.settings || {});
      S.meta.updatedAt = pkt.meta.metaUpdatedAt;
    }

    S.meta.lastSyncAt = Date.now();
    S.meta.lastSyncWith = pkt.deviceName || pkt.deviceId || 'another device';
    save(true);
    return stats;
  },

  recordCount: function () {
    var n = 0;
    SYNC_COLLECTIONS.forEach(function (k) { n += (S[k] || []).length; });
    return n;
  },

  tombstoneCount: function () {
    var n = 0, t = S.tombstones || {};
    Object.keys(t).forEach(function (k) { n += Object.keys(t[k] || {}).length; });
    return n;
  }
};

/* ---------------- backup engine ---------------- */
var Backup = {
  busy: false,
  config: function () {
    var st = settings();
    if (st.autoBackup === undefined) st.autoBackup = true;
    if (!st.backupEveryHours) st.backupEveryHours = 24;
    if (!st.backupKeep) st.backupKeep = 10;
    return st;
  },
  lastAt: function () { return num(S.meta.lastBackupAt || 0); },
  lastLabel: function () {
    var t = Backup.lastAt();
    if (!t) return 'never';
    var mins = Math.round((Date.now() - t) / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + ' min ago';
    var hrs = Math.round(mins / 60);
    if (hrs < 24) return hrs + ' hour(s) ago';
    return Math.round(hrs / 24) + ' day(s) ago';
  },
  maybe: function () {
    if (Backup.busy) return;
    var st = Backup.config();
    if (st.autoBackup === false) return;
    var everyMs = num(st.backupEveryHours) * 3600000;
    if (Date.now() - Backup.lastAt() < everyMs) return;
    Backup.create(true);
  },
  create: function (silent) {
    if (Backup.busy) return null;
    Backup.busy = true;
    var st = Backup.config();
    var json = JSON.stringify(S);
    var d = new Date();
    var name = 'backup-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' +
      pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds()) + '-' +
      String(d.getMilliseconds()).padStart(3, '0') + '.json';
    var ok = false;
    try {
      if (window.AppBridge && window.AppBridge.saveBackup) {
        ok = !!window.AppBridge.saveBackup(json, name, num(st.backupKeep));
      } else {
        var idx = JSON.parse(localStorage.getItem('terp_backups') || '[]');
        localStorage.setItem('terp_backup_' + name, json);
        idx.push({ name: name, at: Date.now(), size: json.length });
        while (idx.length > num(st.backupKeep)) {
          var old = idx.shift();
          localStorage.removeItem('terp_backup_' + old.name);
        }
        localStorage.setItem('terp_backups', JSON.stringify(idx));
        ok = true;
      }
    } catch (e) { ok = false; }
    Backup.busy = false;
    if (ok) {
      S.meta.lastBackupAt = Date.now();
      S.meta.lastBackupName = name;
      try { STORE.set(JSON.stringify(S)); } catch (e) {}
      if (!silent) toast('Backup saved · also copied to ' + Backup.folderLabel());
    } else if (!silent) {
      toast('Backup failed — check storage', 'err');
    }
    return ok ? name : null;
  },
  folder: function () {
    try {
      if (window.AppBridge && window.AppBridge.backupLocation) {
        return JSON.parse(window.AppBridge.backupLocation() || '{}');
      }
    } catch (e) {}
    return {};
  },
  folderLabel: function () {
    var f = Backup.folder();
    return f.public || 'Documents/Tractor ERP';
  },
  copyToDocuments: function (name) {
    if (!(window.AppBridge && window.AppBridge.copyBackupToDocuments)) { toast('Available in the Android app', 'err'); return; }
    var ok = window.AppBridge.copyBackupToDocuments(name);
    toast(ok ? 'Copied to ' + Backup.folderLabel() : 'Could not copy that backup', ok ? '' : 'err');
  },
  list: function () {
    try {
      if (window.AppBridge && window.AppBridge.listBackups) {
        return JSON.parse(window.AppBridge.listBackups() || '[]');
      }
      return JSON.parse(localStorage.getItem('terp_backups') || '[]');
    } catch (e) { return []; }
  },
  read: function (name) {
    try {
      if (window.AppBridge && window.AppBridge.readBackup) return window.AppBridge.readBackup(name);
      return localStorage.getItem('terp_backup_' + name);
    } catch (e) { return null; }
  },
  restore: function (name) {
    var raw = Backup.read(name);
    if (!raw) { toast('Backup could not be read', 'err'); return; }
    confirmDlg('Restore ' + name + '? Everything currently on this device is replaced.', function () {
      try {
        var obj = JSON.parse(raw);
        if (!obj.meta || !obj.users) throw new Error('bad file');
        S = obj; save(true);
        toast('Backup restored');
        Router.go('dashboard');
      } catch (e) { toast('That backup file is damaged', 'err'); }
    }, 'Restore');
  }
};

        }).join('') || 'No users yet';
      }).catch(function (e) {
        if (box) box.innerHTML = '<span class="red">' + esc(e.message) + '</span>';

    var pickFolder = document.getElementById('btnPickFolder');
    if (pickFolder) pickFolder.onclick = function () { Cloud.pick(); };

    var cloudBtn = document.getElementById('btnCloud');

        S.meta.updatedAt = Date.now();
        save(true);
        toast('Cloud sync stopped');
        Router.render();
        return;
      }
      if (!Cloud.name() && Cloud.backend() !== 'web') { toast('Choose a folder first', 'err'); return; }

      settings().cloudAuto = true;
      Cloud.start(secsEl ? num(secsEl.value) : 15);
      toast('Cloud sync started');
      Router.render();
    };

    var autoBtn = document.getElementById('btnAuto');
    if (autoBtn) autoBtn.onclick = function () {
      if (Sync.autoRunning()) {
        Sync.autoStop();
        settings().syncAuto = false;
        S.meta.updatedAt = Date.now();
        save(true);
        toast('Auto sync stopped');
        Router.render();
        return;
      }
      var hostEl = document.getElementById('autoHost');
      var secsEl = document.getElementById('autoSecs');
      var host = (hostEl && hostEl.value || '').trim();
      if (!host) { toast('Enter the host address', 'err'); return; }

      Sync.autoStart(host, secsEl ? num(secsEl.value) : 5);
      toast('Auto sync started');
      Router.render();
    };

    var pull = document.getElementById('btnPull');
    if (pull) pull.onclick = function () {
      var ipv = (document.getElementById('peerIp').value || '').trim();
      if (!ipv) { toast('Enter the host address', 'err'); return; }

          var stats = Sync.merge(pkt);
          log.innerHTML = '<b class="green">Merged ' + pkt.deviceName + '</b> — ' + stats.added + ' added, ' +
            stats.updated + ' updated, ' + stats.deleted + ' deleted';
          toast('Sync complete');
        })
        .catch(function (e) {
          log.innerHTML = '<b class="red">Could not reach that phone</b> — ' + esc(e.message) +
            '. Check both phones are on the same Wi-Fi and sharing is started there.';
        });
    };

    var push = document.getElementById('btnPush');
    if (push) push.onclick = function () {
      var ipv = (document.getElementById('peerIp').value || '').trim();
      if (!ipv) { toast('Enter the host address', 'err'); return; }
      var log = document.getElementById('joinLog');
      log.textContent = 'Sending to ' + ipv + '…';
      fetch('http://' + ipv + ':8089/push', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Sync.packet())
      }).then(function (r) { return r.json(); })
        .then(function () { log.innerHTML = '<b class="green">Sent.</b> The other phone will merge it the next time it checks.'; })
        .catch(function (e) { log.innerHTML = '<b class="red">Send failed</b> — ' + esc(e.message); });

    /* ---- file tab ---- */
    var ex = document.getElementById('btnExportSync');
    if (ex) ex.onclick = function () {
      var json = JSON.stringify(Sync.packet());
      var name = 'tractor-erp-sync-' + today() + '.terp.json';
      if (window.AppBridge && window.AppBridge.saveFile) window.AppBridge.saveFile(name, json);
      else Export.deliver(name, json, 'application/json');

    var im = document.getElementById('btnImportSync');
    if (im) im.onclick = function () {
      var inp = document.createElement('input');
      inp.type = 'file'; inp.accept = '.json,application/json';
      inp.onchange = function () {
        var f = inp.files[0]; if (!f) return;

        rd.onload = function () {
          try {
            var pkt = JSON.parse(rd.result);
            var stats = Sync.merge(pkt);
            toast('Merged: ' + stats.added + ' added, ' + stats.updated + ' updated');
            Router.render();
          } catch (e) { toast('That is not a valid sync file', 'err'); }
        };
        rd.readAsText(f);
      };
      inp.click();
    };
    var gb = document.getElementById('goBackup');
    if (gb) gb.onclick = function () { Router.go('sync', { tab: 'backup' }); };

    /* ---- backup tab ---- */
    var auto = document.getElementById('autoOn');
    if (auto) auto.onchange = function () {
      settings().autoBackup = auto.checked;
      S.meta.updatedAt = Date.now();
      save(true);
      Router.render();
    };
    var ev2 = document.getElementById('everySel');
    if (ev2) ev2.onchange = function () { settings().backupEveryHours = num(ev2.value); S.meta.updatedAt = Date.now(); save(true); Router.render(); };
    var kp = document.getElementById('keepSel');
    if (kp) kp.onchange = function () { settings().backupKeep = num(kp.value); S.meta.updatedAt = Date.now(); save(true); Router.render(); };
    var bn = document.getElementById('btnBackupNow');
    if (bn) bn.onclick = function () { Backup.create(false); Router.render(); };
    var ca = document.getElementById('btnCopyAll');
    if (ca) ca.onclick = function () {
      var list2 = Backup.list();
      if (!list2.length) { toast('No backup to copy yet', 'err'); return; }
      Backup.copyToDocuments(list2[0].name);
    };
  }
});

/* ---------------- automatic sync (polling) ---------------- */
Sync.auto = { host: '', secs: 5, timer: null, last: '', busy: false };

Sync.autoStart = function (host, secs) {
  Sync.autoStop();
  Sync.auto.host = String(host || '').replace(/^https?:\/\//, '').replace(/\/.*$/, '');
  Sync.auto.secs = Math.max(1, num(secs) || 5);
  settings().syncHost = Sync.auto.host;
  settings().syncSecs = Sync.auto.secs;
  S.meta.updatedAt = Date.now();
  save(true);
  Sync.auto.timer = setInterval(Sync.autoTick, Sync.auto.secs * 1000);
  Sync.autoTick();
};

Sync.autoStop = function () {
  if (Sync.auto.timer) clearInterval(Sync.auto.timer);
  Sync.auto.timer = null;
};

Sync.autoRunning = function () { return !!Sync.auto.timer; };

Sync.autoTick = function () {
  if (!Sync.auto.host || Sync.auto.busy) return;
  Sync.auto.busy = true;
  var base = 'http://' + Sync.auto.host + ':8089';
  fetch(base + '/packet', { method: 'GET', cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (pkt) {
      var rev = Sync.rev();
      var changed = false;
      if (pkt && pkt.app === 'tractor-erp') {
        var stats = Sync.merge(pkt);
        changed = (stats.added + stats.updated + stats.deleted) > 0;
      }
      // send anything the other side has not seen yet
      return fetch(base + '/push', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Sync.packet())
      }).then(function () {
        if (changed) {
          Sync.lastStats = true;
          if (Router.current === 'sync') Router.render();
        }
        Sync.auto.last = today() + ' ' + new Date().toTimeString().slice(0, 8);
        var el = document.getElementById('autoStatus');
        if (el) {
          el.innerHTML = '<b class="green">Connected</b> · last sync ' + Sync.auto.last +
            (changed ? ' · received changes' : ' · up to date');
        }
      });
    })
    .catch(function (e) {
      var el = document.getElementById('autoStatus');
      if (el) el.innerHTML = '<b class="red">Not reachable</b> — ' + esc(e.message) +
        '. Check the phone is hosting and both are on the same Wi-Fi.';
    })
    .then(function () { Sync.auto.busy = false; });
};

/* keep the packet the phone serves fresh while it is hosting */
Sync._outboxAt = 0;
Sync.refreshOutbox = function (force) {
  try {
    if (!(window.AppBridge && window.AppBridge.setSyncPacket)) return;
    var now = Date.now();
    if (!force && now - Sync._outboxAt < 2000) return;
    Sync._outboxAt = now;
    window.AppBridge.setSyncPacket(JSON.stringify(Sync.packet()));
  } catch (e) {}
};

/* restart auto-sync after the app is reopened */
Sync.resumeAuto = function () {
  var st = settings();
  if (st.syncHost && st.syncAuto !== false) {
    Sync.autoStart(st.syncHost, st.syncSecs || 5);
  }
};

/* poll the native inbox while hosting */
Sync.watchIncoming = function () {
  if (Sync._timer) clearInterval(Sync._timer);
  var log = document.getElementById('hostLog');
  Sync._timer = setInterval(function () {
    if (!(window.AppBridge && window.AppBridge.getIncoming)) return;
    var raw = window.AppBridge.getIncoming();
    if (!raw) return;
    try {
      var pkt = JSON.parse(raw);
      var stats = Sync.merge(pkt);
      if (log) log.innerHTML = '<b class="green">Received ' + esc(pkt.deviceName || 'device') + '</b> — ' +
        stats.added + ' added, ' + stats.updated + ' updated';
      Sync.refreshOutbox(true);
      toast('Received data from ' + (pkt.deviceName || 'another phone'));
      if (Router.current === 'sync') Router.render();
    } catch (e) { /* ignore malformed */ }
  }, 2500);
};

/* human "x ago" */
Backup.ago = function (ts) {
  var mins = Math.round((Date.now() - num(ts)) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + ' min ago';
  var hrs = Math.round(mins / 60);
  if (hrs < 24) return hrs + ' hr ago';
  return Math.round(hrs / 24) + ' days ago';
};

    { k: 'refNo', label: 'Cheque / UTR / reference' },
    { k: 'bankAccountId', label: 'Bank account', type: 'select', options: bankAccountOptions, help: 'For bank / UPI / cheque' },
    { k: 'branchId', label: 'Branch', type: 'select', options: branchOptions, required: true, def: (S.branches[0] || {}).id },
    { k: 'note', label: 'Narration', type: 'textarea', span: 2, rows: 2 }
  ];
  var m = modal({
    title: type === 'in' ? 'Money in (receipt)' : 'Money out (payment)',

    body: formHtml(fields) + '<div class="js-opendocs"></div>',
    footer: '<button class="btn ghost" data-cancel>Cancel</button><button class="btn primary" data-save>Save</button>'
  });
  var psel = qs('[name="partyId"]', m.el);
  function refreshDocs() {
    var pid = psel.value;
    var docs = type === 'in'
      ? S.invoices.filter(function (i) { return i.partyId === pid && invoiceOutstanding(i) > 0.5; })
      : S.purchases.filter(function (p) { return p.partyId === pid && purchaseOutstanding(p) > 0.5; });
    var box = qs('.js-opendocs', m.el);
    if (!docs.length) { box.innerHTML = '<div class="note">No open documents for this party — the payment will be treated as an on-account entry.</div>'; return; }
    box.innerHTML = '<div class="section-label">Adjust against</div>' + docs.map(function (d, i) {
      var open = type === 'in' ? invoiceOutstanding(d) : purchaseOutstanding(d);
      return '<label class="rowcard" style="padding:8px 0"><div class="rc-main"><div class="rc-title">' + esc(d.no) + ' · ' + dmy(d.date) + '</div>' +
        '<div class="rc-sub">Open: ' + inr(open) + '</div></div>' +

    }).join('');
    var amt = qs('[name="amount"]', m.el);
    if (docs[0] && !num(amt.value)) amt.value = (type === 'in' ? invoiceOutstanding(docs[0]) : purchaseOutstanding(docs[0]));
  }
  psel.onchange = refreshDocs;
  refreshDocs();
  qs('[data-cancel]', m.el).onclick = m.close;
  qs('[data-save]', m.el).onclick = function () {
    var v = readForm(m.el, fields);
    if (!v.partyId) { toast('Select a party', 'err'); return; }
    if (!num(v.amount)) { toast('Enter the amount', 'err'); return; }
    var rd = m.el.querySelector('input[name="ref"]:checked');
    var rec = {
      id: uid('pay'), no: nextNo('pay', settings().payPrefix), type: type, partyId: v.partyId,
      date: v.date, amount: num(v.amount), mode: v.mode, refNo: v.refNo, branchId: v.branchId,
      bankAccountId: v.bankAccountId || '', note: v.note, refId: rd ? rd.value : '', createdAt: today()
    };
    var doc = rd ? (type === 'in' ? findOne('invoices', rd.value) : findOne('purchases', rd.value)) : null;
    if (doc) rec.refDocNo = doc.no;
    upsert('payments', rec); m.close(); toast('Payment saved'); Router.render();
  };
}

function periodRange(kind) {
  var t = today();
  var d = new Date(t + 'T00:00:00');
  if (kind === 'day') return { from: t, to: t, label: 'Today' };
  if (kind === 'week') {
    var day = d.getDay() === 0 ? 6 : d.getDay() - 1;
    var start = new Date(d); start.setDate(d.getDate() - day);
    var end = new Date(start); end.setDate(start.getDate() + 6);
    return { from: isoOf(start), to: isoOf(end), label: 'This week' };
  }
  if (kind === 'year') return { from: thisYear() + '-01-01', to: thisYear() + '-12-31', label: 'This year' };
  return Object.assign({ label: 'This month' }, monthRange(thisMonth()));
}
function isoOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

screen('leads', {
  title: 'Sales Team & Leads',
  render: function (view, params) {
    var tab = params.tab || 'dash';
    var period = params.period || 'month';
    var empF = params.emp || '';
    var rng = periodRange(period);
    var all = S.leads.filter(function (l) { return !empF || l.salesEmpId === empF; });
    var inPeriod = all.filter(function (l) { return inRange(l.date || today(), rng.from, rng.to); });
    var won = inPeriod.filter(function (l) { return l.status === 'won'; });
    var lost = inPeriod.filter(function (l) { return l.status === 'lost'; });
    var open = inPeriod.filter(function (l) { return l.status !== 'won' && l.status !== 'lost'; });

    var h = pageHead('Sales Team & Leads', [{ label: 'New lead', icon: 'plus', cls: 'primary', onClick: function () { leadForm(); } }],
      rng.label + ' · ' + inPeriod.length + ' leads · ' + won.length + ' won');
    h += '<div class="tabs">' + [['dash', 'Dashboard'], ['leads', 'Leads'], ['team', 'Productivity']].map(function (t) {
      return '<button class="tab ' + (tab === t[0] ? 'on' : '') + '" data-tab="' + t[0] + '">' + t[1] + '</button>';
    }).join('') + '</div>';
    h += '<div class="searchbar"><select id="empF" style="border:1px solid #d6dee6;border-radius:12px;padding:10px;background:#fff;width:100%">' +
      '<option value="">All employees</option>' +
      S.employees.filter(function (e) { return e.empType === 'sales' || S.leads.some(function (l) { return l.salesEmpId === e.id; }); })
        .map(function (e) {
          return '<option value="' + e.id + '"' + (empF === e.id ? ' selected' : '') + '>' + esc(e.name) + '</option>';
        }).join('') +
      '</select></div>';

    if (tab === 'dash') {
      h += '<div class="tabs">' + [['day', 'Daily'], ['week', 'Weekly'], ['month', 'Monthly'], ['year', 'Yearly']].map(function (t) {
        return '<button class="tab ' + (period === t[0] ? 'on' : '') + '" data-period="' + t[0] + '">' + t[1] + '</button>';
      }).join('') + '</div>';

      var conv = inPeriod.length ? Math.round(won.length / inPeriod.length * 100) : 0;
      h += '<div class="stats">' +
        statCard('Leads', String(inPeriod.length), (empF ? empName(empF) : rng.label.toLowerCase()), 'blue') +
        statCard('Won', String(won.length), conv + '% conversion', 'green') +
        statCard('Open', String(open.length), 'in pipeline', 'amber') +
        statCard('Lost', String(lost.length), 'dropped', 'red') + '</div>';

      // DSP-wise (dealer sales person)
      var byDsp = groupBy(inPeriod, function (l) { return l.salesEmpId || 'unassigned'; });
      var dspRows = Object.keys(byDsp).map(function (k) {
        var recs = byDsp[k];
        var w = recs.filter(function (l) { return l.status === 'won'; }).length;
        var salesVal = sum(S.invoices.filter(function (i) {
          return i.salesEmpId === k && i.docType !== 'financer' && inRange(i.date, rng.from, rng.to);
        }), 'taxable');
        return {
          dsp: k === 'unassigned' ? 'Unassigned' : empName(k),
          leads: recs.length, won: w, lost: recs.filter(function (l) { return l.status === 'lost'; }).length,
          conv: recs.length ? Math.round(w / recs.length * 100) : 0,
          sales: salesVal,
          productivity: recs.length ? Math.round(salesVal / recs.length) : 0
        };
      }).sort(function (a, b) { return b.leads - a.leads; });

      h += '<div class="card tight"><h3 style="padding:12px 14px 0">DSP-wise performance</h3><div class="pad" style="padding:6px 4px 0">' + table({
        cls: 'compact',
        cols: [
          { k: 'dsp', label: 'Sales person', render: function (r) { return esc(r.dsp); } },
          { k: 'leads', label: 'Leads', cls: 'num', render: function (r) { return String(r.leads); } },
          { k: 'won', label: 'Won', cls: 'num', render: function (r) { return '<span class="green">' + r.won + '</span>'; } },
          { k: 'conv', label: 'Conv.', cls: 'num', render: function (r) { return r.conv + '%'; } },
          { k: 'sales', label: 'Sales', cls: 'num', render: function (r) { return fmt(r.sales, 0); } }
        ],
        rows: dspRows,
        empty: 'No leads in this period'
      }) + '</div></div>';

      // trend
      var trend = [];
      if (period === 'year') {
        for (var m = 1; m <= 12; m++) {
          var mm = thisYear() + '-' + pad(m);
          trend.push({ l: monthName(m).slice(0, 3), v: all.filter(function (l) { return String(l.date).slice(0, 7) === mm; }).length });
        }
      } else {
        var days = Math.min(14, Math.max(7, daysBetween(rng.from, rng.to) + 1));
        for (var i = days - 1; i >= 0; i--) {
          var dt = addDays(today(), -i);
          trend.push({ l: dt.slice(8), v: all.filter(function (l) { return l.date === dt; }).length });
        }
      }
      h += '<div class="card"><h3>Lead inflow</h3>' + barChart(trend, { fmt: function (v) { return String(v); } }) + '</div>';

      var bySource = groupBy(inPeriod, 'source');
      h += '<div class="card"><h3>Source mix</h3>' + barChart(Object.keys(bySource).map(function (k) {
        return { l: k, v: bySource[k].length, tone: 'blue' };
      }), { fmt: function (v) { return String(v); } }) + '</div>';

      var follow = sortBy(open.filter(function (l) { return l.nextFollowUp; }), 'nextFollowUp').slice(0, 6);
      if (follow.length) {
        h += '<div class="card"><h3>Follow-ups</h3>' + follow.map(function (l) {
          return '<div class="kv"><span>' + esc(l.name) + ' · ' + esc(l.phone || '') + '</span>' +
            '<span class="' + (l.nextFollowUp <= today() ? 'red' : '') + '">' + dmy(l.nextFollowUp) + '</span></div>';
        }).join('') + '</div>';
      }
    } else if (tab === 'leads') {
      var list = sortBy(all, 'date', 'desc');
      h += '<div class="searchbar"><input id="lq" placeholder="Search name, phone, village…" value="' + esc(params.q || '') + '"></div>';
      if (params.q) list = list.filter(function (l) {
        return (l.name + ' ' + (l.phone || '') + ' ' + (l.village || '')).toLowerCase().indexOf(String(params.q).toLowerCase()) > -1;
      });
      h += '<div class="card tight">';
      if (!list.length) h += '<div class="empty small">No leads captured yet.</div>';
      else h += list.map(function (l) {
        var id = 'ld' + l.id;
        setTimeout(function () {
          var e = document.getElementById(id);
          if (e) e.onclick = function () { leadForm(l); };
        }, 0);
        return '<div class="rowcard" id="' + id + '"><div class="rc-main"><div class="rc-title">' + esc(l.name) + ' ' + badge(l.status || 'new', statusTone(l.status)) + '</div>' +
          '<div class="rc-sub">' + esc(l.phone || '') + ' · ' + esc(l.source || '') + (l.village ? ' · ' + esc(l.village) : '') +
          (l.salesEmpId ? ' · ' + esc(empName(l.salesEmpId)) : '') + (l.nextFollowUp ? ' · next ' + dmy(l.nextFollowUp) : '') + '</div></div>' +
          '<div class="rc-right"><small>' + esc(l.model || '') + '</small></div></div>';
      }).join('');
      h += '</div>';
    } else {
      var team = S.employees.filter(function (e) { return e.empType === 'sales' && e.active !== false; });
      var month = thisMonth();
      h += '<div class="card tight">';
      if (!team.length) h += '<div class="empty small">Add sales executives under Employees.</div>';
      else h += team.map(function (e) {
        var sales = S.invoices.filter(function (i) {
          return i.salesEmpId === e.id && String(i.date).slice(0, 7) === month && i.docType !== 'financer';
        });
        var achieved = sum(sales, 'taxable');
        var target = num(e.target);
        var inc = r2(sales.length * num(e.incentiveAmount));
        var pctv = target ? Math.min(100, Math.round(achieved / target * 100)) : 0;
        var leadsN = S.leads.filter(function (l) { return l.salesEmpId === e.id; }).length;
        var wonN = S.leads.filter(function (l) { return l.salesEmpId === e.id && l.status === 'won'; }).length;
        return '<div class="rowcard"><div class="rc-main"><div class="rc-title">' + esc(e.name) + '</div>' +
          '<div class="rc-sub">' + sales.length + ' invoices · ' + leadsN + ' leads · ' + wonN + ' won · incentive ' + inr(inc) + '</div>' +
          '<div class="btrack" style="margin-top:6px"><div class="bfill" style="width:' + pctv + '%"></div></div></div>' +
          '<div class="rc-right">' + inr(achieved) + '<small>of ' + inr(target) + '</small></div></div>';
      }).join('');
      h += '</div>';
      h += '<div class="card"><h3>Pipeline</h3>' +
        barChart([['new', 'New'], ['contacted', 'Contacted'], ['negotiation', 'Negotiation'], ['won', 'Won'], ['lost', 'Lost']].map(function (s) {
          return { l: s[1], v: all.filter(function (l) { return (l.status || 'new') === s[0]; }).length, tone: s[0] === 'won' ? '' : 'blue' };
        }), { fmt: function (v) { return String(v); } }) + '</div>';
    }
    view.innerHTML = h;
    qsa('[data-tab]', view).forEach(function (b) {
      b.onclick = function () { Router.go('leads', { tab: b.getAttribute('data-tab'), period: period, emp: empF }); };
    });

    if (ef) ef.onchange = function () { Router.go('leads', { tab: tab, period: period, emp: ef.value }); };

  }

    footer: '<button class="btn danger" data-del>' + icon('trash') + '</button>' +
      '<button class="btn ghost" data-preview>View</button>' +
      '<button class="btn primary" data-print>' + icon('print') + 'PDF / Print</button>'
  });
  qs('[data-preview]', m.el).onclick = function () { m.close(); previewDoc(n.type === 'credit' ? 'creditnote' : 'debitnote', id); };
  qs('[data-print]', m.el).onclick = function () { m.close(); printDoc(n.type === 'credit' ? 'creditnote' : 'debitnote', id); };
  qs('[data-del]', m.el).onclick = function () {
    m.close();
    confirmDlg('Delete ' + n.no + '?', function () { removeRec('notes', n.id); Router.render(); }, 'Delete');
  };
}

function openPaymentView(id) {
  var p = findOne('payments', id);
  if (!p) return;
  var doc = p.refId ? (p.type === 'in' ? findOne('invoices', p.refId) : findOne('purchases', p.refId)) : null;
  var m = modal({
    title: p.no || (p.type === 'in' ? 'Receipt' : 'Payment'),
    body: '<div class="kv"><span>Type</span><span>' + (p.type === 'in' ? 'Received' : 'Paid') + '</span></div>' +
      '<div class="kv"><span>Party</span><span>' + esc(partyName(p.partyId)) + '</span></div>' +
      '<div class="kv"><span>Date</span><span>' + dmy(p.date) + '</span></div>' +
      '<div class="kv"><span>Mode</span><span>' + esc((p.mode || '').toUpperCase()) + (p.refNo ? ' · ' + esc(p.refNo) : '') + '</span></div>' +
      (doc ? '<div class="kv"><span>Against</span><span>' + esc(doc.no) + '</span></div>' : '') +
      (p.note ? '<div class="kv"><span>Narration</span><span>' + esc(p.note) + '</span></div>' : '') +
      '<div class="grand"><span>Amount</span><span>' + inr(p.amount) + '</span></div>' +
      '<div class="tiny muted" style="margin-top:6px">' + esc(numToWords(p.amount)) + '</div>',
    footer: '<button class="btn danger" data-del>' + icon('trash') + '</button>' +
      '<button class="btn ghost" data-preview>View</button>' +
      '<button class="btn primary" data-print>' + icon('print') + 'PDF / Print</button>'
  });
  qs('[data-preview]', m.el).onclick = function () { m.close(); previewDoc('payment', id); };
  qs('[data-print]', m.el).onclick = function () { m.close(); printDoc('payment', id); };
  qs('[data-del]', m.el).onclick = function () {
    m.close();
    confirmDlg('Delete this ' + (p.type === 'in' ? 'receipt' : 'payment') + ' of ' + inr(p.amount) + '?', function () {
      removeRec('payments', p.id); toast('Deleted'); Router.render();
    }, 'Delete');
  };
}

</script>
<script>
/* ==== js/purchase.js ==== */
/* ============================================================
   purchase.js — purchase bills and expenses
   ============================================================ */

screen('purchases', {
  title: 'Purchase Bills',
  render: function (view, params) {
    var tab = params.tab || 'all';
    var list = S.purchases.filter(function (p) {
      if (tab === 'unpaid') return purchaseOutstanding(p) > 0.5;
      if (tab === 'paid') return purchaseOutstanding(p) <= 0.5;
      return true;
    });
    list = sortBy(list, 'date', 'desc');
    var total = sum(list, 'total');
    var open = sum(list, function (p) { return purchaseOutstanding(p); });
    var expCols = [
      { k: 'date', label: 'Date' }, { k: 'no', label: 'Bill' }, { k: 'supplier', label: 'Supplier' },
      { k: 'gstin', label: 'GSTIN' }, { k: 'taxable', label: 'Taxable' }, { k: 'gst', label: 'GST' },
      { k: 'total', label: 'Total' }, { k: 'balance', label: 'Payable' }, { k: 'rcm', label: 'RCM' }
    ];
    var expRows = list.map(function (p) {
      return {
        date: dmy(p.date), no: p.no, supplier: partyName(p.partyId), gstin: party(p.partyId).gstin || '',
        taxable: num(p.taxable), gst: num(p.cgst) + num(p.sgst) + num(p.igst), total: num(p.total),
        balance: purchaseOutstanding(p), rcm: p.rcm ? 'Y' : 'N'
      };
    });
    var h = pageHead('Purchase Bills', [
      Export.action('Purchase Bills', function () { return expCols; }, function () { return expRows; }),
      { label: 'New bill', icon: 'plus', cls: 'primary', onClick: function () { openDocEditor('purchase'); } }],
      list.length + ' bills · ' + inr(total) + ' · ' + inr(open) + ' payable');
    h += '<div class="tabs">' + [['all', 'All'], ['unpaid', 'Payable'], ['paid', 'Settled']].map(function (t) {
      return '<button class="tab ' + (tab === t[0] ? 'on' : '') + '" data-tab="' + t[0] + '">' + t[1] + '</button>';
    }).join('') + '</div><div class="card tight">';
    if (!list.length) h += '<div class="empty small">No purchase bills yet. Add stock inward from a supplier bill.</div>';
    else h += list.map(function (p) {
      var id = 'pu' + p.id;
      setTimeout(function () {
        var e = document.getElementById(id); if (e) e.onclick = function () { openDocView('purchase', p.id); };
      }, 0);
      var out = purchaseOutstanding(p);
      return '<div class="rowcard" id="' + id + '"><div class="rc-main"><div class="rc-title">' + esc(partyName(p.partyId)) + '</div>' +
        '<div class="rc-sub">' + esc(p.no) + ' · bill ' + esc(p.billNo || '-') + ' · ' + dmy(p.date) + ' · ' + esc(p.purchaseType || '') + '</div></div>' +
        '<div class="rc-right">' + inr(p.total) + '<small>' + (out > 0.5 ? badge('PAYABLE ' + fmt(out, 0), 'amber') : badge('SETTLED', 'green')) + '</small></div></div>';
    }).join('');
    view.innerHTML = h + '</div>';
    qsa('[data-tab]', view).forEach(function (b) { b.onclick = function () { Router.go('purchases', { tab: b.getAttribute('data-tab') }); }; });
  }
});

/* ================= EXPENSES ================= */
var EXPENSE_HEADS = [['rent', 'Rent'], ['salary', 'Salary & wages'], ['electricity', 'Electricity'], ['fuel', 'Fuel & travel'],
  ['repair', 'Repairs & maintenance'], ['transport', 'Freight & transport'], ['marketing', 'Marketing & promotion'],
  ['office', 'Office & stationery'], ['bank', 'Bank charges'], ['professional', 'Professional fees'],
  ['insurance', 'Insurance'], ['interest', 'Interest & finance cost'], ['misc', 'Miscellaneous']];

screen('expenses', {
  title: 'Expenses',
  render: function (view, params) {
    var month = params.month || thisMonth();
    var list = S.expenses.filter(function (e) { return String(e.date).slice(0, 7) === month; });
    list = sortBy(list, 'date', 'desc');
    var total = sum(list, 'amount');
    var gstPaid = sum(list, 'gst');
    var byHead = groupBy(list, 'head');

    var h = pageHead('Expenses', [{ label: 'Add', icon: 'plus', cls: 'primary', onClick: function () { expenseForm(); } }],
      monthName(month.slice(5)) + ' ' + month.slice(0, 4) + ' · ' + inr(total) + ' across ' + list.length + ' entries');
    h += '<div class="searchbar"><input id="mSel" type="month" value="' + esc(month) + '"></div>';
    h += '<div class="card tight">';
    if (!list.length) h += '<div class="empty small">No expenses booked this month.</div>';
    else h += list.map(function (e) {
      var id = 'ex' + e.id;
      setTimeout(function () {
        var el2 = document.getElementById(id);
        if (el2) el2.onclick = function () { expenseForm(e); };
      }, 0);
      return '<div class="rowcard" id="' + id + '"><div class="rc-main"><div class="rc-title">' + esc(e.particulars || e.head) + '</div>' +
        '<div class="rc-sub">' + dmy(e.date) + ' · ' + esc(e.head) + (e.partyName ? ' · ' + esc(e.partyName) : '') +
        ' · ' + esc((e.mode || 'cash').toUpperCase()) + '</div></div>' +
        '<div class="rc-right">' + inr(e.amount) + '<small>' + esc(branchName(e.branchId)) + '</small></div></div>';
    }).join('');
    h += '</div>';
    h += '<div class="card"><h3>Head-wise</h3>' + barChart(Object.keys(byHead).map(function (k) {
      return { l: (EXPENSE_HEADS.find(function (x) { return x[0] === k; }) || [k, k])[1], v: sum(byHead[k], 'amount'), tone: 'amber' };
    }).sort(function (a, b) { return b.v - a.v; }).slice(0, 8)) + '</div>';
    h += '<div class="card"><div class="kv"><span>Total expenses</span><span>' + inr(total) + '</span></div>' +
      '<div class="kv"><span>GST portion (ITC)</span><span>' + inr(gstPaid) + '</span></div></div>';
    view.innerHTML = h;
    document.getElementById('mSel').onchange = function () { Router.go('expenses', { month: this.value }); };
  }
});

function expenseForm(e) {
  editEntity({
    title: e ? 'Edit expense' : 'Add expense',
    wide: true, rec: e,
    defaults: { date: today(), head: 'misc', mode: 'cash', amount: 0, gst: 0, branchId: (S.branches[0] || {}).id },
    fields: [
      { k: 'date', label: 'Date', type: 'date', required: true },
      { k: 'head', label: 'Expense head', type: 'select', required: true, options: EXPENSE_HEADS },
      { k: 'particulars', label: 'Particulars', required: true, span: 2 },
      { k: 'partyName', label: 'Paid to' },
      { k: 'amount', label: 'Amount', type: 'number', step: '0.01', required: true },
      { k: 'gst', label: 'GST included', type: 'number', step: '0.01' },
      { k: 'mode', label: 'Paid by', type: 'select', options: [['cash', 'Cash'], ['bank', 'Bank'], ['upi', 'UPI'], ['cheque', 'Cheque']] },
      { k: 'bankAccountId', label: 'Bank account', type: 'select', options: bankAccountOptions },
      { k: 'branchId', label: 'Branch', type: 'select', options: branchOptions, required: true },
      { k: 'empId', label: 'Paid by (staff)', type: 'select', options: function () { return empOptions(); } }
    ],
    onSave: function (v, old) {
      var rec = Object.assign({}, old || {}, v);
      if (!old) rec.id = uid('exp');
      upsert('expenses', rec); toast('Expense saved'); Router.render();
    },
    onDelete: function (rec) { removeRec('expenses', rec.id); Router.render(); }
  });
}

</script>
<script>
/* ==== js/service.js ==== */
/* ============================================================
   service.js — job cards & mechanic workload
   ============================================================ */

screen('jobcards', {
  title: 'Job Cards',
  render: function (view, params) {
    var tab = params.tab || 'open';
    var list = S.jobcards.filter(function (j) {
      if (tab === 'all') return true;
      if (tab === 'open') return j.status === 'open' || j.status === 'in_progress';
      return j.status === tab;
    });
    list = sortBy(list, 'date', 'desc');
    var openJobs = S.jobcards.filter(function (j) { return j.status === 'open' || j.status === 'in_progress'; });
    var h = pageHead('Job Cards', [{ label: 'New job card', icon: 'plus', cls: 'primary', onClick: function () { openDocEditor('jobcard'); } }],
      openJobs.length + ' open · ' + S.jobcards.length + ' total');
    h += '<div class="tabs">' + [['open', 'Open'], ['completed', 'Completed'], ['delivered', 'Delivered'], ['all', 'All']].map(function (t) {
      return '<button class="tab ' + (tab === t[0] ? 'on' : '') + '" data-tab="' + t[0] + '">' + t[1] + '</button>';
    }).join('') + '</div>';
    h += '<div class="card tight">';
    if (!list.length) h += '<div class="empty small">No job cards in this list.</div>';
    else h += list.map(function (j) {
      var id = 'jc' + j.id;
      setTimeout(function () {
        var e = document.getElementById(id); if (e) e.onclick = function () { jobActions(j.id); };
      }, 0);
      return '<div class="rowcard" id="' + id + '"><div class="rc-main"><div class="rc-title">' + esc(j.no) + ' · ' + esc(partyName(j.partyId)) +
        ' ' + badge((j.status || '').replace('_', ' '), statusTone(j.status)) + '</div>' +
        '<div class="rc-sub">' + esc(j.chassisNo || (j.unitId ? unitOf(j.unitId).chassisNo : '—')) +
        ' · ' + dmy(j.date) + (j.mechanicId ? ' · ' + esc(empName(j.mechanicId)) : ' · unassigned') + '</div>' +
        '<div class="rc-sub">' + esc((j.complaint || '').slice(0, 60)) + '</div></div>' +
        '<div class="rc-right">' + inr(j.total) + '<small>' + (j.lines || []).length + ' items</small></div></div>';
    }).join('');
    h += '</div>';

    // mechanic workload
    var mechs = S.employees.filter(function (e) { return e.empType === 'mechanic' && e.active !== false; });
    if (mechs.length) {
      h += '<div class="card"><h3>Mechanic workload</h3>' + mechs.map(function (m) {
        var n = S.jobcards.filter(function (j) { return j.mechanicId === m.id && (j.status === 'open' || j.status === 'in_progress'); }).length;
        return '<div class="kv"><span>' + esc(m.name) + '</span><span>' + n + ' open job(s)</span></div>';
      }).join('') + '</div>';
    }
    view.innerHTML = h;
    qsa('[data-tab]', view).forEach(function (b) { b.onclick = function () { Router.go('jobcards', { tab: b.getAttribute('data-tab') }); }; });
  }
});

function jobActions(id) {
  var j = findOne('jobcards', id);
  if (!j) return;
  var m = modal({
    title: j.no,
    body: '<div class="kv"><span>Customer</span><span>' + esc(partyName(j.partyId)) + '</span></div>' +
      '<div class="kv"><span>Chassis</span><span class="mono">' + esc(j.chassisNo || '—') + '</span></div>' +
      '<div class="kv"><span>Complaint</span><span>' + esc(j.complaint || '—') + '</span></div>' +
      '<div class="kv"><span>Mechanic</span><span>' + esc(empName(j.mechanicId) || 'unassigned') + '</span></div>' +
      '<div class="kv"><span>Total</span><span>' + inr(j.total) + '</span></div>' +
      '<div class="section-label">Update status</div><div class="chipset">' +
      [['open', 'Open'], ['in_progress', 'In progress'], ['completed', 'Completed'], ['delivered', 'Delivered'], ['cancelled', 'Cancelled']].map(function (s) {
        return '<button class="chip" data-st="' + s[0] + '" style="' + (j.status === s[0] ? 'background:#0f5132;color:#fff' : '') + '">' + s[1] + '</button>';
      }).join('') + '</div>',
    footer: '<button class="btn ghost" data-view>View</button><button class="btn ghost" data-edit>Edit</button>' +
      '<button class="btn primary" data-inv>Make invoice</button>'
  });
  qsa('[data-st]', m.el).forEach(function (b) {
    b.onclick = function () {
      j.status = b.getAttribute('data-st'); upsert('jobcards', j);
      toast('Status: ' + j.status.replace('_', ' ')); m.close(); Router.render();
    };
  });
  qs('[data-view]', m.el).onclick = function () { m.close(); openDocView('jobcard', id); };
  qs('[data-edit]', m.el).onclick = function () { m.close(); openDocEditor('jobcard', id); };
  qs('[data-inv]', m.el).onclick = function () { m.close(); invoiceFromJob(id); };
}

function invoiceFromJob(id) {
  var j = findOne('jobcards', id);
  if (!j) return;
  openDocEditor('invoice', null, {
    partyId: j.partyId,
    branchId: j.branchId,
    saleType: 'service',
    vehicleNo: j.regNo || j.chassisNo || '',
    salesEmpId: '',
    notes: 'Against job card ' + j.no,
    lines: (j.lines || []).map(function (l) {
      var o = Object.assign({}, l); delete o.unitId; return o;
    })
  });
}

function quoteToInvoice(id) {
  var q = findOne('quotations', id);
  if (!q) return;
  openDocEditor('invoice', null, {
    partyId: q.partyId, branchId: q.branchId, saleType: q.saleType, salesEmpId: q.salesEmpId,
    financerId: q.financerId, marginMoney: q.marginMoney,
    notes: 'Converted from quotation ' + q.no,
    lines: (q.lines || []).map(function (l) { return Object.assign({}, l); })
  });
  q.status = 'accepted'; upsert('quotations', q);
}

</script>
<script>
/* ==== js/hr.js ==== */
/* ============================================================
   hr.js — attendance, salary, TADA, fuel book, logbook, petty cash
   ============================================================ */

/* ================= ATTENDANCE ================= */
screen('attendance', {
  title: 'Attendance',
  render: function (view, params) {
    var date = params.date || today();
    var emps = S.employees.filter(function (e) { return e.active !== false; });
    function rec(empId) { return S.attendance.find(function (a) { return a.empId === empId && a.date === date; }); }
    var month = date.slice(0, 7);
    var monthRecs = S.attendance.filter(function (a) { return String(a.date).slice(0, 7) === month; });

    var h = pageHead('Attendance', [], dmy(date) + ' · ' + emps.length + ' employees');
    h += '<div class="searchbar"><input id="dSel" type="date" value="' + esc(date) + '">' +
      '<button class="btn" id="markAll">All present</button></div>';
    h += '<div class="card tight">';
    if (!emps.length) h += '<div class="empty small">Add employees first.</div>';
    else h += emps.map(function (e) {
      var r = rec(e.id);
      var st = r ? r.status : '';
      return '<div class="rowcard"><div class="rc-main"><div class="rc-title">' + esc(e.name) + '</div>' +
        '<div class="rc-sub">' + esc(e.designation || '') + ' · ' + esc((e.empType || '').toUpperCase()) + '</div></div>' +
        '<div class="rc-right"><div class="chipset">' +
        [['P', 'P'], ['A', 'A'], ['H', 'H'], ['L', 'L']].map(function (s) {
          var bg = st === s[0] ? (s[0] === 'P' ? '#1b8a4b' : s[0] === 'A' ? '#c62828' : s[0] === 'H' ? '#b26a00' : '#1565c0') : '';
          return '<button class="chip" data-emp="' + e.id + '" data-st="' + s[0] + '" style="' +
            (bg ? 'background:' + bg + ';color:#fff' : '') + '">' + s[1] + '</button>';
        }).join('') + '</div></div></div>';
    }).join('');
    h += '</div>';
    h += '<div class="card"><h3>This month</h3>' + barChart([
      { l: 'Present', v: monthRecs.filter(function (a) { return a.status === 'P'; }).length, tone: '' },
      { l: 'Absent', v: monthRecs.filter(function (a) { return a.status === 'A'; }).length, tone: 'red' },
      { l: 'Half day', v: monthRecs.filter(function (a) { return a.status === 'H'; }).length, tone: 'amber' },
      { l: 'Leave', v: monthRecs.filter(function (a) { return a.status === 'L'; }).length, tone: 'blue' }
    ], { fmt: function (v) { return String(v) + ' days'; } }) + '</div>';
    view.innerHTML = h;

    qsa('[data-emp]', view).forEach(function (b) {
      b.onclick = function () {
        var empId = b.getAttribute('data-emp'), st = b.getAttribute('data-st');
        var r = rec(empId);
        if (r) { r.status = st; }
        else S.attendance.push({ id: uid('att'), empId: empId, date: date, status: st, inTime: '09:30', outTime: '18:30' });
        save(); Router.render();
      };
    });
    document.getElementById('dSel').onchange = function () { Router.go('attendance', { date: this.value }); };
    document.getElementById('markAll').onclick = function () {
      emps.forEach(function (e) {
        if (!rec(e.id)) S.attendance.push({ id: uid('att'), empId: e.id, date: date, status: 'P', inTime: '09:30', outTime: '18:30' });
      });
      save(true); toast('All marked present'); Router.render();
    };
  }
});

/* ================= SALARY ================= */
screen('salary', {
  title: 'Salary',
  render: function (view, params) {
    var month = params.month || thisMonth();
    var rows = S.salaries.filter(function (s) { return s.month === month; });
    var emps = S.employees.filter(function (e) { return e.active !== false; });
    var total = sum(rows, 'net');

    var h = pageHead('Salary', [{ label: 'Generate sheet', icon: 'plus', cls: 'primary', onClick: generate }],
      monthName(month.slice(5)) + ' ' + month.slice(0, 4) + ' · ' + inr(total) + ' net');
    h += '<div class="searchbar"><input id="mSel" type="month" value="' + esc(month) + '"></div>';
    h += '<div class="card tight">';
    if (!rows.length) h += '<div class="empty small">No salary sheet for this month. Tap <b>Generate sheet</b>.</div>';
    else h += rows.map(function (s) {
      var id = 'sl' + s.id;
      setTimeout(function () {
        var e = document.getElementById(id); if (e) e.onclick = function () { salaryEdit(s); };
      }, 0);
      return '<div class="rowcard" id="' + id + '"><div class="rc-main"><div class="rc-title">' + esc(empName(s.empId)) + ' ' +
        badge(s.paidOn ? 'PAID' : 'PENDING', s.paidOn ? 'green' : 'amber') + '</div>' +
        '<div class="rc-sub">Basic ' + inr(s.basic) + ' + inc ' + inr(s.incentive) + ' + TADA ' + inr(s.tada) +
        ' − ded ' + inr(s.deduction) + '</div></div>' +
        '<div class="rc-right">' + inr(s.net) + '<small>' + (s.paidOn ? dmy(s.paidOn) : 'unpaid') + '</small></div></div>';
    }).join('');
    h += '</div>';
    h += '<div class="card"><div class="kv"><span>Gross</span><span>' + inr(sum(rows, 'gross')) + '</span></div>' +
      '<div class="kv"><span>Deductions</span><span>' + inr(sum(rows, 'deduction')) + '</span></div>' +
      '<div class="kv"><span>Net payable</span><span>' + inr(total) + '</span></div>' +
      '<div class="kv"><span>Paid</span><span class="green">' + inr(sum(rows.filter(function (r) { return r.paidOn; }), 'net')) + '</span></div></div>';
    view.innerHTML = h;
    document.getElementById('mSel').onchange = function () { Router.go('salary', { month: this.value }); };

    function generate() {
      if (!emps.length) { toast('No employees to pay', 'err'); return; }
      confirmDlg('Generate salary sheet for ' + month + '? Existing entries for the month are replaced.', function () {
        S.salaries = S.salaries.filter(function (s) { return s.month !== month; });
        emps.forEach(function (e) {
          var salesCount = S.invoices.filter(function (i) {
            return i.docType !== 'financer' && i.salesEmpId === e.id && String(i.date).slice(0, 7) === month;
          }).length;
          var incentive = r2(salesCount * num(e.incentiveAmount));
          var tada = sum(S.tada.filter(function (t) { return t.empId === e.id && String(t.date).slice(0, 7) === month && t.status === 'approved'; }), 'total');
          var att = S.attendance.filter(function (a) { return a.empId === e.id && String(a.date).slice(0, 7) === month; });
          var absent = att.filter(function (a) { return a.status === 'A'; }).length;
          var half = att.filter(function (a) { return a.status === 'H'; }).length;
          var perDay = r2(num(e.salary) / 30);
          var lop = r2(perDay * (absent + half * 0.5));
          var gross = r2(num(e.salary) + incentive + tada);
          S.salaries.push({
            id: uid('sal'), empId: e.id, month: month, basic: num(e.salary), incentive: incentive,
            tada: tada, lop: lop, deduction: lop, gross: gross, net: r2(gross - lop),
            absentDays: absent, halfDays: half, paidOn: '', mode: 'bank'
          });
        });
        save(true); toast('Salary sheet generated'); Router.render();
      }, 'Generate');
    }

    function salaryEdit(s) {
      var fields = [
        { k: 'basic', label: 'Basic', type: 'number', step: '0.01' },
        { k: 'incentive', label: 'Incentive', type: 'number', step: '0.01' },
        { k: 'tada', label: 'TADA reimbursement', type: 'number', step: '0.01' },
        { k: 'deduction', label: 'Deductions / LOP', type: 'number', step: '0.01' },
        { k: 'paidOn', label: 'Paid on', type: 'date' },
        { k: 'mode', label: 'Paid by', type: 'select', options: [['bank', 'Bank'], ['cash', 'Cash'], ['upi', 'UPI']] }
      ];
      var m = modal({
        title: 'Salary · ' + empName(s.empId), wide: true,
        body: formHtml(fields, s) + '<div class="js-calc note"></div>',
        footer: '<button class="btn ghost" data-cancel>Cancel</button><button class="btn primary" data-save>Save</button>'
      });
      function calc() {
        var v = readForm(m.el, fields);
        var net = r2(num(v.basic) + num(v.incentive) + num(v.tada) - num(v.deduction));

      }

      calc();
      qs('[data-cancel]', m.el).onclick = m.close;

        var v = readForm(m.el, fields);
        var net = r2(num(v.basic) + num(v.incentive) + num(v.tada) - num(v.deduction));
        Object.assign(s, v, { gross: r2(num(v.basic) + num(v.incentive) + num(v.tada)), net: net });

            id: uid('exp'), date: v.paidOn, head: 'salary', particulars: 'Salary ' + month + ' — ' + empName(s.empId),
            amount: net, gst: 0, mode: v.mode || 'bank', branchId: (S.branches[0] || {}).id, empId: s.empId

<script>
/* ==== js/reports.js ==== */
/* ============================================================
   reports.js — dashboard, P&L, GST returns, cashbook, registers
   ============================================================ */

function monthRange(month) {
  var y = Number(month.slice(0, 4)), m = Number(month.slice(5, 7));
  var last = new Date(y, m, 0).getDate();
  return { from: month + '-01', to: month + '-' + pad(last) };
}
function exportCsv(name, rows) {
  var csv = rows.map(function (r) {
    return r.map(function (c) {
      var s = String(c === undefined || c === null ? '' : c);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(',');
  }).join('\n');
  if (window.AppBridge && window.AppBridge.saveFile) window.AppBridge.saveFile(name, csv);
  else {
    var blob = new Blob([csv], { type: 'text/csv' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; a.click();
  }
  toast('Exported ' + name);
}
function monthList(n) {
  var out = [], d = new Date();
  for (var i = n - 1; i >= 0; i--) {
    var dt = new Date(d.getFullYear(), d.getMonth() - i, 1);
    out.push(dt.getFullYear() + '-' + pad(dt.getMonth() + 1));
  }
  return out;
}

    var trend = monthList(6).map(function (mm) {

      return { l: monthName(mm.slice(5)).slice(0, 3), v: sum(S.invoices.filter(function (i) { return i.docType !== 'financer' && inRange(i.date, r.from, r.to); }), 'total') };

    var recent = sortBy(salesInvoices(), 'date', 'desc').slice(0, 5);
    h += '<div class="card tight"><h3 style="padding:12px 14px 0">Recent invoices <span class="more" id="allInv">View all</span></h3>';
    if (!recent.length) h += '<div class="empty small">No invoices yet</div>';
    else h += recent.map(function (i) {
      var id = 'd' + i.id;
      setTimeout(function () {
        var e = document.getElementById(id); if (e) e.onclick = function () { openDocView('invoice', i.id); };
      }, 0);
      return '<div class="rowcard" id="' + id + '"><div class="rc-main"><div class="rc-title">' + esc(partyName(i.partyId)) + '</div>' +
        '<div class="rc-sub">' + esc(i.no) + ' · ' + dmy(i.date) + '</div></div>' +
        '<div class="rc-right">' + inr(i.total) + '<small>' + docStatusBadge(docStatus(i)) + '</small></div></div>';
    }).join('');
    h += '</div>';

    var renewals = sortBy(S.policies.filter(function (p) { return policyDueStatus(p) === 'due' || policyDueStatus(p) === 'expired'; }), 'dueDate').slice(0, 5);
    if (renewals.length) {
      h += '<div class="card"><h3>Insurance renewals <span class="more" id="allPol">Open insurance</span></h3>' + renewals.map(function (p) {
        var st = policyDueStatus(p);
        return '<div class="kv"><span>' + esc(p.policyNo) + ' · ' + esc(partyName(p.customerId)) + '</span>' +
          '<span class="' + (st === 'expired' ? 'red' : 'amber') + '">' + (st === 'expired' ? 'expired' : 'due ' + dmy(p.dueDate)) + '</span></div>';
      }).join('') + '</div>';
    }

    var follow = sortBy(S.leads.filter(function (l) { return l.nextFollowUp && l.status !== 'won' && l.status !== 'lost'; }), 'nextFollowUp').slice(0, 5);
    if (follow.length) {
      h += '<div class="card"><h3>Follow-ups due</h3>' + follow.map(function (l) {
        return '<div class="kv"><span>' + esc(l.name) + ' · ' + esc(l.phone || '') + '</span><span class="' + (l.nextFollowUp <= today() ? 'red' : '') + '">' + dmy(l.nextFollowUp) + '</span></div>';
      }).join('') + '</div>';
    }
    view.innerHTML = h;
    qsa('[data-gs]', view).forEach(function (b) {
      b.onclick = function () { gs[Number(b.getAttribute('data-gs'))].go(); };
    });
    qsa('[data-q]', view).forEach(function (b) {
      b.onclick = [function () { openDocEditor('invoice'); }, function () { openDocEditor('quotation'); },
        function () { openDocEditor('jobcard'); }, function () { payForm('in'); },
        function () { expenseForm(); }, function () { unitForm(); },
        function () { exchangeForm(); }, function () { policyForm(); }][Number(b.getAttribute('data-q'))];
    });
    var ai = document.getElementById('allInv');
    if (ai) ai.onclick = function () { Router.go('invoices'); };
    var ap = document.getElementById('allPol');
    if (ap) ap.onclick = function () { Router.go('insurance'); };
  }
});

screen('cashbook', {
  title: 'Cashbook',
  render: function (view, params) {
    var month = params.month || thisMonth();
    var rng = monthRange(month);
    var branchF = params.branch || '';
    var entries = [];
    S.payments.forEach(function (p) {
      if (!inRange(p.date, rng.from, rng.to)) return;
      if (branchF && p.branchId !== branchF) return;
      entries.push({ date: p.date, particulars: (p.type === 'in' ? 'Received from ' : 'Paid to ') + partyName(p.partyId) + (p.refDocNo ? ' vs ' + p.refDocNo : ''), mode: p.mode, inAmt: p.type === 'in' ? num(p.amount) : 0, outAmt: p.type === 'out' ? num(p.amount) : 0 });
    });
    S.expenses.forEach(function (e) {
      if (!inRange(e.date, rng.from, rng.to)) return;
      if (branchF && e.branchId !== branchF) return;
      entries.push({ date: e.date, particulars: 'Expense: ' + (e.particulars || e.head), mode: e.mode, inAmt: 0, outAmt: num(e.amount) });
    });
    S.petty.forEach(function (p) {
      if (!inRange(p.date, rng.from, rng.to)) return;
      if (branchF && p.branchId !== branchF) return;
      entries.push({ date: p.date, particulars: 'Petty: ' + (p.particulars || p.head), mode: 'cash', inAmt: p.type === 'receipt' ? num(p.amount) : 0, outAmt: p.type === 'payment' ? num(p.amount) : 0 });
    });
    S.marginReceipts.forEach(function (m) {
      if (!inRange(m.date, rng.from, rng.to)) return;
      if (branchF && m.branchId !== branchF) return;
      entries.push({ date: m.date, particulars: 'Margin money from ' + partyName(m.partyId) + (m.no ? ' (' + m.no + ')' : ''), mode: m.mode || 'bank', inAmt: num(m.amount), outAmt: 0 });
    });
    entries = sortBy(entries, 'date');
    var run = num(settings().cashOpening || 0);
    var rows = entries.map(function (e) {
      run = run + e.inAmt - e.outAmt;
      return Object.assign({}, e, { balance: r2(run) });
    });
    var tin = sum(entries, 'inAmt'), tout = sum(entries, 'outAmt');

    var h = pageHead('Cashbook', [{ label: 'Export', icon: 'download', onClick: function () {
      exportCsv('cashbook-' + month + '.csv', [['Date', 'Particulars', 'Mode', 'In', 'Out', 'Balance']].concat(rows.map(function (r) {
        return [dmy(r.date), r.particulars, r.mode, r.inAmt, r.outAmt, r.balance];
      })));
    } }], month + ' · in ' + inr(tin) + ' · out ' + inr(tout));
    h += '<div class="searchbar"><input id="mSel" type="month" value="' + esc(month) + '">' +
      '<select id="bf" style="border:1px solid #d6dee6;border-radius:12px;padding:10px;background:#fff">' +
      '<option value="">All branches</option>' + S.branches.map(function (b) {
        return '<option value="' + b.id + '"' + (branchF === b.id ? ' selected' : '') + '>' + esc(b.name) + '</option>';
      }).join('') + '</select></div>';
    h += '<div class="stats">' + statCard('Opening', inr(S.meta.cashOpening || 0), 'cash in hand', 'blue') +
      statCard('Receipts', inr(tin), 'money in', 'green') +
      statCard('Payments', inr(tout), 'money out', 'red') +
      statCard('Closing', inr(num(settings().cashOpening || 0) + tin - tout), 'balance', 'amber') + '</div>';
    h += '<div class="card tight"><div class="pad" style="padding:8px 4px 0">' + table({
      cls: 'compact',
      cols: [
        { k: 'date', label: 'Date', render: function (r) { return dmy(r.date); } },
        { k: 'particulars', label: 'Particulars', render: function (r) { return esc(r.particulars) + '<div class="tiny muted">' + esc(r.mode || '') + '</div>'; } },
        { k: 'in', label: 'In', cls: 'num green', render: function (r) { return r.inAmt ? fmt(r.inAmt) : ''; } },
        { k: 'out', label: 'Out', cls: 'num red', render: function (r) { return r.outAmt ? fmt(r.outAmt) : ''; } },
        { k: 'bal', label: 'Bal', cls: 'num', render: function (r) { return fmt(r.balance); } }
      ],
      rows: rows, empty: 'No cash movements this month.'
    }) + '</div></div>';
    view.innerHTML = h;
    document.getElementById('mSel').onchange = function () { Router.go('cashbook', { month: this.value, branch: branchF }); };
    document.getElementById('bf').onchange = function () { Router.go('cashbook', { month: month, branch: this.value }); };
  }
});
