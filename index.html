function agreementForm(a, preset) {
  var rec = a || preset || null;
  var modelFilter = (rec && rec.modelId) || (preset && preset.modelId) || '';
  var makeFilter = (rec && rec.makeId) || '';
  var fields = [
    { k: 'invoiceId', label: 'Against invoice', type: 'select', span: 2, options: function () {
        return S.invoices.filter(function (i) { return i.docType !== 'financer'; })
          .map(function (i) { return { v: i.id, l: i.no + ' · ' + partyName(i.partyId) }; });
      } },
    { k: 'customerId', label: 'Customer', type: 'select', required: true, options: function () { return partyOptions(['customer']); } },
    { k: 'makeId', label: 'Make', type: 'select', placeholder: 'All makes', options: function () {
        return makeOptions().map(function (o) { return [o.v, o.l]; });
      } },
    { k: 'modelId', label: 'Model', type: 'select', placeholder: 'All models', options: function () {
        return modelOptions(makeFilter).map(function (o) { return [o.v, o.l]; });
      } },
    { k: 'unitId', label: 'Tractor unit', type: 'select', span: 2, options: function () { return unitsForModel(modelFilter); } }
  ].concat([
      { k: 'price', label: 'Sale price', type: 'number', step: '0.01', required: true },
      { k: 'advance', label: 'Advance received', type: 'number', step: '0.01' },
      { k: 'financeAmount', label: 'Financed amount', type: 'number', step: '0.01' },
      { k: 'deliveryDate', label: 'Delivery date', type: 'date' },
      { k: 'status', label: 'Status', type: 'select', options: [['draft', 'Draft'], ['signed', 'Signed'], ['cancelled', 'Cancelled']] },
      { k: 'witness1', label: 'Witness 1' },
      { k: 'witness2', label: 'Witness 2' },
      { k: 'terms', label: 'Terms & conditions', type: 'textarea', span: 2, rows: 3,
        def: '1. The buyer has inspected the tractor and accepts its condition.\n2. Balance payment to be made before delivery.\n3. Insurance and registration charges are payable by the buyer.\n4. Warranty as per manufacturer terms.' }
  ]);

  var m = editEntity({
    title: a ? 'Edit agreement' : 'New sale agreement',
    wide: true, isNew: !a, rec: a || null, preset: a ? null : preset,
    defaults: { date: today(), status: 'draft', price: 0, advance: 0, financeAmount: 0, modelId: modelFilter },
    fields: fields,
    onSave: function (v, old) {
      var out = Object.assign({}, old || {}, v);
      out.balance = r2(num(v.price) - num(v.advance) - num(v.financeAmount));
      if (!old) { out.id = uid('agr'); out.no = nextNo('agr', settings().agrPrefix || 'AGR'); }
      if (out.unitId) { var u = unitOf(out.unitId); out.unitChassis = u.chassisNo || u.serialNo || ''; }
      if (out.unitId) {
        var un = unitOf(out.unitId);
        var it = item(un.itemId);
        if (it.modelId) out.modelId = it.modelId;
        out.unitChassis = un.chassisNo || un.serialNo || '';
      }
      upsert('agreements', out); toast('Agreement saved'); Router.render();
    },
    onDelete: function (rec2) { removeRec('agreements', rec2.id); Router.render(); }
  });

  var makeSel2 = qs('[name="makeId"]', m.el);
  var modelSel = qs('[name="modelId"]', m.el);
  var unitSel = qs('[name="unitId"]', m.el);
  if (modelSel && unitSel) {
    if (makeSel2) {
      makeSel2.onchange = function () {
        makeFilter = makeSel2.value;
        modelFilter = '';
        var mopts = modelOptions(makeFilter);
        modelSel.innerHTML = '<option value="">All models</option>' + mopts.map(function (o) {
          return '<option value="' + o.v + '">' + esc(o.l) + '</option>';
        }).join('');
        var uopts = unitsForModel('');
        unitSel.innerHTML = '<option value="">— select unit —</option>' + uopts.map(function (o) {
          return '<option value="' + o.v + '">' + esc(o.l) + '</option>';
        }).join('');
      };
    }
    modelSel.onchange = function () {
      modelFilter = modelSel.value;
      var opts = unitsForModel(modelFilter);
      unitSel.innerHTML = '<option value="">— select unit —</option>' + opts.map(function (o) {
        return '<option value="' + o.v + '">' + esc(o.l) + '</option>';
      }).join('');
    };
    unitSel.onchange = function () {
      var un = unitOf(unitSel.value);
      if (!un.id) return;
      var it = item(un.itemId);
      if (!it.modelId) return;
      var exists = Array.prototype.some.call(modelSel.options, function (o) { return o.value === it.modelId; });
      if (!exists) {
        var mk = makeName(it.makeId);
        modelSel.insertAdjacentHTML('beforeend', '<option value="' + it.modelId + '">' +
          esc(modelName(it.modelId) + (mk ? ' · ' + mk : '')) + '</option>');
      }
      modelSel.value = it.modelId;
      modelFilter = it.modelId;
    };
  }
}

function agreementHtml(a) {
  var o = org(), c = party(a.customerId), u = unitOf(a.unitId);
  var rows = [
    ['Customer', c.name || ''],
    ['Address', (c.address || '') + (c.city ? ', ' + c.city : '')],
    ['Phone', c.phone || ''],
    ['Aadhaar', c.aadhaar || '—'],
    ['PAN', c.pan || '—'],
    ['Vehicle', (u.chassisNo || u.serialNo || '') + (u.engineNo ? ' · Engine ' + u.engineNo : '')],
    ['Model', itemName(u.itemId) + (u.model ? ' ' + u.model : '')],
    ['Sale price', inr(a.price)],
    ['Advance received', inr(a.advance)],
    ['Financed amount', inr(a.financeAmount)],
    ['Balance payable', inr(a.balance)]
  ];
  return '<!doctype html><html><head><meta charset="utf-8"><title>' + xmlEsc(a.no) + '</title><style>' +
    'body{font-family:Georgia,serif;font-size:12px;padding:22px;line-height:1.5}h1{font-size:16px;text-align:center;margin:0 0 4px}' +
    'h2{font-size:12px;text-align:center;font-weight:normal;margin:0 0 16px}table{width:100%;border-collapse:collapse;margin:8px 0}' +
    'td{border:1px solid #bbb;padding:5px 7px;vertical-align:top}td.k{background:#f2f2f2;width:32%;font-weight:bold}' +
    '.sig{display:flex;justify-content:space-between;margin-top:40px}.terms{white-space:pre-line;font-size:11px}' +
    '</style></head><body><h1>' + xmlEsc(o.name || '') + '</h1>' +
    '<h2>SALE AGREEMENT · ' + xmlEsc(a.no) + ' · ' + dmy(a.date) + '</h2>' +
    '<table>' + rows.map(function (r) { return '<tr><td class="k">' + xmlEsc(r[0]) + '</td><td>' + xmlEsc(r[1]) + '</td></tr>'; }).join('') + '</table>' +
    '<p class="terms"><b>Terms &amp; conditions</b><br>' + xmlEsc(a.terms || '') + '</p>' +
    '<div class="sig"><div>Witness 1<br><br>' + xmlEsc(a.witness1 || '') + '</div>' +
    '<div>Witness 2<br><br>' + xmlEsc(a.witness2 || '') + '</div>' +
    '<div>Buyer<br><br>' + xmlEsc(c.name || '') + '</div>' +
    '<div>For ' + xmlEsc(o.name || '') + '<br><br>Authorised signatory</div></div></body></html>';
}

function openAgreement(id) {
  var a = findOne('agreements', id);
  if (!a) return;
  var m = modal({
    title: 'Agreement · ' + a.no,
    wide: true,
    body: '<div class="doc">' + agreementHtml(a).split('<body>')[1].split('</body>')[0] + '</div>',
    footer: '<button class="btn ghost" data-print>' + icon('print') + 'Print / PDF</button>' +
      '<button class="btn ghost" data-edit>Edit</button>' +
      '<button class="btn primary" data-inv>Create invoice</button>'
  });
  qs('[data-print]', m.el).onclick = function () { m.close(); printDoc('agreement', a.id); };
  qs('[data-edit]', m.el).onclick = function () { m.close(); agreementForm(a); };
  qs('[data-inv]', m.el).onclick = function () {
    m.close();
    var u = unitOf(a.unitId);
    openDocEditor('invoice', null, {
      partyId: a.customerId, branchId: (S.branches[0] || {}).id,
      notes: 'Against sale agreement ' + a.no,
      lines: u.id ? [{
        itemId: u.itemId, desc: itemName(u.itemId), hsn: item(u.itemId).hsn,
        qty: 1, rate: num(a.price), discPct: 0, gstRate: item(u.itemId).gstRate, unitId: u.id
      }] : []
    });
  };
}

</script>
<script>
/* ==== js/pdi.js ==== */
/* ============================================================
   pdi.js — pre-delivery inspection sheet
   ============================================================ */

var PDI_YESNO = [['yes', 'Yes'], ['no', 'No']];
var PDI_OIL = [['ok', 'OK'], ['topped', 'Topped up'], ['low', 'Low — attend']];

/* the checks that carry a remark */
var PDI_CHECK_FIELDS = [
  ['hydraulics', 'Hydraulics'],
  ['engine', 'Engine'],
  ['gearbox', 'Gearbox'],
  ['clutchBrakes', 'Clutch / Brakes'],
  ['electricals', 'Electricals'],
  ['clusterAssy', 'Cluster assembly']
];

/* the fitments that are present or not */
var PDI_FIT_FIELDS = [
  ['toolKit', 'Tool kit'],
  ['serviceBook', 'Service book'],
  ['hitch', 'Hitch'],
  ['drawbar', 'Drawbar'],
  ['toplink', 'Toplink'],
  ['frontBed', 'Front bed / bumper']
];

function pdiYesNo(v) { return v === 'yes' ? 'Yes' : v === 'no' ? 'No' : '—'; }

function pdiFields() {
  var f = [
    { type: 'section', label: 'Identification' },
    { k: 'unitId', label: 'Tractor in stock (optional)', type: 'select', span: 2, options: function () {
        return S.units.filter(function (u) { return u.unitKind !== 'implement'; })
          .map(function (u) { return { v: u.id, l: (u.chassisNo || '') + ' · ' + (u.model || itemName(u.itemId)) }; });
      }, help: 'Pick a unit to fill model, chassis, engine and hours' },
    { k: 'date', label: 'Date', type: 'date', required: true },
    { k: 'mechanicId', label: 'Mechanic (PDI by)', type: 'select', options: function () { return empOptions('mechanic'); } },
    { k: 'model', label: 'Model' },
    { k: 'chassisNo', label: 'Chassis number' },
    { k: 'engineNo', label: 'Engine number' },
    { k: 'hours', label: 'Hrs', type: 'number' },

    { type: 'section', label: 'Tyres' },
    { k: 'tyresMake', label: 'Tyres — make', span: 2 },
    { k: 'tyreFL', label: 'FL — number' },
    { k: 'tyreFR', label: 'FR — number' },
    { k: 'tyreRL', label: 'RL — number' },
    { k: 'tyreRR', label: 'RR — number' },

    { type: 'section', label: 'Components' },
    { k: 'boschFipNo', label: 'Bosch FIP' },
    { k: 'starterMotor', label: 'Starter motor' },
    { k: 'alternator', label: 'Alternator' },
    { k: 'batteryMake', label: 'Battery — make' },
    { k: 'batteryNo', label: 'Battery — number' }
  ];

  f.push({ type: 'section', label: 'Checks' });
  PDI_CHECK_FIELDS.forEach(function (c) {
    f.push({ k: c[0], label: c[1], type: 'select', options: PDI_YESNO, def: 'yes' });
    f.push({ k: c[0] + 'Remark', label: c[1] + ' — remark' });
  });

  f.push({ type: 'section', label: 'Oil & fluids' });
  f.push({ k: 'oilLevels', label: 'Oil levels', type: 'select', options: PDI_OIL, def: 'ok' });
  f.push({ k: 'oilLevelsRemark', label: 'Oil — remark' });

  f.push({ type: 'section', label: 'Fitments' });
  PDI_FIT_FIELDS.forEach(function (c) {
    f.push({ k: c[0], label: c[1], type: 'select', options: PDI_YESNO, def: 'yes' });
  });

  f.push({ type: 'section', label: 'Sign off' });
  f.push({ k: 'status', label: 'Result', type: 'select', options: [['pending', 'Pending'], ['passed', 'Passed'], ['failed', 'Failed']], def: 'pending' });
  f.push({ k: 'remarks', label: 'Overall remarks', type: 'textarea', span: 2, rows: 2 });
  return f;
}

screen('pdi', {
  title: 'PDI',
  render: function (view, params) {
    var tab = params.tab || 'all';
    var list = S.pdis.filter(function (p) {
      if (tab === 'pending') return p.status === 'pending';
      if (tab === 'passed') return p.status === 'passed';
      if (tab === 'failed') return p.status === 'failed';
      return true;
    });
    list = sortBy(list, 'date', 'desc');
    var pending = S.pdis.filter(function (p) { return p.status === 'pending'; }).length;
    var passed = S.pdis.filter(function (p) { return p.status === 'passed'; }).length;
    var failed = S.pdis.filter(function (p) { return p.status === 'failed'; }).length;

    var cols = [
      { k: 'no', label: 'PDI no.' }, { k: 'date', label: 'Date' }, { k: 'mechanic', label: 'Mechanic' },
      { k: 'model', label: 'Model' }, { k: 'chassis', label: 'Chassis' }, { k: 'engine', label: 'Engine' },
      { k: 'hrs', label: 'Hrs' }, { k: 'tyres', label: 'Tyres' },
      { k: 'fl', label: 'FL' }, { k: 'fr', label: 'FR' }, { k: 'rl', label: 'RL' }, { k: 'rr', label: 'RR' },
      { k: 'fip', label: 'Bosch FIP' }, { k: 'starter', label: 'Starter motor' }, { k: 'alternator', label: 'Alternator' },
      { k: 'battery', label: 'Battery' }, { k: 'hydraulics', label: 'Hydraulics' }, { k: 'engineChk', label: 'Engine check' },
      { k: 'gearbox', label: 'Gearbox' }, { k: 'oil', label: 'Oil levels' }, { k: 'clutch', label: 'Clutch / brakes' },
      { k: 'electricals', label: 'Electricals' }, { k: 'cluster', label: 'Cluster assy' },
      { k: 'toolkit', label: 'Tool kit' }, { k: 'servicebook', label: 'Service book' },
      { k: 'hitch', label: 'Hitch' }, { k: 'drawbar', label: 'Drawbar' }, { k: 'toplink', label: 'Toplink' },
      { k: 'frontbed', label: 'Front bed / bumper' }, { k: 'status', label: 'Result' }
    ];
    var exportRows = list.map(function (p) {
      return {
        no: p.no, date: dmy(p.date), mechanic: empName(p.mechanicId), model: p.model || itemName(p.itemId),
        chassis: p.chassisNo || '', engine: p.engineNo || '', hrs: num(p.hours),
        tyres: p.tyresMake || '', fl: p.tyreFL || '', fr: p.tyreFR || '', rl: p.tyreRL || '', rr: p.tyreRR || '',
        fip: p.boschFipNo || '', starter: p.starterMotor || '', alternator: p.alternator || '',
        battery: [p.batteryMake, p.batteryNo].filter(Boolean).join(' / '),
        hydraulics: pdiYesNo(p.hydraulics), engineChk: pdiYesNo(p.engine), gearbox: pdiYesNo(p.gearbox),
        oil: p.oilLevels || '', clutch: pdiYesNo(p.clutchBrakes), electricals: pdiYesNo(p.electricals),
        cluster: pdiYesNo(p.clusterAssy),
        toolkit: pdiYesNo(p.toolKit), servicebook: pdiYesNo(p.serviceBook), hitch: pdiYesNo(p.hitch),
        drawbar: pdiYesNo(p.drawbar), toplink: pdiYesNo(p.toplink), frontbed: pdiYesNo(p.frontBed),
        status: p.status || ''
      };
    });

    var h = pageHead('Pre-Delivery Inspection', [
      Export.action('PDI Register', function () { return cols; }, function () { return exportRows; }),
      { label: 'New PDI', icon: 'plus', cls: 'primary', onClick: function () { pdiForm(); } }
    ], list.length + ' sheets · ' + pending + ' pending · ' + passed + ' passed · ' + failed + ' failed');

    h += '<div class="tabs">' + [['all', 'All'], ['pending', 'Pending'], ['passed', 'Passed'], ['failed', 'Failed']].map(function (t) {
      return '<button class="tab ' + (tab === t[0] ? 'on' : '') + '" data-tab="' + t[0] + '">' + t[1] + '</button>';
    }).join('') + '</div>';

    h += '<div class="card tight">';
    if (!list.length) h += '<div class="empty small">No inspection sheets yet. Run a PDI on every tractor before delivery.</div>';
    else h += list.map(function (p) {
      var id = 'pd' + p.id;
      setTimeout(function () {
        var e = document.getElementById(id); if (e) e.onclick = function () { pdiDetail(p.id); };
      }, 0);
      var fails = PDI_CHECK_FIELDS.filter(function (c) { return p[c[0]] === 'no'; }).length +
        PDI_FIT_FIELDS.filter(function (c) { return p[c[0]] === 'no'; }).length;
      return '<div class="rowcard" id="' + id + '"><div class="rc-main"><div class="rc-title">' + esc(p.chassisNo || p.no) +
        ' ' + badge((p.status || 'pending').toUpperCase(), p.status === 'passed' ? 'green' : p.status === 'failed' ? 'red' : 'amber') +
        (fails ? ' ' + badge(fails + ' NOT OK', 'red') : '') + '</div>' +
        '<div class="rc-sub">' + esc(p.model || itemName(p.itemId)) + ' · ' + dmy(p.date) +
        (p.mechanicId ? ' · ' + esc(empName(p.mechanicId)) : '') +
        (p.hours ? ' · ' + fmtQty(p.hours) + ' h' : '') + '</div>' +
        '<div class="rc-sub">' + (p.tyresMake ? esc(p.tyresMake) + ' · ' : '') +
        [p.tyreFL, p.tyreFR, p.tyreRL, p.tyreRR].filter(Boolean).map(esc).join(' / ') + '</div></div>' +
        '<div class="rc-right"><small>' + esc(p.no) + '</small></div></div>';
    }).join('');
    h += '</div>';
    view.innerHTML = h;
    qsa('[data-tab]', view).forEach(function (b) { b.onclick = function () { Router.go('pdi', { tab: b.getAttribute('data-tab') }); }; });
  }
});

function pdiForm(p, presetUnitId) {
  var isNew = !p;
  var rec = p || {};
  if (!p && presetUnitId) {
    var u = unitOf(presetUnitId);
    rec = {
      unitId: presetUnitId, model: u.model || itemName(u.itemId),
      chassisNo: u.chassisNo, engineNo: u.engineNo, hours: u.hours || ''
    };
  }
  editEntity({
    title: isNew ? 'New pre-delivery inspection' : 'Edit PDI',
    wide: true, isNew: isNew, rec: isNew ? null : rec, preset: isNew ? rec : null,
    defaults: {
      date: today(), status: 'pending', oilLevels: 'ok',
      hydraulics: 'yes', engine: 'yes', gearbox: 'yes', clutchBrakes: 'yes',
      electricals: 'yes', clusterAssy: 'yes',
      toolKit: 'yes', serviceBook: 'yes', hitch: 'yes', drawbar: 'yes', toplink: 'yes', frontBed: 'yes'
    },
    fields: pdiFields(),
    onOpen: function (el) {
      var us = el.querySelector('[name="unitId"]');
      if (!us) return;
      us.onchange = function () {
        var u = unitOf(us.value);
        if (!u.id) return;
        var setV = function (n, v) { var e = el.querySelector('[name="' + n + '"]'); if (e) e.value = v; };
        setV('model', u.model || itemName(u.itemId));
        setV('chassisNo', u.chassisNo || '');
        setV('engineNo', u.engineNo || '');
        if (u.hours) setV('hours', u.hours);
      };
    },
    validate: function (v) {
      if (!v.chassisNo) return 'Chassis number is required';
      return null;
    },
    onSave: function (v, old) {
      var out = Object.assign({}, old || {}, v);
      if (!old) { out.id = uid('pdi'); out.no = nextNo('pdi', 'PDI'); }
      upsert('pdis', out);
      toast(old ? 'PDI updated' : 'PDI recorded');
      Router.render();
    },
    onDelete: function (rec2) { removeRec('pdis', rec2.id); toast('PDI deleted'); Router.render(); }
  });
}

function pdiDetail(id) {
  var p = findOne('pdis', id);
  if (!p) return;
  var row = function (k, v) { return '<div class="kv"><span>' + esc(k) + '</span><span>' + (v || '—') + '</span></div>'; };
  var check = function (label, key) {
    var val = p[key];
    var rem = p[key + 'Remark'];
    return '<div class="kv"><span>' + esc(label) + (rem ? '<div class="tiny muted">' + esc(rem) + '</div>' : '') + '</span>' +
      '<span class="' + (val === 'no' ? 'red' : val === 'yes' ? 'green' : '') + '">' + pdiYesNo(val) + '</span></div>';
  };
  var fit = function (label, key) {
    return '<div class="kv"><span>' + esc(label) + '</span><span class="' + (p[key] === 'no' ? 'red' : 'green') + '">' + pdiYesNo(p[key]) + '</span></div>';
  };

  var body =
    '<div class="between"><div><div class="strong">' + esc(p.no) + '</div><div class="small muted">' + dmy(p.date) + '</div></div>' +
    badge((p.status || 'pending').toUpperCase(), p.status === 'passed' ? 'green' : p.status === 'failed' ? 'red' : 'amber') + '</div><hr>' +
    row('Mechanic', esc(empName(p.mechanicId))) +
    row('Model', esc(p.model || itemName(p.itemId))) +
    row('Chassis', '<span class="mono">' + esc(p.chassisNo || '') + '</span>') +
    row('Engine', '<span class="mono">' + esc(p.engineNo || '') + '</span>') +
    row('Hrs', p.hours ? fmtQty(p.hours) : '') +
    '<div class="section-label">Tyres</div>' +
    row('Make', esc(p.tyresMake || '')) +
    row('FL', esc(p.tyreFL || '')) + row('FR', esc(p.tyreFR || '')) +
    row('RL', esc(p.tyreRL || '')) + row('RR', esc(p.tyreRR || '')) +
    '<div class="section-label">Components</div>' +
    row('Bosch FIP', esc(p.boschFipNo || '')) +
    row('Starter motor', esc(p.starterMotor || '')) +
    row('Alternator', esc(p.alternator || '')) +
    row('Battery', esc([p.batteryMake, p.batteryNo].filter(Boolean).join(' / '))) +
    '<div class="section-label">Checks</div>' +
    PDI_CHECK_FIELDS.map(function (c) { return check(c[1], c[0]); }).join('') +
    row('Oil levels', esc(p.oilLevels || '') + (p.oilLevelsRemark ? ' · ' + esc(p.oilLevelsRemark) : '')) +
    '<div class="section-label">Fitments</div>' +
    PDI_FIT_FIELDS.map(function (c) { return fit(c[1], c[0]); }).join('') +
    (p.remarks ? '<div class="note">' + esc(p.remarks) + '</div>' : '');

  var m = modal({
    title: 'PDI · ' + (p.chassisNo || p.no),
    wide: true, body: body,
    footer: '<button class="btn ghost" data-print>' + icon('print') + 'PDF</button>' +
      '<button class="btn ghost" data-edit>Edit</button>' +
      '<button class="btn primary" data-close>Done</button>'
  });
  qs('[data-close]', m.el).onclick = m.close;
  qs('[data-edit]', m.el).onclick = function () { m.close(); pdiForm(p); };
  qs('[data-print]', m.el).onclick = function () { m.close(); printDoc('pdi', p.id); };
}

</script>
<script>
/* ==== js/printdocs.js ==== */
/* ============================================================
   printdocs.js — one print / PDF engine for every document type,
   plus the Documents hub with single and bulk printing
   ============================================================ */

function docHead(title, no, date, extra) {
  var o = org();
  return '<table class="hdr"><tr><td><div class="org">' + xmlEsc(o.name || '') + '</div>' +
    '<div class="sm">' + xmlEsc(o.address || '') + '</div>' +
    '<div class="sm">GSTIN: ' + xmlEsc(o.gstin || '—') + ' · ' + xmlEsc(stateName(o.stateCode) || '') + '</div>' +
    (o.phone ? '<div class="sm">Ph: ' + xmlEsc(o.phone) + '</div>' : '') + '</td>' +
    '<td class="right"><div class="doctype">' + xmlEsc(title.toUpperCase()) + '</div>' +
    '<div class="strong">' + xmlEsc(no || '') + '</div><div class="sm">' + dmy(date) + '</div>' +
    (extra ? '<div class="sm">' + extra + '</div>' : '') + '</td></tr></table>';
}

function docPartyBox(label, p) {
  return '<div class="box"><div class="sm">' + xmlEsc(label) + '</div><div class="strong">' + xmlEsc(p.name || '') + '</div>' +
    (p.address ? '<div class="sm">' + xmlEsc(p.address) + '</div>' : '') +
    (p.phone ? '<div class="sm">Ph: ' + xmlEsc(p.phone) + '</div>' : '') +
    (p.gstin ? '<div class="sm">GSTIN: ' + xmlEsc(p.gstin) + '</div>' : '') + '</div>';
}

function docPage(title, inner) {
  return '<div class="sheet"><div class="pagetitle">' + xmlEsc(title) + '</div>' + inner +
    '<div class="foot">Generated by Tractor ERP · ' + dmy(today()) + '</div></div>';
}

function docShell(body) {
  return '<!doctype html><html><head><meta charset="utf-8"><style>' +
    '*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#111;margin:0;padding:16px}' +
    '.sheet{padding:2px}' +
    '.pagetitle{display:none}' +
    'table{width:100%;border-collapse:collapse}' +
    'table.hdr td{border:0;padding:0 0 6px;vertical-align:top}' +
    '.org{font-size:16px;font-weight:bold}' +
    '.doctype{font-size:12px;font-weight:bold;letter-spacing:.5px}' +
    '.strong{font-weight:bold}' +
    '.sm{font-size:10px;color:#555}' +
    '.right{text-align:right}' +
    '.box{border:1px solid #ccc;padding:7px;margin:8px 0}' +
    'table.lines th{background:#eef3ef;text-align:left;padding:5px 6px;border-bottom:1px solid #999;font-size:9.5px;text-transform:uppercase}' +
    'table.lines td{padding:4px 6px;border-bottom:1px solid #e2e2e2;vertical-align:top}' +
    'table.lines td.num,table.lines th.num{text-align:right}' +
    '.tot{margin-left:auto;width:270px;margin-top:8px}' +
    '.tot td{padding:3px 0;border:0}' +
    '.grand{border-top:1.5px solid #222;font-weight:bold;font-size:12px}' +
    '.kv{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #eee}' +
    '.note{border-left:3px solid #0f5132;background:#f6f9f7;padding:6px 8px;margin-top:8px;font-size:10px}' +
    '.foot{margin-top:14px;border-top:1px solid #ddd;padding-top:5px;font-size:9px;color:#777}' +
    '.sig{margin-top:34px;font-size:10px}' +
    '.pagebreak{page-break-after:always}' +
    '</style></head><body>' + body + '</body></html>';
}

/* ---------------- per-document builders ---------------- */
var DOC_BUILD = {
  invoice: function (id) { return printable('invoice', id); },
  quotation: function (id) { return printable('quotation', id); },
  purchase: function (id) { return printable('purchase', id); },
  jobcard: function (id) { return printable('jobcard', id); },
  financer: function (id) { return printable('financer', id); },
  margin: function (id) { return printable('margin', id); },

  creditnote: function (id) { return noteDoc(id); },
  debitnote: function (id) { return noteDoc(id); },

  payment: function (id) {
    var p = findOne('payments', id);
    if (!p) return '';
    var pt = party(p.partyId);
    var doc = p.refId ? (p.type === 'in' ? findOne('invoices', p.refId) : findOne('purchases', p.refId)) : null;
    var inner = docHead(p.type === 'in' ? 'Receipt' : 'Payment Voucher', p.no, p.date,
      (p.mode || '').toUpperCase() + (p.refNo ? ' · ' + xmlEsc(p.refNo) : '')) +
      docPartyBox(p.type === 'in' ? 'Received from' : 'Paid to', pt) +
      '<table class="lines"><tr><td class="strong">Particulars</td><td class="num strong">Amount</td></tr>' +
      '<tr><td>' + (p.type === 'in' ? 'Amount received' : 'Amount paid') +
      (doc ? ' against ' + xmlEsc(doc.no) : ' on account') +
      (p.note ? '<div class="sm">' + xmlEsc(p.note) + '</div>' : '') + '</td>' +
      '<td class="num">' + fmt(p.amount) + '</td></tr></table>' +
      '<table class="tot"><tr class="grand"><td>Total</td><td class="right">' + inr(p.amount) + '</td></tr></table>' +
      '<div class="note"><b>Amount in words:</b> ' + xmlEsc(numToWords(p.amount)) + '</div>' +
      (doc ? '<div class="kv"><span>Against document ' + xmlEsc(doc.no) + '</span><span>Balance ' +
        inr(p.type === 'in' ? invoiceOutstanding(doc) : purchaseOutstanding(doc)) + '</span></div>' : '') +
      '<div class="sig">For ' + xmlEsc(org().name || '') + '<br><br><br>Authorised signatory</div>';
    return docShell(docPage('Receipt', inner));
  },

  exchange: function (id) {
    var x = findOne('exchanges', id);
    if (!x) return '';
    var inv = x.invoiceId ? findOne('invoices', x.invoiceId) : null;
    var inner = docHead('Exchange / Trade-in Voucher', x.no, x.date, '') +
      docPartyBox('Customer', party(x.customerId)) +
      '<table class="lines"><tr><th>Old tractor</th><th>Details</th></tr>' +
      '<tr><td>Model</td><td>' + xmlEsc(x.oldModel || itemName(x.itemId)) + '</td></tr>' +
      '<tr><td>Chassis no.</td><td>' + xmlEsc(x.chassisNo || '') + '</td></tr>' +
      '<tr><td>Engine no.</td><td>' + xmlEsc(x.engineNo || '') + '</td></tr>' +
      '<tr><td>Year / hours</td><td>' + xmlEsc(x.mfgYear || '—') + ' · ' + fmtQty(x.hours || 0) + ' h</td></tr>' +
      '<tr><td>Condition</td><td>' + xmlEsc(x.condition || '') + '</td></tr></table>' +
      '<table class="tot"><tr><td>Exchange valuation</td><td class="right">' + fmt(x.value) + '</td></tr>' +
      '<tr class="grand"><td>Value taken in</td><td class="right">' + inr(x.value) + '</td></tr></table>' +
      '<div class="note">Settlement: ' + (x.settle === 'pay' ? 'paid to the customer' : 'adjusted against ' + (inv ? xmlEsc(inv.no) : 'the sale')) +
      '. No GST is charged on a trade-in valuation.</div>' +
      '<div class="sig">For ' + xmlEsc(org().name || '') + '<br><br><br>Authorised signatory</div>';
    return docShell(docPage('Exchange', inner));
  },

  agreement: function (id) {
    var a = findOne('agreements', id);
    return a ? agreementHtml(a) : '';
  },

  advance: function (id) {
    var a = findOne('tradeAdvances', id);
    if (!a) return '';
    var reps = a.repayments || [];
    var inner = docHead('Trade Advance Statement', a.no, a.date, a.direction === 'paid' ? 'Advance paid out' : 'Advance received') +
      docPartyBox('Party', party(a.partyId)) +
      '<table class="lines">' +
      '<tr><td>Principal</td><td class="num">' + fmt(a.principal) + '</td></tr>' +
      '<tr><td>Interest rate</td><td class="num">' + num(a.interestRate) + '% p.a.</td></tr>' +
      '<tr><td>Start date</td><td class="num">' + dmy(a.startDate) + '</td></tr>' +
      '<tr><td>Close date</td><td class="num">' + (a.closeDate ? dmy(a.closeDate) : 'running') + '</td></tr>' +
      '<tr><td>Days elapsed</td><td class="num">' + advanceDays(a) + '</td></tr>' +
      '<tr><td>IFTA (interest free) days</td><td class="num">' + num(a.iftaDays) + '</td></tr>' +
      '<tr><td>Chargeable days</td><td class="num">' + advanceChargeableDays(a) + '</td></tr>' +
      '<tr><td>Interest accrued</td><td class="num">' + fmt(advanceInterest(a)) + '</td></tr>' +
      '<tr><td>Repaid</td><td class="num">' + fmt(advanceRepaid(a)) + '</td></tr></table>' +
      '<table class="tot"><tr class="grand"><td>Balance</td><td class="right">' + inr(advanceBalance(a)) + '</td></tr></table>' +
      (reps.length ? '<div class="sm" style="margin-top:10px"><b>Repayments</b></div><table class="lines">' +
        reps.map(function (r) {
          return '<tr><td>' + dmy(r.date) + '</td><td>' + xmlEsc(r.mode || '') + ' ' + xmlEsc(r.note || '') + '</td>' +
            '<td class="num">' + fmt(r.amount) + '</td></tr>';
        }).join('') + '</table>' : '') +
      '<div class="sig">For ' + xmlEsc(org().name || '') + '<br><br><br>Authorised signatory</div>';
    return docShell(docPage('Trade advance', inner));
  },

  pdi: function (id) { return pdiDoc(id); },

  warranty: function (id) {
    var w = findOne('warranties', id);
    if (!w) return '';
    var claims = w.claims || [];
    var inner = docHead('Warranty Certificate', w.id.slice(-6).toUpperCase(), w.startDate, '') +
      docPartyBox('Customer', party(w.customerId)) +
      '<table class="lines">' +
      '<tr><td>Unit</td><td>' + xmlEsc(w.unitChassis || '') + '</td></tr>' +
      '<tr><td>Provider</td><td>' + xmlEsc(w.provider || '') + '</td></tr>' +
      '<tr><td>Type</td><td>' + xmlEsc(w.type || 'standard') + '</td></tr>' +
      '<tr><td>Cover</td><td>' + dmy(w.startDate) + ' to ' + dmy(w.endDate) + '</td></tr>' +
      (num(w.hoursLimit) ? '<tr><td>Hour limit</td><td>' + fmtQty(w.hoursLimit) + ' h</td></tr>' : '') +
      '</table>' +
      (claims.length ? '<div class="sm" style="margin-top:10px"><b>Claims</b></div><table class="lines">' +
        claims.map(function (c) {
          return '<tr><td>' + dmy(c.date) + '</td><td>' + xmlEsc(c.complaint || '') + '</td>' +
            '<td>' + xmlEsc(c.status || '') + '</td><td class="num">' + fmt(c.cost) + '</td></tr>';
        }).join('') + '</table>' : '') +
      (w.notes ? '<div class="note">' + xmlEsc(w.notes) + '</div>' : '') +
      '<div class="sig">For ' + xmlEsc(org().name || '') + '<br><br><br>Authorised signatory</div>';
    return docShell(docPage('Warranty', inner));
  }
};

function pdiDoc(id) {
  var p = findOne('pdis', id);
  if (!p) return '';
  var tick = function (v) { return v === 'yes' ? '&#10003; Yes' : v === 'no' ? '&#10007; No' : '—'; };
  var cell = function (label, key) {
    var rem = p[key + 'Remark'] || '';
    return '<tr><td class="lbl">' + xmlEsc(label) + '</td>' +
      '<td class="chk ' + (p[key] === 'no' ? 'bad' : '') + '">' + tick(p[key]) + '</td>' +
      '<td>' + xmlEsc(rem) + '</td></tr>';
  };
  var fitRow = function (label, key) {
    return '<tr><td class="lbl">' + xmlEsc(label) + '</td>' +
      '<td class="chk ' + (p[key] === 'no' ? 'bad' : '') + '" colspan="2">' + tick(p[key]) + '</td></tr>';
  };

  var inner = docHead('Pre-Delivery Inspection', p.no, p.date, (p.status || '').toUpperCase()) +
    '<table class="lines idtable">' +
    '<tr><td class="lbl">Mechanic</td><td>' + xmlEsc(empName(p.mechanicId) || '—') + '</td>' +
    '<td class="lbl">Hrs</td><td>' + xmlEsc(p.hours ? fmtQty(p.hours) : '—') + '</td></tr>' +
    '<tr><td class="lbl">Model</td><td>' + xmlEsc(p.model || itemName(p.itemId)) + '</td>' +
    '<td class="lbl">Date</td><td>' + dmy(p.date) + '</td></tr>' +
    '<tr><td class="lbl">Chassis no.</td><td class="mono">' + xmlEsc(p.chassisNo || '') + '</td>' +
    '<td class="lbl">Engine no.</td><td class="mono">' + xmlEsc(p.engineNo || '') + '</td></tr>' +
    '</table>' +

    '<div class="sec">Tyres — ' + xmlEsc(p.tyresMake || '') + '</div>' +
    '<table class="lines"><tr><th>FL</th><th>FR</th><th>RL</th><th>RR</th></tr>' +
    '<tr><td>' + xmlEsc(p.tyreFL || '') + '</td><td>' + xmlEsc(p.tyreFR || '') + '</td>' +
    '<td>' + xmlEsc(p.tyreRL || '') + '</td><td>' + xmlEsc(p.tyreRR || '') + '</td></tr></table>' +

    '<div class="sec">Components</div>' +
    '<table class="lines">' +
    '<tr><td class="lbl">Bosch FIP</td><td>' + xmlEsc(p.boschFipNo || '') + '</td>' +
    '<td class="lbl">Starter motor</td><td>' + xmlEsc(p.starterMotor || '') + '</td></tr>' +
    '<tr><td class="lbl">Alternator</td><td>' + xmlEsc(p.alternator || '') + '</td>' +
    '<td class="lbl">Battery</td><td>' + xmlEsc([p.batteryMake, p.batteryNo].filter(Boolean).join(' / ')) + '</td></tr>' +
    '</table>' +

    '<div class="sec">Checks</div>' +
    '<table class="lines chk-table"><tr><th>Item</th><th>OK</th><th>Remark</th></tr>' +
    PDI_CHECK_FIELDS.map(function (c) { return cell(c[1], c[0]); }).join('') +
    '<tr><td class="lbl">Oil levels</td><td class="chk">' + xmlEsc(p.oilLevels || '—') + '</td><td>' + xmlEsc(p.oilLevelsRemark || '') + '</td></tr>' +
    '</table>' +

    '<div class="sec">Fitments</div>' +
    '<table class="lines chk-table"><tr><th>Item</th><th colspan="2">Present</th></tr>' +
    PDI_FIT_FIELDS.map(function (c) { return fitRow(c[1], c[0]); }).join('') +
    '</table>' +

    (p.remarks ? '<div class="note">' + xmlEsc(p.remarks) + '</div>' : '') +
    '<div class="sig">PDI by ' + xmlEsc(empName(p.mechanicId) || '____________') +
    ' &nbsp;&nbsp;&nbsp;&nbsp; Signature ____________ &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ' +
    'For ' + xmlEsc(org().name || '') + '<br>Authorised signatory</div>';

  var html = docShell(docPage('PDI', inner));
  html = html.replace('</style>', '.lbl{color:#555;width:26%}.chk{font-weight:bold}.chk.bad{color:#b3261e}' +
    '.sec{margin:9px 0 3px;font-weight:bold;font-size:11px;border-bottom:1px solid #bbb;padding-bottom:2px}' +
    '.idtable td{padding:3px 6px}.chk-table td{padding:4px 6px}</style>');
  return html;
}

function noteDoc(id) {
  var n = findOne('notes', id);
  if (!n) return '';
  var pt = party(n.partyId);
  var isCredit = n.type === 'credit';
  var inter = isInterState(pt);
  var inner = docHead(isCredit ? 'Credit Note' : 'Debit Note', n.no, n.date, n.refDocNo ? 'Against ' + xmlEsc(n.refDocNo) : '') +
    docPartyBox(isCredit ? 'Credit to' : 'Debit to', pt) +
    '<table class="lines"><tr><th>Particulars</th><th class="num">Amount</th></tr>' +
    '<tr><td>' + xmlEsc(n.reason || '') + '</td><td class="num">' + fmt(n.taxable) + '</td></tr></table>' +
    '<table class="tot">' +
    '<tr><td>Taxable value</td><td class="right">' + fmt(n.taxable) + '</td></tr>' +
    (inter ? '<tr><td>IGST</td><td class="right">' + fmt(n.tax) + '</td></tr>'
      : '<tr><td>CGST</td><td class="right">' + fmt(num(n.tax) / 2) + '</td></tr>' +
        '<tr><td>SGST</td><td class="right">' + fmt(num(n.tax) / 2) + '</td></tr>') +
    '<tr class="grand"><td>Total</td><td class="right">' + inr(n.total) + '</td></tr></table>' +
    '<div class="note"><b>Amount in words:</b> ' + xmlEsc(numToWords(n.total)) + '</div>' +
    '<div class="sig">For ' + xmlEsc(org().name || '') + '<br><br><br>Authorised signatory</div>';
  return docShell(docPage(isCredit ? 'Credit note' : 'Debit note', inner));
}

/* ---------------- print / preview ---------------- */
function docHtml(kind, id) {
  var fn = DOC_BUILD[kind];
  if (!fn) return '';
  try { return fn(id); } catch (e) { console.error(e); return ''; }
}

function printDoc(kind, id) {
  var html = docHtml(kind, id);
  if (!html) { toast('Nothing to print for this document', 'err'); return; }
  if (window.AppBridge && window.AppBridge.printHtml) {
    window.AppBridge.printHtml(html);
    toast('Choose "Save as PDF" in the print dialog');
  } else {
    var w = window.open('', '_blank');
    if (w) { w.document.write(html); w.document.close(); w.print(); }
    else window.print();
  }
}

function previewDoc(kind, id) {
  var html = docHtml(kind, id);
  if (!html) { toast('Nothing to show', 'err'); return; }
  var m = modal({
    title: 'Preview',
    wide: true,
    body: '<iframe class="docframe" style="width:100%;height:62vh;border:1px solid #dde3e8;border-radius:10px;background:#fff"></iframe>',
    footer: '<button class="btn ghost" data-close2>Close</button><button class="btn primary" data-print>' + icon('print') + 'PDF / Print</button>'
  });
  var frame = qs('.docframe', m.el);
  if (frame) frame.setAttribute('srcdoc', html);
  qs('[data-close2]', m.el).onclick = m.close;
  qs('[data-print]', m.el).onclick = function () { m.close(); printDoc(kind, id); };
}

/* bulk: several documents into one PDF */
function printMany(items) {
  if (!items.length) { toast('Select at least one document', 'err'); return; }
  var parts = items.map(function (it) {
    var html = docHtml(it.kind, it.id);
    if (!html) return '';
    var body = html.split('<body>')[1];
    body = body ? body.split('</body>')[0] : '';
    return '<div class="pagebreak">' + body + '</div>';
  }).filter(Boolean);
  if (!parts.length) { toast('Nothing to print', 'err'); return; }
  var html = docShell(parts.join(''));
  if (window.AppBridge && window.AppBridge.printHtml) {
    window.AppBridge.printHtml(html);
    toast(items.length + ' document(s) sent to print');
  } else {
    var w = window.open('', '_blank');
    if (w) { w.document.write(html); w.document.close(); w.print(); }
  }
}

/* ---------------- documents hub ---------------- */
function allDocuments() {
  var out = [];
  S.invoices.forEach(function (i) {
    out.push({
      kind: i.docType === 'financer' ? 'financer' : 'invoice', id: i.id, date: i.date, no: i.no,
      type: i.docType === 'financer' ? 'Financer invoice' : 'Invoice',
      party: partyName(i.partyId), amount: num(i.total)
    });
  });
  S.marginReceipts.forEach(function (m) {
    out.push({ kind: 'margin', id: m.id, date: m.date, no: m.no, type: 'Margin receipt', party: partyName(m.partyId), amount: num(m.amount) });
  });
  S.quotations.forEach(function (q) {
    out.push({ kind: 'quotation', id: q.id, date: q.date, no: q.no, type: 'Quotation', party: partyName(q.partyId), amount: num(q.total) });
  });
  S.purchases.forEach(function (p) {
    out.push({ kind: 'purchase', id: p.id, date: p.date, no: p.no, type: 'Purchase bill', party: partyName(p.partyId), amount: num(p.total) });
  });
  S.jobcards.forEach(function (j) {
    out.push({ kind: 'jobcard', id: j.id, date: j.date, no: j.no, type: 'Job card', party: partyName(j.partyId), amount: num(j.total) });
  });
  S.notes.forEach(function (n) {
    out.push({
      kind: n.type === 'credit' ? 'creditnote' : 'debitnote', id: n.id, date: n.date, no: n.no,
      type: n.type === 'credit' ? 'Credit note' : 'Debit note', party: partyName(n.partyId), amount: num(n.total)
    });
  });
  S.payments.forEach(function (p) {
    out.push({

screen('documents', {
  title: 'Documents & Print',
  render: function (view, params) {
    var month = params.month || thisMonth();
    var rng = monthRange(month);
    var typeF = params.type || 'all';
    var q = params.q || '';
    var all = allDocuments().filter(function (d) { return inRange(d.date, rng.from, rng.to); });
    var types = [];
    all.forEach(function (d) { if (types.indexOf(d.type) === -1) types.push(d.type); });
    var list = all.filter(function (d) {
      if (typeF !== 'all' && d.type !== typeF) return false;
      if (!q) return true;
      return (d.no + ' ' + d.party + ' ' + d.type).toLowerCase().indexOf(q.toLowerCase()) > -1;
    });

    var h = pageHead('Documents & Print', [{
      label: 'Print all', icon: 'print', cls: 'primary',

          printMany(list.map(function (d) { return { kind: d.kind, id: d.id }; }));
        }, 'Print all');
      }
    }], list.length + ' documents · ' + month);

    h += '<div class="searchbar"><input id="mSel" type="month" value="' + esc(month) + '">' +
      '<input id="dq" placeholder="Search no. or party…" value="' + esc(q) + '"></div>';

    }).join('') + '</div>';

    h += '<div class="card tight">';
    if (!list.length) h += '<div class="empty small">No documents in this period.</div>';
    else h += list.map(function (d) {
      var key = d.kind + '_' + d.id;
      var id = 'dc' + key.replace(/[^a-z0-9]/gi, '');
      setTimeout(function () {
        var row = document.getElementById(id);
        if (!row) return;
        var cb = row.querySelector('[data-pick]');
        if (cb) cb.onchange = function () { if (cb.checked) picked[key] = d; else delete picked[key]; };
        var pv = row.querySelector('[data-preview]');
        if (pv) pv.onclick = function (ev) { ev.stopPropagation(); previewDoc(d.kind, d.id); };
        var pr = row.querySelector('[data-printone]');
        if (pr) pr.onclick = function (ev) { ev.stopPropagation(); printDoc(d.kind, d.id); };
      }, 0);
      return '<div class="rowcard" id="' + id + '">' +
        '<input type="checkbox" data-pick="' + key + '" style="width:20px;height:20px;margin-right:4px">' +
        '<div class="rc-main"><div class="rc-title">' + esc(d.no) + ' · ' + esc(d.party) + '</div>' +
        '<div class="rc-sub">' + esc(d.type) + ' · ' + dmy(d.date) + '</div></div>' +
        '<div class="rc-right">' + (d.amount ? inr(d.amount) : '') +
        '<div style="margin-top:4px"><button class="btn sm" data-preview>View</button> ' +
        '<button class="btn sm primary" data-printone>' + icon('print') + '</button></div></div></div>';
    }).join('');
    h += '</div>';

    h += '<div class="card"><h3>Bulk print</h3>' +
      '<div class="tiny muted">Tick documents above, then print them together as a single PDF.</div>' +
      '<button class="btn primary block" id="bulkPrint" style="margin-top:10px">Print selected</button></div>';

    view.innerHTML = h;
    var picked = {};

    document.getElementById('mSel').onchange = function () { Router.go('documents', { month: this.value, type: typeF }); };
    var dq = document.getElementById('dq');
    dq.oninput = function () { clearTimeout(dq._t); dq._t = setTimeout(function () { Router.go('documents', { month: month, type: typeF, q: dq.value }); }, 300); };
    qsa('[data-type]', view).forEach(function (b) {
      b.onclick = function () { Router.go('documents', { month: month, type: b.getAttribute('data-type') }); };
    });
    document.getElementById('bulkPrint').onclick = function () {
      var items = Object.keys(picked).map(function (k) { return { kind: picked[k].kind, id: picked[k].id }; });
      if (!items.length) { toast('Tick at least one document', 'err'); return; }
      printMany(items);
    };
  }
});

<script>
/* ==== js/dataio.js ==== */
/* ============================================================
   dataio.js — bulk import / export in Excel formats and
   Tally-compatible XML export
   ============================================================ */

/* ---------------- table parsers ---------------- */
function parseCsv(text) {
  var rows = [], row = [], cur = '', q = false;
  text = String(text).replace(/^\uFEFF/, '');
  for (var i = 0; i < text.length; i++) {
    var ch = text[i];
    if (q) {
      if (ch === '"') {
        if (text[i + 1] === '"') { cur += '"'; i++; }
        else q = false;
      } else cur += ch;
    } else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cur); cur = ''; }
    else if (ch === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (ch === '\r') { /* skip */ }
    else cur += ch;
  }
  if (cur.length || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(function (r) { return r.some(function (c) { return String(c).trim() !== ''; }); });
}

function parseSpreadsheetXml(text) {
  var doc = new DOMParser().parseFromString(text, 'text/xml');
  var rows = [];
  var rowEls = doc.getElementsByTagName('Row');
  for (var i = 0; i < rowEls.length; i++) {
    var cells = rowEls[i].getElementsByTagName('Cell');
    var out = [];
    for (var j = 0; j < cells.length; j++) {
      var data = cells[j].getElementsByTagName('Data');
      out.push(data.length ? data[0].textContent : '');
    }
    rows.push(out);
  }
  return rows.filter(function (r) { return r.some(function (c) { return String(c).trim() !== ''; }); });
}

async function inflateRaw(bytes) {
  if (typeof DecompressionStream === 'undefined') throw new Error('This device cannot read .xlsx — save the sheet as CSV instead');
  var ds = new DecompressionStream('deflate-raw');
  var stream = new Blob([bytes]).stream().pipeThrough(ds);
  var buf = await new Response(stream).arrayBuffer();
  return new Uint8Array(buf);
}

async function readXlsx(file) {
  var buf = new Uint8Array(await file.arrayBuffer());
  var dv = new DataView(buf.buffer);
  // end of central directory
  var eocd = -1;
  for (var i = buf.length - 22; i >= 0 && i > buf.length - 66000; i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('Not a valid .xlsx file');
  var entries = dv.getUint16(eocd + 10, true);
  var offset = dv.getUint32(eocd + 16, true);
  var files = {};
  for (var n = 0; n < entries; n++) {
    if (dv.getUint32(offset, true) !== 0x02014b50) break;
    var method = dv.getUint16(offset + 10, true);
    var compSize = dv.getUint32(offset + 20, true);
    var nameLen = dv.getUint16(offset + 28, true);
    var extraLen = dv.getUint16(offset + 30, true);
    var commLen = dv.getUint16(offset + 32, true);
    var localOff = dv.getUint32(offset + 42, true);
    var name = new TextDecoder().decode(buf.subarray(offset + 46, offset + 46 + nameLen));
    files[name] = { method: method, compSize: compSize, localOff: localOff };
    offset += 46 + nameLen + extraLen + commLen;
  }
  async function get(name) {
    var f = files[name];
    if (!f) return '';
    var lo = f.localOff;
    var nLen = dv.getUint16(lo + 26, true);
    var eLen = dv.getUint16(lo + 28, true);
    var start = lo + 30 + nLen + eLen;
    var raw = buf.subarray(start, start + f.compSize);
    var out = f.method === 0 ? raw : await inflateRaw(raw);
    return new TextDecoder().decode(out);
  }
  var sheetName = Object.keys(files).filter(function (k) { return /^xl\/worksheets\/sheet1\.xml$/.test(k); })[0]
    || Object.keys(files).filter(function (k) { return /^xl\/worksheets\/.*\.xml$/.test(k); })[0];
  if (!sheetName) throw new Error('No worksheet found in the workbook');
  var shared = [];
  var ssXml = await get('xl/sharedStrings.xml');
  if (ssXml) {
    var sdoc = new DOMParser().parseFromString(ssXml, 'text/xml');
    var sis = sdoc.getElementsByTagName('si');
    for (var s = 0; s < sis.length; s++) {
      var ts = sis[s].getElementsByTagName('t');
      var txt = '';
      for (var t = 0; t < ts.length; t++) txt += ts[t].textContent;
      shared.push(txt);
    }
  }
  var sdoc2 = new DOMParser().parseFromString(await get(sheetName), 'text/xml');
  var rowEls = sdoc2.getElementsByTagName('row');
  var rows = [];
  for (var r = 0; r < rowEls.length; r++) {
    var cells = rowEls[r].getElementsByTagName('c');
    var out = [];
    for (var c = 0; c < cells.length; c++) {
      var ref = cells[c].getAttribute('r') || '';
      var colIdx = 0;
      for (var k = 0; k < ref.length; k++) {
        var code = ref.charCodeAt(k);
        if (code >= 65 && code <= 90) colIdx = colIdx * 26 + (code - 64);
        else break;
      }
      var type = cells[c].getAttribute('t');
      var v = cells[c].getElementsByTagName('v')[0];
      var val = v ? v.textContent : '';
      if (type === 's') val = shared[Number(val)] || '';
      else if (type === 'inlineStr') {
        var is = cells[c].getElementsByTagName('t')[0];
        val = is ? is.textContent : '';
      }
      while (out.length < colIdx - 1) out.push('');
      out[colIdx - 1] = val;
    }
    rows.push(out);
  }
  return rows.filter(function (r) { return r.some(function (c) { return String(c).trim() !== ''; }); });
}

async function readTable(file) {
  var name = (file.name || '').toLowerCase();
  if (name.endsWith('.xlsx')) return await readXlsx(file);
  var text = await file.text();
  if (text.indexOf('<Workbook') > -1 || text.indexOf('<ss:Workbook') > -1 || text.indexOf('<Worksheet') > -1) {
    return parseSpreadsheetXml(text);
  }
  return parseCsv(text);
}

function rowsToObjects(rows) {
  if (!rows.length) return { headers: [], items: [] };
  var headers = rows[0].map(function (h) { return String(h).trim(); });
  var items = [];
  for (var i = 1; i < rows.length; i++) {
    var o = {};
    var empty = true;
    headers.forEach(function (h, j) {
      var v = rows[i][j] === undefined ? '' : String(rows[i][j]).trim();
      o[h] = v;
      if (v !== '') empty = false;
    });
    if (!empty) items.push(o);
  }
  return { headers: headers, items: items };
}

/* ---------------- importers ---------------- */
function buildPartyFromRow(row, type) {
  var name = pick(row, ['Name', 'Customer Name', 'Party Name', 'Supplier Name']);
  if (!name) return { error: 'Name is required' };
  var existing = S.parties.find(function (p) {
    return p.type === type && String(p.name).toLowerCase() === name.toLowerCase();
  });
  var village = pick(row, ['Village']);
  var mandal = pick(row, ['Mandal']);
  var rec = {
    name: name, type: type,
    contact: pick(row, ['Contact']),
    phone: pick(row, ['Phone', 'Mobile']), phone2: pick(row, ['Phone2', 'Phone 2', 'Alternate Phone']),
    email: pick(row, ['Email']), aadhaar: pick(row, ['Aadhaar']), pan: pick(row, ['PAN']).toUpperCase(),
    gstin: pick(row, ['GSTIN']).toUpperCase(), stateCode: pick(row, ['State', 'StateCode']) || org().stateCode,
    address: pick(row, ['Address']), city: pick(row, ['City']), pincode: pick(row, ['Pincode']),
    creditDays: num(pick(row, ['CreditDays']) || 0), openingBal: num(pick(row, ['OpeningBalance']) || 0),
    openingType: 'dr', branchId: (S.branches[0] || {}).id, active: true
  };
  if (village) {
    var v = S.villages.find(function (x) { return String(x.name).toLowerCase() === village.toLowerCase(); });
    if (!v) { v = { id: uid('vil'), name: village, mandalId: '', pincode: rec.pincode }; S.villages.push(v); }
    rec.villageId = v.id;
  }
  if (mandal) {
    var md = S.mandals.find(function (x) { return String(x.name).toLowerCase() === mandal.toLowerCase(); });
    if (!md) { md = { id: uid('man'), name: mandal, stateCode: rec.stateCode }; S.mandals.push(md); }
    rec.mandalId = md.id;
    if (village && !rec.villageId) { /* keep */ }
  }
  return { rec: Object.assign({}, existing || {}, rec), existing: !!existing };
}

function pick(row, keys) {
  for (var i = 0; i < keys.length; i++) {
    var k = keys[i];
    if (row[k] !== undefined && String(row[k]).trim() !== '') return String(row[k]).trim();
  }
  return '';
}
function yesNo(v) { return /^(y|yes|true|1|active)$/i.test(String(v || '').trim()); }

    cols: [['Name', 'Ramannapet'], ['Mandal', 'Chityal'], ['District', 'Nalgonda'], ['State', '36'], ['Pincode', '']],
    run: function (row) {
      var name = pick(row, ['Name', 'Village']);
      if (!name) return { error: 'Name is required' };
      var distName = pick(row, ['District']);
      var stateCode = pick(row, ['State']) || org().stateCode;
      var districtId = '';
      if (distName) {
        var d = S.districts.find(function (x) { return x.name.toLowerCase() === distName.toLowerCase(); });
        if (!d) { d = { id: uid('dis'), name: distName, stateCode: stateCode, active: true }; S.districts.push(d); }
        districtId = d.id;
      }
      var mandalNameRow = pick(row, ['Mandal']);
      var mandalId = '';
      if (mandalNameRow) {
        var m = S.mandals.find(function (x) { return x.name.toLowerCase() === mandalNameRow.toLowerCase(); });
        if (!m) { m = { id: uid('man'), name: mandalNameRow, districtId: districtId, stateCode: stateCode }; S.mandals.push(m); }
        mandalId = m.id;
      }
      var existing = S.villages.find(function (v) { return v.name.toLowerCase() === name.toLowerCase(); });
      var rec = { name: name, mandalId: mandalId, pincode: pick(row, ['Pincode']) };
      return { rec: Object.assign({}, existing || {}, rec), existing: !!existing };
    }
  },

  uom: {
    label: 'Unit Master', group: 'Masters',
    cols: [['Name', 'BAG'], ['Label', 'Bags'], ['Decimals', '0']],
    run: function (row) {
      var name = (pick(row, ['Name', 'Unit']) || '').toUpperCase();
      if (!name) return { error: 'Unit code is required' };
      var existing = uomList().find(function (u) { return u.name === name; });
      var rec = { name: name, label: pick(row, ['Label', 'Description']), decimals: num(pick(row, ['Decimals']) || 0), active: true };
      return { rec: Object.assign({}, existing || {}, rec), existing: !!existing };
    }
  },

  gstslabs: {
    label: 'GST Slabs', group: 'Masters',
    cols: [['Rate', '12'], ['Description', 'Tractors (HSN 8701)']],
    run: function (row) {
      var rate = num(pick(row, ['Rate', 'GSTRate']));
      if (isNaN(rate)) return { error: 'Rate is required' };
      var existing = gstSlabs().find(function (g) { return num(g.rate) === rate; });
      var rec = { rate: rate, label: pick(row, ['Description', 'Label']), active: true };
      return { rec: Object.assign({}, existing || {}, rec), existing: !!existing };
    }
  },

  makes: {
    label: 'Makes & Models', group: 'Masters',
    cols: [['Make', 'Mahindra'], ['Model', '575 DI XP Plus'], ['Category', 'tractor'], ['HP', '47']],
    run: function (row) {
      var mkName = pick(row, ['Make', 'Brand']);
      if (!mkName) return { error: 'Make is required' };
      var cat = (pick(row, ['Category']) || 'tractor').toLowerCase();
      var mk = S.makes.find(function (m) { return m.name.toLowerCase() === mkName.toLowerCase() && (m.category || 'tractor') === cat; });
      if (!mk) { mk = { id: uid('mak'), name: mkName, category: cat, active: true }; S.makes.push(mk); }
      var mdName = pick(row, ['Model']);
      if (!mdName) return { rec: mk, existing: true, skip: true, note: 'make only' };
      var md = S.models.find(function (m) { return m.name.toLowerCase() === mdName.toLowerCase() && m.makeId === mk.id; });
      var rec = { makeId: mk.id, name: mdName, category: cat, hp: num(pick(row, ['HP']) || 0), active: true };
      return { rec: Object.assign({}, md || {}, rec), existing: !!md, coll: 'models' };
    }
  }
};

function partyRow(row, type, extraKey) {
  var name = pick(row, ['Name']);
  if (!name) return { error: 'Name is required' };
  var existing = S.parties.find(function (p) { return p.type === type && p.name.toLowerCase() === name.toLowerCase(); });
  var rec = {
    name: name, type: type, phone: pick(row, ['Phone']), contact: pick(row, ['Contact']),
    area: pick(row, ['Area']), address: pick(row, ['Address']),
    gstin: pick(row, ['GSTIN']).toUpperCase(), pan: pick(row, ['PAN']).toUpperCase(),
    stateCode: pick(row, ['State']) || org().stateCode,
    branchId: (S.branches[0] || {}).id, active: true
  };
  if (extraKey === 'CommissionAmount') rec.commissionAmount = num(pick(row, ['CommissionAmount']) || 0);
  if (extraKey === 'InterestRate') {
    rec.interestRate = num(pick(row, ['InterestRate']) || 0);
    rec.maxMargin = num(pick(row, ['MaxMargin']) || 0);
  }
  return { rec: Object.assign({}, existing || {}, rec), existing: !!existing };
}

/* collection an importer writes to */
function importerColl(key) {
  if (key === 'customers' || key === 'suppliers' || key === 'brokers' || key === 'financers') return 'parties';
  if (key === 'items' || key === 'parts') return 'items';
  if (key === 'employees') return 'employees';
  if (key === 'transporters') return 'transporters';
  if (key === 'banks') return 'bankAccounts';
  if (key === 'villages') return 'villages';
  if (key === 'uom') return 'uoms';
  if (key === 'gstslabs') return 'gstSlabs';
  if (key === 'makes') return 'makes';
  return 'parties';
}

function runImport(key, rows) {
  var imp = IMPORTERS[key];
  var stats = { added: 0, updated: 0, skipped: 0, errors: [] };
  rows.forEach(function (row, i) {
    var res;
    try { res = imp.run(row); } catch (e) { res = { error: e.message }; }
    if (!res || res.error) { stats.errors.push('Row ' + (i + 2) + ': ' + ((res && res.error) || 'could not read')); stats.skipped++; return; }
    if (res.skip) { stats.skipped++; return; }
    var collName = res.coll || importerColl(key);
    var rec = res.rec;
    if (!rec.id) rec.id = uid(collName.slice(0, 3));
    upsert(collName, rec);
    if (res.after) { try { res.after(rec); } catch (e) {} }
    if (res.existing) stats.updated++; else stats.added++;
  });
  save(true);
  return stats;
}

/* ---------------- Tally XML ---------------- */
function tallyDate(iso) { return String(iso || today()).replace(/-/g, ''); }
function txEsc(v) { return xmlEsc(v); }

function tallyEnvelope(reportName, messages, company) {
  return '<ENVELOPE><HEADER><TALLYREQUEST>Import Data</TALLYREQUEST></HEADER><BODY><IMPORTDATA>' +
    '<REQUESTDESC><REPORTNAME>' + reportName + '</REPORTNAME><STATICVARIABLES>' +
    '<SVCURRENTCOMPANY>' + txEsc(company || org().name || 'Tractor ERP') + '</SVCURRENTCOMPANY>' +
    '</STATICVARIABLES></REQUESTDESC><REQUESTDATA>' + messages + '</REQUESTDATA></IMPORTDATA></BODY></ENVELOPE>';
}

function tallyLedger(name, parent, extra) {
  return '<TALLYMESSAGE xmlns:UDF="TallyUDF"><LEDGER NAME="' + txEsc(name) + '" ACTION="Create">' +
    '<PARENT>' + txEsc(parent) + '</PARENT>' + (extra || '') + '</LEDGER></TALLYMESSAGE>';
}

var Tally = {
  ledgersXml: function () {
    var o = org();
    var out = '';
    out += tallyLedger('Sales Accounts', 'Sales Accounts', '');
    out += tallyLedger('Purchase Accounts', 'Purchase Accounts', '');
    out += tallyLedger('Output CGST', 'Duties & Taxes', '<TAXTYPE>GST</TAXTYPE>');
    out += tallyLedger('Output SGST', 'Duties & Taxes', '<TAXTYPE>GST</TAXTYPE>');
    out += tallyLedger('Output IGST', 'Duties & Taxes', '<TAXTYPE>GST</TAXTYPE>');
    out += tallyLedger('Input CGST', 'Duties & Taxes', '<TAXTYPE>GST</TAXTYPE>');
    out += tallyLedger('Input SGST', 'Duties & Taxes', '<TAXTYPE>GST</TAXTYPE>');
    out += tallyLedger('Input IGST', 'Duties & Taxes', '<TAXTYPE>GST</TAXTYPE>');
    out += tallyLedger('Round Off', 'Indirect Expenses', '');
    out += tallyLedger('Cash', 'Cash-in-Hand', '');
    S.bankAccounts.forEach(function (b) {
      out += tallyLedger(b.name, 'Bank Accounts', '<BANKDETAILS.LIST><IFSCODE>' + txEsc(b.ifsc || '') +
        '</IFSCODE><ACCOUNTNUMBER>' + txEsc(b.accountNo || '') + '</ACCOUNTNUMBER><BANKNAME>' + txEsc(b.bankName || '') +
        '</BANKNAME></BANKDETAILS.LIST>');
    });
    S.parties.forEach(function (p) {
      if (p.type === 'customer' || p.type === 'supplier') {
        var parent = p.type === 'customer' ? 'Sundry Debtors' : 'Sundry Creditors';
        var extra = '';
        if (p.gstin) {
          extra += '<PARTYGSTIN>' + txEsc(p.gstin) + '</PARTYGSTIN><GSTREGISTRATIONTYPE>Regular</GSTREGISTRATIONTYPE>' +
            '<LEDGSTREGDETAILS.LIST><APPLICABLEFROM>' + tallyDate(o.fyStart || today()) + '</APPLICABLEFROM>' +
            '<GSTREGISTRATIONTYPE>Regular</GSTREGISTRATIONTYPE><GSTIN>' + txEsc(p.gstin) + '</GSTIN></LEDGSTREGDETAILS.LIST>';
        }
        if (p.address) extra += '<ADDRESS.LIST><ADDRESS>' + txEsc(p.address) + '</ADDRESS></ADDRESS.LIST>';
        if (num(p.openingBal)) {
          extra += '<OPENINGBALANCE>' + (p.type === 'customer' ? -num(p.openingBal) : num(p.openingBal)) + '</OPENINGBALANCE>';
        }
        out += tallyLedger(p.name, parent, extra);
      }
      if (p.type === 'broker') out += tallyLedger('Commission — ' + p.name, 'Indirect Expenses', '');
    });
    var heads = {};
    S.expenses.forEach(function (e) { heads[e.head] = (heads[e.head] || 0) + num(e.amount); });
    Object.keys(heads).forEach(function (h) {
      var nm = (EXPENSE_HEADS.find(function (x) { return x[0] === h; }) || [h, h])[1];
      out += tallyLedger(nm, 'Indirect Expenses', '');
    });
    return tallyEnvelope('Masters', out, o.name);
  },

  stockItemsXml: function () {
    var out = '';
    uomList().forEach(function (u) {
      out += '<TALLYMESSAGE><UNIT NAME="' + txEsc(u.name) + '" ACTION="Create"><ISSIMPLEUNIT>Yes</ISSIMPLEUNIT>' +
        '<DECIMALPLACES>' + num(u.decimals) + '</DECIMALPLACES></UNIT></TALLYMESSAGE>';
    });
    S.items.forEach(function (i) {
      out += '<TALLYMESSAGE><STOCKITEM NAME="' + txEsc(i.name) + '" ACTION="Create">' +
        '<PARENT>' + (i.category === 'service' ? 'Services' : 'Primary') + '</PARENT>' +
        '<BASEUNITS>' + txEsc(i.uom || 'NOS') + '</BASEUNITS>' +
        '<GSTAPPLICABLE>Applicable</GSTAPPLICABLE>' +
        '<GSTTYPEOFSUPPLY>' + (i.category === 'service' ? 'Services' : 'Goods') + '</GSTTYPEOFSUPPLY>' +
        (i.hsn ? '<HSNCODE>' + txEsc(i.hsn) + '</HSNCODE>' : '') +
        '<GSTRATE>' + num(i.gstRate) + '</GSTRATE>' +
        (i.partNo ? '<ALTERNATEUNITS></ALTERNATEUNITS><DESCRIPTION>' + txEsc('Part No: ' + i.partNo) + '</DESCRIPTION>' : '') +
        '</STOCKITEM></TALLYMESSAGE>';
    });
    return tallyEnvelope('Masters', out, org().name);
  },

  voucher: function (vchType, v) {
    var entries = '';
    (v.entries || []).forEach(function (e) {
      entries += '<ALLLEDGERENTRIES.LIST><LEDGERNAME>' + txEsc(e.ledger) + '</LEDGERNAME>' +
        '<ISDEEMEDPOSITIVE>' + (e.debit ? 'Yes' : 'No') + '</ISDEEMEDPOSITIVE>' +
        '<AMOUNT>' + (e.debit ? -Math.abs(num(e.amount)) : Math.abs(num(e.amount))) + '</AMOUNT>' +
        (e.gst && e.gst.rate ? '<RATEDETAILS.LIST><GSTRATEDUTYHEAD>' + e.gst.head + '</GSTRATEDUTYHEAD>' +
          '<GSTRATE>' + e.gst.rate + '</GSTRATE></RATEDETAILS.LIST>' : '') +
        '</ALLLEDGERENTRIES.LIST>';
    });
    var inv = '';
    (v.items || []).forEach(function (it) {
      inv += '<INVENTORYENTRIES.LIST><STOCKITEMNAME>' + txEsc(it.name) + '</STOCKITEMNAME>' +
        '<ISDEEMEDPOSITIVE>' + (v.stockOut ? 'No' : 'Yes') + '</ISDEEMEDPOSITIVE>' +
        '<RATE>' + num(it.rate) + '/' + txEsc(it.uom || 'NOS') + '</RATE>' +
        '<AMOUNT>' + (v.stockOut ? Math.abs(num(it.amount)) : -Math.abs(num(it.amount))) + '</AMOUNT>' +
        '<ACTUALQTY>' + Math.abs(num(it.qty)) + ' ' + txEsc(it.uom || 'NOS') + '</ACTUALQTY>' +
        '<BILLEDQTY>' + Math.abs(num(it.qty)) + ' ' + txEsc(it.uom || 'NOS') + '</BILLEDQTY>' +
        '</INVENTORYENTRIES.LIST>';
    });
    return '<TALLYMESSAGE xmlns:UDF="TallyUDF"><VOUCHER VCHTYPE="' + vchType + '" ACTION="Create" OBJVIEW="Invoice Voucher View">' +
      '<DATE>' + tallyDate(v.date) + '</DATE>' +
      '<EFFECTIVEDATE>' + tallyDate(v.date) + '</EFFECTIVEDATE>' +
      '<VOUCHERTYPENAME>' + vchType + '</VOUCHERTYPENAME>' +
      '<VOUCHERNUMBER>' + txEsc(v.no || '') + '</VOUCHERNUMBER>' +
      (v.party ? '<PARTYLEDGERNAME>' + txEsc(v.party) + '</PARTYLEDGERNAME><BASICBUYERNAME>' + txEsc(v.party) + '</BASICBUYERNAME>' : '') +
      (v.ref ? '<REFERENCE>' + txEsc(v.ref) + '</REFERENCE>' : '') +
      (v.narration ? '<NARRATION>' + txEsc(v.narration) + '</NARRATION>' : '') +
      entries + inv + '</VOUCHER></TALLYMESSAGE>';
  },

  salesVouchers: function () {
    var out = '';
    S.invoices.forEach(function (i) {
      if (i.docType === 'financer' || i.docType === 'margin') return;
      var pt = party(i.partyId);
      var entries = [{ ledger: pt.name || 'Cash', debit: true, amount: num(i.total) }];
      entries.push({ ledger: 'Sales Accounts', debit: false, amount: num(i.taxable) });
      if (num(i.cgst)) entries.push({ ledger: 'Output CGST', debit: false, amount: num(i.cgst), gst: { head: 'CGST', rate: 0 } });
      if (num(i.sgst)) entries.push({ ledger: 'Output SGST', debit: false, amount: num(i.sgst), gst: { head: 'SGST', rate: 0 } });
      if (num(i.igst)) entries.push({ ledger: 'Output IGST', debit: false, amount: num(i.igst), gst: { head: 'IGST', rate: 0 } });
      if (num(i.roundOff)) entries.push({ ledger: 'Round Off', debit: num(i.roundOff) < 0, amount: Math.abs(num(i.roundOff)) });
      var items = (i.lines || []).map(function (l) {
        return { name: l.desc || itemName(l.itemId), qty: num(l.qty), rate: num(l.rate), uom: item(l.itemId).uom || 'NOS', amount: lineAmount(l) };
      });
      out += Tally.voucher('Sales', {
        date: i.date, no: i.no, party: pt.name, narration: i.notes || ('Invoice ' + i.no),
        entries: entries, items: items, stockOut: true
      });
    });
    return out;
  },

  purchaseVouchers: function () {
    var out = '';
    S.purchases.forEach(function (p) {
      var pt = party(p.partyId);
      var entries = [{ ledger: pt.name || 'Sundry Creditors', debit: false, amount: num(p.total) }];
      entries.push({ ledger: 'Purchase Accounts', debit: true, amount: num(p.taxable) });
      if (num(p.cgst)) entries.push({ ledger: 'Input CGST', debit: true, amount: num(p.cgst) });
      if (num(p.sgst)) entries.push({ ledger: 'Input SGST', debit: true, amount: num(p.sgst) });
      if (num(p.igst)) entries.push({ ledger: 'Input IGST', debit: true, amount: num(p.igst) });
      var items = (p.lines || []).map(function (l) {
        return { name: l.desc || itemName(l.itemId), qty: num(l.qty), rate: num(l.rate), uom: item(l.itemId).uom || 'NOS', amount: lineAmount(l) };
      });
      out += Tally.voucher('Purchase', {
        date: p.date, no: p.no, party: pt.name, narration: 'Purchase ' + p.no,
        entries: entries, items: items, stockOut: false
      });
    });
    return out;
  },

  paymentVouchers: function () {
    var out = '';
    S.payments.forEach(function (p) {
      var pt = party(p.partyId);
      var bank = p.bankAccountId ? bankAccount(p.bankAccountId).name : (p.mode === 'cash' ? 'Cash' : 'Bank Accounts');
      var entries;
      if (p.type === 'in') {
        entries = [
          { ledger: bank || 'Cash', debit: true, amount: num(p.amount) },
          { ledger: pt.name, debit: false, amount: num(p.amount) }
        ];
        out += Tally.voucher('Receipt', { date: p.date, no: p.no, party: pt.name, narration: p.note || '', entries: entries });
      } else {
        entries = [
          { ledger: pt.name, debit: true, amount: num(p.amount) },
          { ledger: bank || 'Cash', debit: false, amount: num(p.amount) }
        ];
        out += Tally.voucher('Payment', { date: p.date, no: p.no, party: pt.name, narration: p.note || '', entries: entries });
      }
    });
    S.notes.forEach(function (n) {
      var pt = party(n.partyId);
      var entries = n.type === 'credit'
        ? [{ ledger: pt.name, debit: true, amount: num(n.total) }, { ledger: 'Sales Accounts', debit: false, amount: num(n.taxable) }]
        : [{ ledger: pt.name, debit: false, amount: num(n.total) }, { ledger: 'Purchase Accounts', debit: true, amount: num(n.taxable) }];
      if (num(n.tax)) {
        entries.push({ ledger: (n.type === 'credit' ? 'Output CGST' : 'Input CGST'), debit: n.type !== 'credit', amount: num(n.tax) });
      }
      out += Tally.voucher(n.type === 'credit' ? 'Credit Note' : 'Debit Note', {
        date: n.date, no: n.no, party: pt.name, narration: n.reason || '', entries: entries
      });
    });
    return out;
  },

  fullXml: function () {
    var o = org();
    var body = this.ledgersXml().split('<REQUESTDATA>')[1].split('</REQUESTDATA>')[0] +
      this.stockItemsXml().split('<REQUESTDATA>')[1].split('</REQUESTDATA>')[0] +
      this.salesVouchers() + this.purchaseVouchers() + this.paymentVouchers();
    return tallyEnvelope('Vouchers', body, o.name);
  }
};

      });

      });

      out.push({ Name: t.name, Phone: t.phone || '', VehicleNo: t.vehicleNo || '', GSTIN: t.gstin || '', RatePerTrip: num(t.ratePerTrip), Address: t.address || '' });
    });
  } else if (key === 'banks') {
    S.bankAccounts.forEach(function (b) {
      out.push({ Name: b.name, BankName: b.bankName || '', AccountNo: b.accountNo || '', IFSC: b.ifsc || '', Branch: b.branch || '', Type: b.type || '', OpeningBalance: num(b.openingBal) });
    });
  } else if (key === 'villages') {
    S.villages.forEach(function (v) {
      var m = S.mandals.find(function (x) { return x.id === v.mandalId; }) || {};
      out.push({ Name: v.name, Mandal: m.name || '', District: districtName(m.districtId) || m.district || '', State: m.stateCode || '', Pincode: v.pincode || '' });
    });
  } else if (key === 'uom') {
    uomList().forEach(function (u) { out.push({ Name: u.name, Label: u.label || '', Decimals: num(u.decimals) }); });
  } else if (key === 'gstslabs') {
    gstSlabs().forEach(function (g) { out.push({ Rate: num(g.rate), Description: g.label || '' }); });
  } else if (key === 'makes') {
    S.models.forEach(function (md) {
      var mk = S.makes.find(function (m) { return m.id === md.makeId; }) || {};
      out.push({ Make: mk.name || '', Model: md.name, Category: mk.category || 'tractor', HP: num(md.hp) });
    });
  }
  return out;
}

        '<button class="btn block" id="btnTpl" style="margin-top:10px">Download template</button>' +

    view.innerHTML = h;
    qsa('[data-tab]', view).forEach(function (b) { b.onclick = function () { Router.go('dataio', { tab: b.getAttribute('data-tab'), key: key }); }; });

    var impKey = document.getElementById('impKey');
    if (impKey) impKey.onchange = function () { Router.go('dataio', { tab: 'import', key: impKey.value }); };

    var btnTpl = document.getElementById('btnTpl');
    if (btnTpl) btnTpl.onclick = function () {
      Export.xls(IMPORTERS[key].label + ' Template', importerCols(key), importerTemplateRows(key), IMPORTERS[key].label + ' — template');
    };

    var btnPick = document.getElementById('btnPick');
    if (btnPick) btnPick.onclick = function () {

      inp.type = 'file';
      inp.accept = '.xlsx,.csv,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv';
      inp.onchange = async function () {
        var f = inp.files[0];
        if (!f) return;
        var box = document.getElementById('impResult');
        box.innerHTML = '<div class="card"><div class="tiny muted">Reading ' + esc(f.name) + '…</div></div>';
        try {
          var rows = await readTable(f);
          var parsed = rowsToObjects(rows);
          if (!parsed.items.length) { box.innerHTML = '<div class="card"><div class="note">No data rows found in that file.</div></div>'; return; }
          var preview = parsed.items.slice(0, 5).map(function (r) {
            return '<div class="rc-sub">' + esc(Object.keys(r).slice(0, 4).map(function (k) { return r[k]; }).join(' · ')) + '</div>';
          }).join('');
          box.innerHTML = '<div class="card"><h3>' + parsed.items.length + ' row(s) ready</h3>' +
            '<div class="tiny muted">Columns found: ' + esc(parsed.headers.join(', ')) + '</div>' +
            preview + '<button class="btn primary block" id="btnRun" style="margin-top:10px">Import ' + parsed.items.length + ' row(s)</button></div>';
          document.getElementById('btnRun').onclick = function () {
            var stats = runImport(key, parsed.items);
            var errs = stats.errors.slice(0, 8).map(function (e) { return '<div class="tiny red">' + esc(e) + '</div>'; }).join('');
            box.innerHTML = '<div class="card"><h3>Import finished</h3>' +
              '<div class="kv"><span>Added</span><span class="green">' + stats.added + '</span></div>' +
              '<div class="kv"><span>Updated</span><span class="blue">' + stats.updated + '</span></div>' +
              '<div class="kv"><span>Skipped</span><span>' + stats.skipped + '</span></div>' +
              (errs ? '<div class="section-label">Problems</div>' + errs : '') +
              '<button class="btn block" id="btnAgain" style="margin-top:10px">Import another file</button></div>';
            document.getElementById('btnAgain').onclick = function () { Router.go('dataio', { tab: 'import', key: key }); };
            toast('Imported ' + stats.added + ' added, ' + stats.updated + ' updated');
          };
        } catch (e) {
          box.innerHTML = '<div class="card"><div class="note">Could not read that file — ' + esc(e.message) +
            '. Save it as .xlsx or CSV from Excel and try again.</div></div>';
        }
      };
      inp.click();
    };

    var send = function (name, xml) {
      if (!xml) { toast('Nothing to export yet', 'err'); return; }
      var fname = 'tally-' + name + '-' + today() + '.xml';
      if (window.AppBridge && window.AppBridge.saveFile) window.AppBridge.saveFile(fname, xml);
      else Export.deliver(fname, xml, 'application/xml');
      toast('Tally file ready');
    };
    var tf = document.getElementById('tlyFull');
    if (tf) tf.onclick = function () { send('all', Tally.fullXml()); };
    var tm = document.getElementById('tlyMasters');
    if (tm) tm.onclick = function () { send('ledgers', Tally.ledgersXml()); };
    var ti = document.getElementById('tlyItems');
    if (ti) ti.onclick = function () { send('stock-items', Tally.stockItemsXml()); };
    var tv = document.getElementById('tlyVouchers');
    if (tv) tv.onclick = function () {
      var body = Tally.salesVouchers() + Tally.purchaseVouchers() + Tally.paymentVouchers();
      send('vouchers', tallyEnvelope('Vouchers', body, org().name));
    };
  }
});
