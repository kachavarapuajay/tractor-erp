]);

function newDoc(kind) {
  var cfg = DOCS[kind];
  var st = settings();
  var d = {
    id: uid(cfg.coll.slice(0, 3)), kind: kind, no: '', date: today(),
    branchId: (S.branches[0] || {}).id, lines: [], status: kind === 'quotation' ? 'draft' : (cfg.isJob ? 'open' : 'unpaid'),
    createdAt: today(), createdBy: S.session.userId
  };
  (cfg.header || []).forEach(function (f) { if (f.def !== undefined) d[f.k] = typeof f.def === 'function' ? f.def() : f.def; });
  if (cfg.docTypes && cfg.docTypes.length && !d.saleType) d.saleType = cfg.docTypes[0][0];
  if (kind === 'invoice' || kind === 'financer') { d.saleType = 'sales'; d.dueDate = addDays(today(), 15); }
  if (kind === 'purchase') { d.dueDate = addDays(today(), 15); }
  return d;
}

/* ---------------- line editor ---------------- */
function needsSerial(it) {
  return !!it && (it.category === 'tractor' || it.serialTracked === true);
}
function serialUnitsFor(itemId, branchId, keepId) {
  var list = S.units.filter(function (u) {
    return u.status === 'in_stock' && u.itemId === itemId && (!branchId || u.branchId === branchId);
  }).map(function (u) { return { v: u.id, l: unitLabel(u) }; });
  if (keepId && !list.some(function (x) { return x.v === keepId; })) {
    var cu = unitOf(keepId);
    if (cu.id) list.unshift({ v: cu.id, l: unitLabel(cu) + '  (already on this document)' });
  }
  return list;
}

function lineModal(cfg, line, onSave, doc) {
  var isNew = !line;
  var l = line || {
    itemId: '', desc: '', hsn: '', qty: 1, rate: 0, discPct: 0,
    gstRate: settings().defaultGst || 12, unitId: ''
  };
  var fCat = '', fMake = '', fModel = '';
  if (line && line.itemId) {
    var li = item(line.itemId);
    fCat = li.category || '';
    fMake = li.makeId || '';
    fModel = li.modelId || '';
  } else {
    var dmk = defaultMakeId();
    if (dmk && S.items.some(function (i) { return i.makeId === dmk; })) fMake = dmk;
  }
  var body = formHtml([
    { k: 'catFilter', label: 'Category', type: 'select', placeholder: 'All categories', options: function () {
        return ITEM_CATS.map(function (c) { return [c[0], c[1]]; });
      } },
    { k: 'makeFilter', label: 'Make', type: 'select', placeholder: 'All makes', options: function () {
        return makeOptions(fCat).map(function (o) { return [o.v, o.l]; });
      } },
    { k: 'modelFilter', label: 'Model', type: 'select', placeholder: 'All models', options: function () {
        return modelOptions(fMake, fCat).map(function (o) { return [o.v, o.l]; });
      } },
    { k: 'itemId', label: 'Item', type: 'select', options: function () { return itemOptionsFor(fCat, fMake, fModel); }, required: true, span: 2 },
    { k: 'desc', label: 'Description on document', span: 2 },
    { k: 'chassisNo', label: 'Chassis / serial no.' },
    { k: 'engineNo', label: 'Engine no.' },
    { k: 'hsn', label: 'HSN / SAC' },
    { k: 'gstRate', label: 'GST %', type: 'select', options: function () { return gstOptions(); } },
    { k: 'qty', label: 'Quantity', type: 'number', step: '0.01', required: true },
    { k: 'rate', label: 'Rate', type: 'number', step: '0.01', required: true },
    { k: 'discPct', label: 'Discount %', type: 'number', step: '0.01' },
    { k: 'unitId', label: 'Unit / serial no.', type: 'select', span: 2, options: function () {
        return serialUnitsFor(l.itemId, doc.branchId, l.unitId);
      } }
  ], Object.assign({}, l, { catFilter: fCat, makeFilter: fMake, modelFilter: fModel }));
  var m = modal({
    title: isNew ? 'Add line item' : 'Edit line item',
    wide: true, body: body,
    footer: '<button class="btn ghost" data-cancel>Cancel</button><button class="btn primary" data-save>Save line</button>'
  });

  var itemSel = qs('[name="itemId"]', m.el);
  var catSel = qs('[name="catFilter"]', m.el);
  var makeSel = qs('[name="makeFilter"]', m.el);
  var modelSel = qs('[name="modelFilter"]', m.el);

  function fillSelect(el, opts, placeholder) {
    el.innerHTML = '<option value="">' + esc(placeholder) + '</option>' + opts.map(function (o) {
      return '<option value="' + o.v + '">' + esc(o.l) + '</option>';
    }).join('');
  }
  function refreshCascade(keepItem) {
    fillSelect(makeSel, makeOptions(fCat).map(function (o) { return { v: o.v, l: o.l }; }), 'All makes');
    makeSel.value = fMake;
    if (makeSel.value !== fMake) { fMake = ''; makeSel.value = ''; }
    fillSelect(modelSel, modelOptions(fMake, fCat), 'All models');
    modelSel.value = fModel;
    if (modelSel.value !== fModel) { fModel = ''; modelSel.value = ''; }
    var opts = itemOptionsFor(fCat, fMake, fModel);
    if (!opts.length) {
      itemSel.innerHTML = '<option value="">No items — widen the filters</option>';
    } else {
      fillSelect(itemSel, opts, '— select item —');
      if (keepItem) itemSel.value = keepItem;
    }
    refreshUnitField('');
  }
  catSel.onchange = function () { fCat = catSel.value; fMake = ''; fModel = ''; refreshCascade(''); };
  makeSel.onchange = function () { fMake = makeSel.value; fModel = ''; refreshCascade(''); };
  modelSel.onchange = function () { fModel = modelSel.value; refreshCascade(''); };
  var unitFld = qs('[name="unitId"]', m.el).parentElement;
  var unitSel = qs('[name="unitId"]', m.el);
  var qtyEl = qs('[name="qty"]', m.el);

  function refreshUnitField(keep) {
    var it = item(itemSel.value);
    var show = needsSerial(it) && cfg.kind !== 'purchase';
    unitFld.style.display = show ? '' : 'none';
    unitFld.querySelector('span').textContent = (it.category === 'tractor' ? 'Chassis / unit' : 'Serial number') + (show ? ' *' : '');
    if (!show) { unitSel.innerHTML = ''; return; }
    var opts = serialUnitsFor(itemSel.value, doc.branchId, keep);
    unitSel.innerHTML = '<option value="">— select —</option>' + opts.map(function (o) {
      return '<option value="' + o.v + '">' + esc(o.l) + '</option>';
    }).join('');
    if (keep) unitSel.value = keep;
  }

  function fillFromUnit() {
    var u = unitOf(unitSel.value);
    if (!u.id) return;
    var ch = m.el.querySelector('[name="chassisNo"]');
    var en = m.el.querySelector('[name="engineNo"]');
    if (ch && !ch.value) ch.value = u.chassisNo || u.serialNo || '';
    if (en && !en.value) en.value = u.engineNo || '';
  }
  unitSel.onchange = fillFromUnit;

  itemSel.onchange = function () {
    var it = item(itemSel.value);
    var set = function (k, v) {
      var e = qs('[name="' + k + '"]', m.el);
      if (e) e.value = v;
    };
    set('desc', it.name || '');
    set('hsn', it.hsn || '');
    set('gstRate', String(it.gstRate || 0));
    set('rate', cfg.kind === 'purchase' ? (it.purchaseRate || 0) : (it.saleRate || 0));
    var single = needsSerial(it) && cfg.kind !== 'purchase';
    if (single) qtyEl.value = '1';
    qtyEl.readOnly = single;
    refreshUnitField('');
  };
  refreshCascade(l.itemId || '');
  if (l.itemId) itemSel.value = l.itemId;
  refreshUnitField(l.unitId);
  if (l.unitId) fillFromUnit();

  qs('[data-cancel]', m.el).onclick = m.close;
  qs('[data-save]', m.el).onclick = function () {
    var v = readForm(m.el, [
      { k: 'itemId' }, { k: 'desc' }, { k: 'chassisNo' }, { k: 'engineNo' },
      { k: 'hsn' }, { k: 'gstRate', type: 'number' }, { k: 'qty', type: 'number' },
      { k: 'rate', type: 'number' }, { k: 'discPct', type: 'number' }, { k: 'unitId' }
    ]);
    if (!v.itemId) { toast('Choose an item', 'err'); return; }
    var it = item(v.itemId);
    if (needsSerial(it) && cfg.kind !== 'purchase' && cfg.kind !== 'quotation' && cfg.kind !== 'financer' && !v.unitId) {
      toast(it.category === 'tractor' ? 'Select the chassis being sold' : 'Select the serial number being sold', 'err');
      return;
    }
    if (needsSerial(it) && cfg.kind === 'purchase' && num(v.qty) !== Math.round(num(v.qty))) {
      toast('Serial tracked items must be purchased in whole units', 'err');
      return;
    }
    delete v.makeFilter; delete v.catFilter; delete v.modelFilter;
    v.desc = v.desc || it.name;
    v.qty = (needsSerial(it) && cfg.kind !== 'purchase') ? 1 : (num(v.qty) || 1);
    v.rate = num(v.rate);
    v.gstRate = num(v.gstRate);
    v.discPct = num(v.discPct);
    if (!v.unitId) delete v.unitId;
    m.close();
    onSave(v, isNew);
  };
}

/* ---------------- document editor ---------------- */
function openDocEditor(kind, docId, preset) {
  var cfg = DOCS[kind];
  var doc = docId ? JSON.parse(JSON.stringify(findOne(cfg.coll, docId))) : newDoc(kind);
  if (preset) Object.assign(doc, preset);
  if (!doc.lines) doc.lines = [];
  var isNew = !docId;
  var interState = false;

  var m = modal({ title: (isNew ? 'New ' : 'Edit ') + (cfg.printTitle || cfg.title), wide: true, body: '<div class="docbody"></div>', footer: '<div class="docfoot flex" style="width:100%"></div>' });
  var bodyEl = qs('.docbody', m.el);
  var footEl = qs('.docfoot', m.el);

  function p() { return party(doc.partyId); }
  function totals() {
    interState = isInterState(p());
    if (cfg.noLines) {
      var amt = r2(num(doc.amount));
      return { taxable: amt, cgst: 0, sgst: 0, igst: 0, roundOff: 0, total: amt, tax: 0 };
    }
    if (cfg.kind === 'financer' && (!doc.lines || !doc.lines.length)) {
      var t = r2(num(doc.loanAmount) + num(doc.marginMoney));
      return { taxable: r2(num(doc.loanAmount)), cgst: 0, sgst: 0, igst: 0, roundOff: 0, total: t, tax: 0, margin: num(doc.marginMoney) };
    }
    return computeTotals(doc.lines, interState);
  }

  function headerFields() {
    var f = [{ k: 'partyId', label: cfg.partyLabel, type: 'select', options: function () { return partyOptions(cfg.partyTypes); }, required: true, span: 2 },
      { k: 'date', label: 'Date', type: 'date', required: true },
      { k: 'branchId', label: 'Branch', type: 'select', options: branchOptions, required: true }];
    return f.concat(cfg.header || []);
  }

  function syncHeader() {
    qsa('[name]', bodyEl).forEach(function (e) {
      var k = e.getAttribute('name');
      doc[k] = e.type === 'checkbox' ? e.checked : (e.type === 'number' ? num(e.value) : e.value);
    });
  }

  function render() {
    var t = totals();
    var h = formHtml(headerFields(), doc);
    if (cfg.hypothecation) {
      h += '<div class="section-label">Hypothecation / finance details</div><div class="tiny muted">Shown on the quotation so the customer sees the full funding picture.</div>';
    }
    if (cfg.noLines) {
      h += '<div class="note">This document is not a tax invoice — no GST is charged on it and it does not appear in GSTR-1 or the P&L. It is recorded as money received against the sale.</div>';
    }
    if (cfg.excluded) {
      h += '<div class="note">Financer invoice — GST is calculated and printed exactly like a tax invoice, but the document is <b>excluded from GSTR-1, GSTR-3B and the P&amp;L</b>. The sale itself is already reported through the customer invoice.</div>';
    }
    if (!cfg.noLines) {
    h += '<div class="section-label">' + (cfg.isJob ? 'Labour & parts' : 'Line items') + '</div>';
    h += '<div class="card tight" style="margin:0">';
    if (!doc.lines.length) h += '<div class="empty small">No items yet</div>';
    else h += doc.lines.map(function (l, i) {
      var u = l.unitId ? unitOf(l.unitId) : null;
      return '<div class="lineitem"><div><div class="li-title">' + esc(l.desc || itemName(l.itemId)) + '</div>' +
        '<div class="li-sub">' + fmtQty(l.qty) + ' × ' + inr(l.rate) + (l.discPct ? ' − ' + l.discPct + '%' : '') +
        ' · GST ' + l.gstRate + '%' + (u && u.chassisNo ? ' · <span class="mono">' + esc(u.chassisNo) + '</span>' : '') + '</div></div>' +
        '<div class="li-amt">' + inr(lineAmount(l)) +
        '<div style="margin-top:4px"><button class="btn sm" data-ed="' + i + '">' + icon('edit') + '</button> ' +
        '<button class="btn sm danger" data-rm="' + i + '">' + icon('trash') + '</button></div></div></div>';
    }).join('');
    h += '</div><button class="addline js-addline">+ Add ' + (cfg.isJob ? 'labour / part' : 'item') + '</button>';
    }

    h += '<div class="card" style="margin:14px 0 0;box-shadow:none;border:1px solid var(--line)">';
    if (cfg.noLines) {
      h += '<div class="kv"><span>Amount received</span><span>' + inr(doc.amount) + '</span></div>' +
        '<div class="kv"><span>GST</span><span class="green">Not applicable</span></div>' +
        '<div class="kv"><span>Against invoice</span><span>' + (doc.invoiceId ? esc((findOne('invoices', doc.invoiceId) || {}).no || '') : '—') + '</span></div>' +
        '<div class="grand"><span>Total</span><span>' + inr(t.total) + '</span></div>';
    } else if (cfg.kind === 'financer' && !doc.lines.length) {
      h += '<div class="kv"><span>Loan / finance amount</span><span>' + inr(doc.loanAmount) + '</span></div>' +
        '<div class="kv"><span>Margin money (customer)</span><span>' + inr(doc.marginMoney) + '</span></div>' +
        '<div class="grand"><span>Total</span><span>' + inr(t.total) + '</span></div>' +
        '<div class="note">Add line items to print this as a full tax invoice with GST.</div>';
    } else {
      h += '<div class="kv"><span>Taxable value</span><span>' + inr(t.taxable) + '</span></div>';
      if (interState) h += '<div class="kv"><span>IGST</span><span>' + inr(t.igst) + '</span></div>';
      else h += '<div class="kv"><span>CGST</span><span>' + inr(t.cgst) + '</span></div><div class="kv"><span>SGST</span><span>' + inr(t.sgst) + '</span></div>';
      h += '<div class="kv"><span>Round off</span><span>' + inr(t.roundOff) + '</span></div>' +
        '<div class="grand"><span>Invoice value</span><span>' + inr(t.total) + '</span></div>' +
        '<div class="tiny muted" style="margin-top:6px">' + (interState ? 'Inter-state supply (IGST)' : 'Intra-state supply (CGST + SGST)') + '</div>';
    }
    h += '</div>';
    bodyEl.innerHTML = h;

    qsa('[data-rm]', bodyEl).forEach(function (b) {
      b.onclick = function () { doc.lines.splice(Number(b.getAttribute('data-rm')), 1); render(); };
    });
    qsa('[data-ed]', bodyEl).forEach(function (b) {
      b.onclick = function () {
        var i = Number(b.getAttribute('data-ed'));
        lineModal(cfg, doc.lines[i], function (v) { doc.lines[i] = v; render(); }, doc);
      };
    });
    var al = qs('.js-addline', bodyEl);
    if (al) al.onclick = function () { lineModal(cfg, null, function (v) { doc.lines.push(v); render(); }, doc); };

    // capture header edits live
    qsa('[name]', bodyEl).forEach(function (e) {
      var k = e.getAttribute('name');
      var sync = function () {
        doc[k] = e.type === 'checkbox' ? e.checked : (e.type === 'number' ? num(e.value) : e.value);
      };
      e.oninput = sync;
      e.onchange = function () { sync(); if (k === 'partyId' || k === 'branchId') render(); };
    });

    footEl.innerHTML = '<button class="btn ghost js-dcancel">Cancel</button>' +
      '<button class="btn primary js-dsave" style="flex:1;justify-content:center">Save ' + cfg.title + '</button>';
    qs('.js-dcancel', footEl).onclick = m.close;
    qs('.js-dsave', footEl).onclick = function () { saveDoc(); };
  }

  function saveDoc() {
    syncHeader();
    if (!doc.partyId) { toast('Select the ' + cfg.partyLabel.toLowerCase(), 'err'); return; }
    if (!doc.lines.length && cfg.kind !== 'financer' && !cfg.isJob && !cfg.noLines) { toast('Add at least one line item', 'err'); return; }
    if (cfg.noLines && !num(doc.amount)) { toast('Enter the amount', 'err'); return; }
    var st = settings();
    if (!doc.no) doc.no = nextNo(cfg.kind, st[cfg.prefixKey] || cfg.defPrefix);
    if (cfg.kind === 'invoice') doc.docType = 'sales';
    if (cfg.kind === 'financer') doc.docType = 'financer';
    if (cfg.kind === 'margin') doc.docType = 'margin';
    var t = totals();
    if (cfg.kind === 'invoice' && doc.brokerId && !num(doc.brokerCommission)) {
      var br = S.parties.find(function (x) { return x.id === doc.brokerId; });
      if (br && num(br.commissionAmount)) doc.brokerCommission = num(br.commissionAmount);
    }
    Object.assign(doc, { taxable: t.taxable, cgst: t.cgst, sgst: t.sgst, igst: t.igst, roundOff: t.roundOff, total: t.total });
    if (cfg.isJob) doc.total = t.total;
    upsert(cfg.coll, doc);
    if (cfg.stock === 'out' && cfg.kind === 'invoice') syncInvoiceStock(doc);
    if (cfg.stock === 'in') syncPurchaseStock(doc);
    if (cfg.kind === 'jobcard') syncJobStock(doc);
    m.close();
    toast(cfg.title + ' saved');
    Router.go(cfg.listScreen || cfg.coll);
    if (cfg.kind === 'purchase') askUnits(doc);
  }

  render();
  return m;
}

/* ---------------- stock posting ---------------- */
function syncInvoiceStock(doc) {
  S.units.forEach(function (u) {
    if (u.saleInvoiceId === doc.id) {
      u.status = 'in_stock'; u.saleInvoiceId = null; u.saleDate = null; u.customerId = null;
    }
  });
  S.moves = S.moves.filter(function (mv) { return mv.refId !== doc.id; });
  doc.lines.forEach(function (l) {
    var it = item(l.itemId);
    if (l.unitId) {
      var u = S.units.find(function (x) { return x.id === l.unitId; });
      if (u) {
        u.status = 'sold'; u.saleInvoiceId = doc.id; u.saleDate = doc.date;
        u.customerId = doc.partyId; u.salePrice = num(l.rate);
      }
    } else if (it.category !== 'service') {
      S.moves.push({
        id: uid('mv'), date: doc.date, itemId: l.itemId, branchId: doc.branchId,
        qty: -num(l.qty), rate: num(l.rate), type: 'sale', refId: doc.id, refNo: doc.no, note: partyName(doc.partyId)
      });
    }
  });
  save();
}

function syncPurchaseStock(doc) {
  S.moves = S.moves.filter(function (mv) { return mv.refId !== doc.id; });
  doc.lines.forEach(function (l) {
    var it = item(l.itemId);
    if (it.category === 'tractor' || it.serialTracked) return; // units handled separately
    if (it.category === 'service') return;
    S.moves.push({
      id: uid('mv'), date: doc.date, itemId: l.itemId, branchId: doc.branchId,
      qty: num(l.qty), rate: num(l.rate), type: 'purchase', refId: doc.id, refNo: doc.no, note: partyName(doc.partyId)
    });
  });
  save();
}

function syncJobStock(job) {
  S.moves = S.moves.filter(function (mv) { return mv.refId !== job.id; });
  (job.lines || []).forEach(function (l) {
    var it = item(l.itemId);
    if (it.category === 'service' || !l.itemId) return;
    if (it.category === 'tractor') return;
    S.moves.push({
      id: uid('mv'), date: job.date, itemId: l.itemId, branchId: job.branchId,
      qty: -num(l.qty), rate: num(l.rate), type: 'jobcard', refId: job.id, refNo: job.no, note: 'Job card ' + job.no
    });
  });
  save();
}

/* capture chassis/engine (tractors) or serial numbers (implements) purchased */
function askUnits(pb) {
  var need = [];
  (pb.lines || []).forEach(function (l) {
    var it = item(l.itemId);
    if (!(it.category === 'tractor' || it.serialTracked)) return;
    var n = Math.max(1, Math.round(num(l.qty)));
    for (var i = 0; i < n; i++) need.push({ itemId: l.itemId, rate: num(l.rate), kind: it.category === 'tractor' ? 'tractor' : 'serial' });
  });
  if (!need.length) return;
  var existing = S.units.filter(function (u) { return u.purchaseId === pb.id; }).length;
  if (existing >= need.length) return;
  var todo = need.slice(existing);
  var rows = '';
  todo.forEach(function (n, i) {
    var it = item(n.itemId);
    rows += '<div class="section-label">' + esc(it.name) + ' — unit ' + (i + 1) + ' of ' + todo.length + '</div><div class="formgrid">';
    if (n.kind === 'tractor') {
      rows += '<label class="fld"><span>Chassis no. <b>*</b></span><input name="ch' + i + '"></label>' +
        '<label class="fld"><span>Engine no. <b>*</b></span><input name="en' + i + '"></label>' +
        '<label class="fld"><span>Colour</span><input name="cl' + i + '"></label>' +
        '<label class="fld"><span>MFG year</span><input name="yr' + i + '" type="number" value="' + thisYear() + '"></label>';
    } else {
      rows += '<label class="fld span2"><span>Serial no. <b>*</b></span><input name="sn' + i + '"></label>' +
        '<label class="fld"><span>Colour / size</span><input name="cl' + i + '"></label>' +
        '<label class="fld"><span>MFG year</span><input name="yr' + i + '" type="number" value="' + thisYear() + '"></label>';
    }
    rows += '<label class="fld"><span>Cost</span><input name="cs' + i + '" type="number" value="' + n.rate + '"></label></div>';
  });
  var m = modal({
    title: 'Chassis / serial numbers',
    wide: true,
    body: '<div class="note">Each serialised item is tracked individually. Enter the details for every unit received against ' + esc(pb.no) + '.</div>' + rows,
    footer: '<button class="btn ghost" data-skip>Later</button><button class="btn primary" data-save>Save units</button>'
  });
  qs('[data-skip]', m.el).onclick = m.close;
  qs('[data-save]', m.el).onclick = function () {
    var bad = null;
    todo.forEach(function (n, i) {
      var main = n.kind === 'tractor'
        ? (qs('[name="ch' + i + '"]', m.el).value || '').trim()
        : (qs('[name="sn' + i + '"]', m.el).value || '').trim();
      if (!main) bad = n.kind === 'tractor' ? 'Chassis number is mandatory' : 'Serial number is mandatory';
      if (n.kind === 'tractor' && !(qs('[name="en' + i + '"]', m.el).value || '').trim()) bad = 'Engine number is mandatory';
    });
    if (bad) { toast(bad, 'err'); return; }
    todo.forEach(function (n, i) {
      var g = function (nm) { var e = qs('[name="' + nm + i + '"]', m.el); return e ? (e.value || '').trim() : ''; };
      var it = item(n.itemId);
      var unit = {
        id: uid('unt'), itemId: n.itemId, branchId: pb.branchId,
        unitKind: n.kind === 'tractor' ? 'tractor' : 'implement',
        unitType: 'new',
        chassisNo: n.kind === 'tractor' ? g('ch').toUpperCase() : '',
        serialNo: n.kind === 'serial' ? g('sn').toUpperCase() : '',
        engineNo: n.kind === 'tractor' ? g('en').toUpperCase() : '',
        model: it.model || '', colour: g('cl'), mfgYear: g('yr'),
        cost: num(g('cs')), purchaseId: pb.id, purchaseNo: pb.no, purchaseDate: pb.date,
        status: 'in_stock', supplierId: pb.partyId
      };
      if (n.kind === 'serial') unit.chassisNo = '';
      S.units.push(unit);
    });
    save(true); m.close();
    toast(todo.length + ' unit(s) added to stock');
    Router.render();
  };
}

function deleteDoc(kind, id) {
  var cfg = DOCS[kind];
  var d = findOne(cfg.coll, id);
  if (!d) return;
  if (kind === 'invoice' || kind === 'financer') {
    S.units.forEach(function (u) {
      if (u.saleInvoiceId === d.id) { u.status = 'in_stock'; u.saleInvoiceId = null; u.saleDate = null; u.customerId = null; }
    });
  }
  if (kind === 'purchase') {
    S.units = S.units.filter(function (u) { return u.purchaseId !== d.id; });
  }
  S.moves = S.moves.filter(function (mv) { return mv.refId !== d.id; });
  S.payments.forEach(function (p) { if (p.refId === d.id) { p.refId = ''; delete p.refDocNo; } });
  S.notes.forEach(function (n) { if (n.refId === d.id) { n.refId = ''; } });
  removeRec(cfg.coll, d.id);
  save(true);
  toast('Deleted ' + d.no);
  Router.go(cfg.listScreen || cfg.coll);
}

         d.vehicleNo ? 'Vehicle ' + esc(d.vehicleNo) : '',
         d.ewayBill ? 'E-way ' + esc(d.ewayBill) : '',
         d.rcm ? 'Reverse charge: Yes' : ''].filter(Boolean).join(' · ') + '</div>'
      : '') +
    (d.kind === 'margin'
      ? '<div class="box">Margin money received: ' + fmt(d.amount) + '<br>By: ' + esc(d.mode || '') + '<br><b>No GST applicable</b></div>'
      : (d.lines && d.lines.length)
      ? '<table><thead><tr><th>Description</th><th>HSN</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">GST</th><th class="r">Amount</th></tr></thead><tbody>' + rows + '</tbody></table>'
      : '<div class="box">Loan amount: ' + fmt(d.loanAmount) + ' · Margin money: ' + fmt(d.marginMoney) + '</div>') +
    '<div class="tot"><table>' +
    '<tr><td>Taxable</td><td class="r">' + fmt(t.taxable) + '</td></tr>' +
    (inter ? '<tr><td>IGST</td><td class="r">' + fmt(t.igst) + '</td></tr>'
      : '<tr><td>CGST</td><td class="r">' + fmt(t.cgst) + '</td></tr><tr><td>SGST</td><td class="r">' + fmt(t.sgst) + '</td></tr>') +
    '<tr><td><b>Total</b></td><td class="r"><b>' + fmt(t.total) + '</b></td></tr></table></div>' +
    (d.kind === 'financer' ? '<div class="box"><b>Hypothecation:</b> ' +
      esc(d.financerId ? partyName(d.financerId) : (d.customerId ? partyName(d.customerId) : '')) +
      (d.loanAccountNo ? ' · Loan A/c ' + esc(d.loanAccountNo) : '') +
      (d.vehicleNo ? ' · Chassis ' + esc(d.vehicleNo) : '') +
      '<br><small>GST shown for information. This document is not reported in GSTR-1 / 3B and does not affect the P&amp;L.</small></div>' : '') +
    '<p><b>Amount in words:</b> ' + esc(numToWords(t.total)) + '</p>' +
    '<p style="margin-top:30px">For ' + esc(o.name || '') + '<br><br><br>Authorised signatory</p></body></html>';
}

</script>
<script>
/* ==== js/inventory.js ==== */
/* ============================================================
   inventory.js — tractor stock (chassis/engine), item stock,
   stock ledger, branch transfers
   ============================================================ */

function tractorItems() { return S.items.filter(function (i) { return i.category === 'tractor'; }); }

screen('stock', {
  title: 'Tractor Stock',
  render: function (view, params) {
    var tab = params.tab || 'units';
    var q = params.q || '';
    var branchF = params.branch || '';
    var unitCols = [
      { k: 'kind', label: 'Type' }, { k: 'ident', label: 'Chassis / serial' }, { k: 'engine', label: 'Engine' },
      { k: 'item', label: 'Item' }, { k: 'branch', label: 'Branch' }, { k: 'status', label: 'Status' },
      { k: 'cost', label: 'Cost' }, { k: 'year', label: 'Year' }
    ];
    var unitRows = S.units.map(function (u) {
      return {
        kind: u.unitKind === 'implement' ? 'Implement' : 'Tractor', ident: u.chassisNo || u.serialNo || '',
        engine: u.engineNo || '', item: itemName(u.itemId), branch: branchName(u.branchId),
        status: u.status || '', cost: num(u.cost), year: u.mfgYear || ''
      };
    });
    var h = pageHead('Inventory', [
      Export.action('Stock Units', function () { return unitCols; }, function () { return unitRows; }),
      { label: 'Add unit', icon: 'plus', cls: 'primary', onClick: function () { unitForm(); } }],
      'Chassis & engine number tracking');

    if (tab === 'units') {
      var units = S.units.filter(function (u) {
        if (u.unitKind === 'implement') return false;
        if (branchF && u.branchId !== branchF) return false;
        if (!q) return true;
        return [u.chassisNo, u.engineNo, u.model, u.colour].join(' ').toLowerCase().indexOf(q.toLowerCase()) > -1;
      });
      var inStock = units.filter(function (u) { return u.status === 'in_stock'; });
      var value = sum(inStock, 'cost');
      h += '<div class="stats">' +
        statCard('In stock', String(inStock.length), 'units available', 'green') +
        statCard('Stock value', inr(value), 'at cost', 'blue') +
        statCard('Sold', String(units.filter(function (u) { return u.status === 'sold'; }).length), 'all time') +
        statCard('Reserved', String(units.filter(function (u) { return u.status === 'reserved'; }).length), 'booked units', 'amber') +
        '</div>';
      h += '<div class="tabs">' + [['units', 'Tractors'], ['implements', 'Implements'], ['items', 'Spares & qty'], ['ledger', 'Ledger']].map(function (t) {
        return '<button class="tab ' + (tab === t[0] ? 'on' : '') + '" data-tab="' + t[0] + '">' + t[1] + '</button>';
      }).join('') + '</div>';
      h += '<div class="searchbar"><input id="q" placeholder="Search chassis no., engine no., model…" value="' + esc(q) + '">' +
        '<select id="bf" style="border:1px solid #d6dee6;border-radius:12px;padding:10px;background:#fff">' +
        '<option value="">All branches</option>' + S.branches.map(function (b) {
          return '<option value="' + b.id + '"' + (branchF === b.id ? ' selected' : '') + '>' + esc(b.name) + '</option>';
        }).join('') + '</select></div>';
      h += '<div class="card tight">';
      if (!units.length) h += '<div class="empty small">No tractor units found. Use <b>Add unit</b> or receive a purchase bill.</div>';
      else h += sortBy(units, 'chassisNo').map(function (u) {
        var id = 'un' + u.id;
        setTimeout(function () {
          var e = document.getElementById(id); if (e) e.onclick = function () { unitDetail(u.id); };
        }, 0);
        return '<div class="rowcard" id="' + id + '"><div class="rc-main"><div class="rc-title">' + esc(u.chassisNo) +
          ' ' + badge(u.status || 'in_stock', statusTone(u.status)) +
          (u.unitType === 'used' ? ' ' + badge('USED', 'amber') : '') + '</div>' +
          '<div class="rc-sub mono">Eng: ' + esc(u.engineNo) + '</div>' +
          '<div class="rc-sub">' + esc(itemName(u.itemId)) + (u.model ? ' · ' + esc(u.model) : '') +
          (u.colour ? ' · ' + esc(u.colour) : '') + ' · ' + esc(branchName(u.branchId)) + '</div></div>' +
          '<div class="rc-right">' + inr(u.cost) + '<small>' + (u.mfgYear || '') + '</small></div></div>';
      }).join('');
      h += '</div>';
    } else if (tab === 'implements') {
      var impls = S.units.filter(function (u) {
        if (u.unitKind !== 'implement') return false;
        if (branchF && u.branchId !== branchF) return false;
        if (!q) return true;
        return [u.serialNo, u.model, u.colour].join(' ').toLowerCase().indexOf(q.toLowerCase()) > -1;
      });
      var implIn = impls.filter(function (u) { return u.status === 'in_stock'; });
      h += '<div class="stats">' + statCard('In stock', String(implIn.length), 'serialised units', 'green') +
        statCard('Stock value', inr(sum(implIn, 'cost')), 'at cost', 'blue') +
        statCard('Sold', String(impls.filter(function (u) { return u.status === 'sold'; }).length), 'all time') + '</div>';
      h += '<div class="tabs">' + [['units', 'Tractors'], ['implements', 'Implements'], ['items', 'Spares & qty'], ['ledger', 'Ledger']].map(function (t) {
        return '<button class="tab ' + (tab === t[0] ? 'on' : '') + '" data-tab="' + t[0] + '">' + t[1] + '</button>';
      }).join('') + '</div>';
      h += '<div class="searchbar"><input id="q" placeholder="Search serial no., model…" value="' + esc(q) + '"></div>';
      h += '<div class="card tight">';
      if (!impls.length) h += '<div class="empty small">No serialised implements in stock. Mark an item as serial tracked, then receive it through a purchase bill or Add unit.</div>';
      else h += sortBy(impls, 'serialNo').map(function (u) {
        var id = 'im' + u.id;
        setTimeout(function () {
          var e = document.getElementById(id); if (e) e.onclick = function () { unitDetail(u.id); };
        }, 0);
        return '<div class="rowcard" id="' + id + '"><div class="rc-main"><div class="rc-title">' + esc(u.serialNo || '(no serial)') +
          ' ' + badge(u.status || 'in_stock', statusTone(u.status)) + '</div>' +
          '<div class="rc-sub">' + esc(itemName(u.itemId)) + (u.model ? ' · ' + esc(u.model) : '') +
          (u.colour ? ' · ' + esc(u.colour) : '') + ' · ' + esc(branchName(u.branchId)) + '</div></div>' +
          '<div class="rc-right">' + inr(u.cost) + '<small>' + (u.mfgYear || '') + '</small></div></div>';
      }).join('');
      h += '</div>';
    } else if (tab === 'items') {
      var items = S.items.filter(function (i) { return i.category !== 'tractor' && i.category !== 'service'; });
      var rows = items.map(function (i) {
        return { i: i, qty: stockQty(i.id, branchF || undefined), val: r2(stockQty(i.id, branchF || undefined) * num(i.purchaseRate || i.saleRate)) };
      }).filter(function (r) { return r.qty !== 0 || !q; });
      h += '<div class="tabs">' + [['units', 'Tractors'], ['implements', 'Implements'], ['items', 'Spares & qty'], ['ledger', 'Ledger']].map(function (t) {
        return '<button class="tab ' + (tab === t[0] ? 'on' : '') + '" data-tab="' + t[0] + '">' + t[1] + '</button>';
      }).join('') + '</div>';
      h += '<div class="searchbar"><input id="q" placeholder="Search item…" value="' + esc(q) + '"></div>';
      h += '<div class="card tight"><div class="pad" style="padding:10px 14px 0">' + table({
        cls: 'compact',
        cols: [
          { k: 'name', label: 'Item', render: function (r) { return '<b>' + esc(r.i.name) + '</b><div class="tiny muted">' + esc(r.i.category) + '</div>'; } },
          { k: 'qty', label: 'Qty', cls: 'num', render: function (r) { return '<span class="' + (r.qty <= num(r.i.reorder) ? 'red' : '') + '">' + fmtQty(r.qty) + '</span>'; } },
          { k: 'val', label: 'Value', cls: 'num', render: function (r) { return fmt(r.val, 0); } }
        ],
        rows: rows.filter(function (r) { return !q || r.i.name.toLowerCase().indexOf(q.toLowerCase()) > -1; })
      }) + '</div></div>';
      h += '<div class="card"><h3>Low stock</h3>' + (function () {
        var low = items.filter(function (i) { return stockQty(i.id) <= num(i.reorder); });
        if (!low.length) return '<div class="tiny muted">Everything is above the reorder level.</div>';
        return low.slice(0, 10).map(function (i) {
          return '<div class="kv"><span>' + esc(i.name) + '</span><span class="red">' + fmtQty(stockQty(i.id)) + ' left</span></div>';
        }).join('');
      })() + '</div>';
    } else {
      var moves = S.moves.filter(function (m) { return !q || itemName(m.itemId).toLowerCase().indexOf(q.toLowerCase()) > -1; });
      moves = sortBy(moves, 'date', 'desc').slice(0, 300);
      h += '<div class="tabs">' + [['units', 'Tractors'], ['implements', 'Implements'], ['items', 'Spares & qty'], ['ledger', 'Ledger']].map(function (t) {
        return '<button class="tab ' + (tab === t[0] ? 'on' : '') + '" data-tab="' + t[0] + '">' + t[1] + '</button>';
      }).join('') + '</div>';
      h += '<div class="searchbar"><input id="q" placeholder="Search item in ledger…" value="' + esc(q) + '"></div>';
      h += '<div class="card tight"><div class="pad" style="padding:8px 6px 0">' + table({
        cls: 'compact',
        cols: [
          { k: 'date', label: 'Date', render: function (m) { return dmy(m.date); } },
          { k: 'item', label: 'Item', render: function (m) { return esc(itemName(m.itemId)) + '<div class="tiny muted">' + esc(m.type) + ' ' + esc(m.refNo || '') + '</div>'; } },
          { k: 'qty', label: 'Qty', cls: 'num', render: function (m) { return '<span class="' + (num(m.qty) > 0 ? 'green' : 'red') + '">' + (num(m.qty) > 0 ? '+' : '') + fmtQty(m.qty) + '</span>'; } },
          { k: 'branch', label: 'Branch', cls: 'tiny', render: function (m) { return esc(branchName(m.branchId)); } }
        ],
        rows: moves
      }) + '</div></div>';
    }

    view.innerHTML = h;
    qsa('[data-tab]', view).forEach(function (b) { b.onclick = function () { Router.go('stock', { tab: b.getAttribute('data-tab') }); }; });
    var inp = document.getElementById('q');
    if (inp) inp.oninput = function () {
      clearTimeout(inp._t);
      inp._t = setTimeout(function () { Router.go('stock', { tab: tab, q: inp.value, branch: branchF }); }, 320);
    };
    var bf = document.getElementById('bf');
    if (bf) bf.onchange = function () { Router.go('stock', { tab: tab, q: q, branch: bf.value }); };
  }
});

/* ---------- unit detail ---------- */
function unitDetail(id) {
  var u = unitOf(id);
  var jobs = S.jobcards.filter(function (j) { return j.unitId === id; });
  var fuels = S.fuel.filter(function (f) { return f.unitId === id; });
  var logs = S.logbook.filter(function (l) { return l.unitId === id; });
  var inv = u.saleInvoiceId ? findOne('invoices', u.saleInvoiceId) : null;
  var head = u.unitKind === 'implement' ? (u.serialNo || '(no serial)') : (u.chassisNo || '');
  var body = '<div class="between"><div><div class="mono strong" style="font-size:16px">' + esc(head) + '</div>' +
    (u.engineNo ? '<div class="small mono">Engine: ' + esc(u.engineNo) + '</div>' : '') +
    (u.serialNo && u.unitKind !== 'implement' ? '<div class="small mono">Serial: ' + esc(u.serialNo) + '</div>' : '') +
    '</div><div>' + badge(u.status || '', statusTone(u.status)) + (u.unitType === 'used' ? ' ' + badge('USED', 'amber') : '') + '</div></div><hr>' +
    '<div class="kv"><span>Item / model</span><span>' + esc(itemName(u.itemId)) + ' ' + esc(u.model || '') + '</span></div>' +
    '<div class="kv"><span>Colour / year</span><span>' + esc(u.colour || '—') + ' · ' + esc(u.mfgYear || '—') + '</span></div>' +
    (u.hours ? '<div class="kv"><span>Hour meter</span><span>' + fmtQty(u.hours) + ' h</span></div>' : '') +
    (u.condition ? '<div class="kv"><span>Condition</span><span>' + esc(u.condition) + '</span></div>' : '') +
    (u.exchangeId ? '<div class="kv"><span>Source</span><span>Trade-in ' + esc((findOne('exchanges', u.exchangeId) || {}).no || '') + '</span></div>' : '') +
    '<div class="kv"><span>Branch</span><span>' + esc(branchName(u.branchId)) + '</span></div>' +
    '<div class="kv"><span>Cost</span><span>' + inr(u.cost) + '</span></div>' +
    (u.purchaseNo ? '<div class="kv"><span>Purchase bill</span><span>' + esc(u.purchaseNo) + ' · ' + dmy(u.purchaseDate) + '</span></div>' : '') +
    (inv ? '<div class="kv"><span>Sold on</span><span>' + esc(inv.no) + ' · ' + dmy(inv.date) + '</span></div>' +
      '<div class="kv"><span>Customer</span><span>' + esc(partyName(inv.partyId)) + '</span></div>' : '') +
    '<div class="kv"><span>Pre-delivery inspection</span><span>' +
      (function () {
        var pd = pdiFor(u.id);
        return pd ? (pd.status || 'pending') + ' · ' + dmy(pd.date) : 'not done';
      })() + '</span></div>' +
    '<div class="section-label">Service history</div>' +
    (jobs.length ? jobs.map(function (j) {
      return '<div class="kv"><span>' + esc(j.no) + ' · ' + dmy(j.date) + '</span><span>' + esc(j.status) + ' · ' + inr(j.total) + '</span></div>';
    }).join('') : '<div class="tiny muted">No job cards yet.</div>') +
    '<div class="section-label">Fuel & trips</div>' +
    '<div class="kv"><span>Fuel entries</span><span>' + fuels.length + ' · ' + fmtQty(sum(fuels, 'litres')) + ' L</span></div>' +
    '<div class="kv"><span>Logbook trips</span><span>' + logs.length + '</span></div>';

  var pdi = pdiFor(u.id);
  var m = modal({
    title: 'Tractor unit',
    wide: true, body: body,
    footer: '<button class="btn ghost" data-pdi>' + icon('check') + (pdi ? 'PDI' : 'PDI') + '</button>' +
      '<button class="btn ghost" data-transfer>' + icon('swap') + '</button>' +
      '<button class="btn ghost" data-edit>' + icon('edit') + '</button>' +
      (u.status === 'in_stock' ? '<button class="btn primary" data-sell>Sell</button>' : '')
  });
  qs('[data-pdi]', m.el).onclick = function () {
    m.close();
    if (pdi) pdiDetail(pdi.id); else pdiForm(null, u.id);
  };
  qs('[data-edit]', m.el).onclick = function () { m.close(); unitForm(u); };
  var tr = qs('[data-transfer]', m.el);
  if (tr) tr.onclick = function () { m.close(); transferForm(u.id); };
  var sl = qs('[data-sell]', m.el);
  if (sl) sl.onclick = function () {
    m.close();
    openDocEditor('invoice', null, {
      branchId: u.branchId,
      lines: [{ itemId: u.itemId, desc: itemName(u.itemId) + ' ' + (u.model || ''), hsn: item(u.itemId).hsn, qty: 1, rate: item(u.itemId).saleRate, discPct: 0, gstRate: item(u.itemId).gstRate, unitId: u.id }]
    });
  };
}

/* ---------- add / edit unit ---------- */
function serialisableItems() {
  return S.items.filter(function (i) { return i.category === 'tractor' || i.serialTracked; });
}

function unitForm(u) {
  var isNew = !u;
  var fields = [
    { k: 'itemId', label: 'Model / item', type: 'select', required: true, span: 2, options: function () {
        return serialisableItems().map(function (i) { return { v: i.id, l: itemLabel(i) }; });
      } },
    { k: 'unitType', label: 'Condition', type: 'select', options: [['new', 'New'], ['used', 'Used / exchanged']], def: 'new' },
    { k: 'mfgYear', label: 'MFG year', type: 'number', def: thisYear() },
    { k: 'chassisNo', label: 'Chassis number', span: 2 },
    { k: 'engineNo', label: 'Engine number', span: 2 },
    { k: 'serialNo', label: 'Serial number', span: 2, help: 'For implements & accessories' },
    { k: 'colour', label: 'Colour' },
    { k: 'hours', label: 'Hour meter', type: 'number' },
    { k: 'cost', label: 'Cost / landed price', type: 'number', step: '0.01' },
    { k: 'branchId', label: 'Branch', type: 'select', options: branchOptions, required: true },
    { k: 'status', label: 'Status', type: 'select', options: [['in_stock', 'In stock'], ['reserved', 'Reserved / booked'], ['sold', 'Sold'], ['transit', 'In transit']], def: 'in_stock' },
    { k: 'purchaseDate', label: 'Inward date', type: 'date', def: today() }
  ];
  editEntity({
    title: isNew ? 'Add stock unit' : 'Edit stock unit',
    wide: true, rec: u,
    defaults: { branchId: (S.branches[0] || {}).id, status: 'in_stock', purchaseDate: today(), mfgYear: thisYear(), cost: 0, unitType: 'new' },
    fields: fields,
    validate: function (v, old) {
      var it = item(v.itemId);
      if (!it.id) return 'Choose the model first';
      if (it.category === 'tractor') {
        if (!v.chassisNo) return 'Chassis number is required for a tractor';
        if (!v.engineNo) return 'Engine number is required for a tractor';
        var dup = S.units.find(function (x) {
          return x.chassisNo && x.chassisNo.toUpperCase() === String(v.chassisNo).toUpperCase() && (!old || x.id !== old.id);
        });
        if (dup) return 'Chassis number already exists in stock';
      } else {
        if (!v.serialNo) return 'Serial number is required for a serial tracked item';
        var dup2 = S.units.find(function (x) {
          return x.serialNo && x.serialNo.toUpperCase() === String(v.serialNo).toUpperCase() && (!old || x.id !== old.id);
        });
        if (dup2) return 'Serial number already exists in stock';
      }
      return null;
    },
    onSave: function (v, old) {
      var it = item(v.itemId);
      var rec = Object.assign({}, old || {}, v);
      rec.unitKind = it.category === 'tractor' ? 'tractor' : 'implement';
      rec.chassisNo = String(v.chassisNo || '').toUpperCase();
      rec.engineNo = String(v.engineNo || '').toUpperCase();
      rec.serialNo = String(v.serialNo || '').toUpperCase();
      rec.model = it.model || '';
      if (!old) { rec.id = uid('unt'); rec.purchaseNo = rec.purchaseNo || 'MANUAL'; }
      upsert('units', rec);
      toast('Unit saved'); Router.render();
    },
    onDelete: function (rec) {
      if (rec.status === 'sold') { toast('Sold units cannot be deleted', 'err'); return; }
      removeRec('units', rec.id); toast('Unit removed'); Router.render();
    }
  });
}

/* ---------- transfers ---------- */
screen('transfers', {
  title: 'Stock Transfer',
  render: function (view) {
    var list = sortBy(S.transfers, 'date', 'desc');
    var h = pageHead('Stock Transfer', [{ label: 'New transfer', icon: 'plus', cls: 'primary', onClick: function () { transferForm(); } }],
      'Move stock between branches');
    h += '<div class="card tight">';
    if (!list.length) h += '<div class="empty small">No transfers recorded.</div>';
    else h += list.map(function (t) {
      var id = 'tr' + t.id;
      setTimeout(function () {
        var e = document.getElementById(id);
        if (e) e.onclick = function () {
          confirmDlg('Delete transfer ' + t.no + '? Stock movements will be reversed.', function () {
            removeRec('transfers', t.id);
            S.moves = S.moves.filter(function (mv) { return mv.refId !== t.id; });
            if (t.unitId) { var u = unitOf(t.unitId); if (u.id) { u.branchId = t.fromBranchId; } }
            save(true); Router.render();
          }, 'Delete');
        };
      }, 0);
      return '<div class="rowcard" id="' + id + '"><div class="rc-main"><div class="rc-title">' + esc(t.no) + ' · ' + dmy(t.date) + '</div>' +
        '<div class="rc-sub">' + esc(branchName(t.fromBranchId)) + ' → ' + esc(branchName(t.toBranchId)) + ' · ' +
        (t.unitId ? 'chassis ' + esc(unitOf(t.unitId).chassisNo) : fmtQty(t.qty) + ' × ' + esc(itemName(t.itemId))) + '</div></div>' +
        '<div class="rc-right">' + (t.unitId ? '1 unit' : fmtQty(t.qty)) + '<small>moved</small></div></div>';
    }).join('');
    view.innerHTML = h + '</div>';
  }
});

function transferForm(unitId) {
  var fields = [
    { k: 'fromBranchId', label: 'From branch', type: 'select', options: branchOptions, required: true, def: (S.branches[0] || {}).id },
    { k: 'toBranchId', label: 'To branch', type: 'select', options: branchOptions, required: true },
    { k: 'date', label: 'Date', type: 'date', required: true, def: today() },
    { k: 'mode', label: 'Send as', type: 'select', options: [['unit', 'Tractor unit (chassis)'], ['qty', 'Item quantity']], def: unitId ? 'unit' : 'qty' },
    { k: 'unitId', label: 'Unit', type: 'select', span: 2, options: function () { return availableUnits().map(function (u) { return { v: u.id, l: u.chassisNo + ' · ' + (u.model || '') + ' · ' + branchName(u.branchId) }; }); } },
    { k: 'itemId', label: 'Item', type: 'select', span: 2, options: function () { return itemOptions(function (i) { return i.category !== 'tractor' && i.category !== 'service'; }); } },
    { k: 'qty', label: 'Quantity', type: 'number', def: 1 },
    { k: 'note', label: 'Remarks', type: 'textarea', span: 2, rows: 2 }
  ];
  var rec = unitId ? { unitId: unitId, mode: 'unit', date: today(), fromBranchId: (unitOf(unitId).branchId || '') } : { mode: 'qty', date: today(), qty: 1 };
  editEntity({
    title: 'Stock transfer',
    wide: true, rec: rec, fields: fields,
    onSave: function (v) {
      if (v.fromBranchId === v.toBranchId) { toast('From and to branch must differ', 'err'); return; }
      var t = {
        id: uid('trf'), no: nextNo('trf', 'TRF'), date: v.date, fromBranchId: v.fromBranchId,
        toBranchId: v.toBranchId, note: v.note, mode: v.mode
      };
      if (v.mode === 'unit') {
        if (!v.unitId) { toast('Select a unit', 'err'); return; }
        t.unitId = v.unitId;
        var u = unitOf(v.unitId);
        u.branchId = v.toBranchId;
        S.moves.push({ id: uid('mv'), date: v.date, itemId: u.itemId, branchId: v.fromBranchId, qty: -1, rate: u.cost, type: 'transfer', refId: t.id, refNo: t.no, note: 'To ' + branchName(v.toBranchId) });
        S.moves.push({ id: uid('mv'), date: v.date, itemId: u.itemId, branchId: v.toBranchId, qty: 1, rate: u.cost, type: 'transfer', refId: t.id, refNo: t.no, note: 'From ' + branchName(v.fromBranchId) });
      } else {
        if (!v.itemId || !num(v.qty)) { toast('Item and quantity required', 'err'); return; }
        t.itemId = v.itemId; t.qty = num(v.qty);
        S.moves.push({ id: uid('mv'), date: v.date, itemId: v.itemId, branchId: v.fromBranchId, qty: -num(v.qty), rate: 0, type: 'transfer', refId: t.id, refNo: t.no, note: 'To ' + branchName(v.toBranchId) });
        S.moves.push({ id: uid('mv'), date: v.date, itemId: v.itemId, branchId: v.toBranchId, qty: num(v.qty), rate: 0, type: 'transfer', refId: t.id, refNo: t.no, note: 'From ' + branchName(v.fromBranchId) });
      }
      upsert('transfers', t); save(true);
      toast('Stock transferred'); Router.render();
    }
  });
}

</script>
<script>
/* ==== js/insurance.js ==== */
/* ============================================================
   insurance.js — insurance companies/agents master and
   policy register with due-date tracking
   ============================================================ */

function insurerOptions() {
  return S.insurers.filter(function (i) { return i.active !== false; })
    .map(function (i) { return { v: i.id, l: i.name + (i.type === 'agent' ? ' (agent)' : '') }; });
}
function insurerName(id) {
  var i = S.insurers.find(function (x) { return x.id === id; });
  return i ? i.name : '—';
}

screen('insurance', {
  title: 'Insurance',
  render: function (view, params) {
    var tab = params.tab || 'policies';
    var policies = sortBy(S.policies, 'dueDate');
    var due = policies.filter(function (p) { return policyDueStatus(p) === 'due'; });
    var expired = policies.filter(function (p) { return policyDueStatus(p) === 'expired'; });
    var premium = sum(policies, 'premium');

    var h = pageHead('Insurance', [{ label: tab === 'policies' ? 'New policy' : 'New insurer', icon: 'plus', cls: 'primary', onClick: function () { tab === 'policies' ? policyForm() : insurerForm(); } }],
      policies.length + ' policies · ' + due.length + ' due soon · ' + expired.length + ' expired');
    h += '<div class="tabs">' + [['policies', 'Policies'], ['insurers', 'Companies & agents']].map(function (t) {
      return '<button class="tab ' + (tab === t[0] ? 'on' : '') + '" data-tab="' + t[0] + '">' + t[1] + '</button>';
    }).join('') + '</div>';

    if (tab === 'policies') {
      h += '<div class="stats">' + statCard('Policies', String(policies.length), 'in register') +
        statCard('Premium', inr(premium), 'total booked', 'blue') +
        statCard('Due in 30 days', String(due.length), 'renew now', 'amber') +
        statCard('Expired', String(expired.length), 'no cover', 'red') + '</div>';
      h += '<div class="card tight">';
      if (!policies.length) h += '<div class="empty small">No policies yet. Add tractor and implement insurance to track renewals.</div>';
      else h += policies.map(function (p) {
        var st = policyDueStatus(p);
        var tone = st === 'expired' ? 'red' : st === 'due' ? 'amber' : 'green';
        var txt = st === 'expired' ? 'EXPIRED' : st === 'due' ? 'DUE ' + daysBetween(today(), p.dueDate) + 'd' : 'ACTIVE';
        var id = 'pol' + p.id;
        setTimeout(function () {
          var e = document.getElementById(id); if (e) e.onclick = function () { policyForm(p); };
        }, 0);
        return '<div class="rowcard" id="' + id + '"><div class="rc-main"><div class="rc-title">' + esc(p.policyNo || 'No policy no.') +
          ' ' + badge(txt, tone) + '</div>' +
          '<div class="rc-sub">' + esc(partyName(p.customerId)) + ' · ' + esc(p.vehicleNo || (p.unitId ? unitOf(p.unitId).chassisNo : '—')) +
          ' · ' + esc(insurerName(p.insurerId)) + '</div>' +
          '<div class="rc-sub">' + esc(p.policyType || '') + ' · due ' + dmy(p.dueDate) + '</div></div>' +
          '<div class="rc-right">' + inr(p.premium) + '<small>IDV ' + inr(p.sumInsured) + '</small></div></div>';
      }).join('');
      h += '</div>';
    } else {
      h += '<div class="card tight">';
      if (!S.insurers.length) h += '<div class="empty small">Add the insurance companies and agents you deal with.</div>';
      else h += S.insurers.map(function (i) {
        var count = S.policies.filter(function (p) { return p.insurerId === i.id; }).length;
        var id = 'ins' + i.id;
        setTimeout(function () {
          var e = document.getElementById(id); if (e) e.onclick = function () { insurerForm(i); };
        }, 0);
        return '<div class="rowcard" id="' + id + '"><div class="rc-main"><div class="rc-title">' + esc(i.name) + ' ' +
          badge(i.type === 'agent' ? 'AGENT' : 'COMPANY', i.type === 'agent' ? 'blue' : 'grey') + '</div>' +
          '<div class="rc-sub">' + esc(i.phone || '') + (i.email ? ' · ' + esc(i.email) : '') + ' · ' + count + ' policies</div></div>' +
          '<div class="rc-right">' + (i.active === false ? badge('inactive', 'red') : '') + '</div></div>';
      }).join('');
      h += '</div>';
    }
    view.innerHTML = h;
    qsa('[data-tab]', view).forEach(function (b) { b.onclick = function () { Router.go('insurance', { tab: b.getAttribute('data-tab') }); }; });
  }
});

function policyForm(p) {
  var isNew = !p;
  var fields = [
    { k: 'policyNo', label: 'Policy number', required: true, span: 2 },
    { k: 'insurerId', label: 'Insurance company / agent', type: 'select', required: true, options: insurerOptions },
    { k: 'policyType', label: 'Policy type', type: 'select', options: [['comprehensive', 'Comprehensive'], ['third-party', 'Third party'], ['tractor', 'Tractor package'], ['implement', 'Implement'], ['other', 'Other']], def: 'comprehensive' },
    { k: 'customerId', label: 'Insured customer', type: 'select', required: true, options: function () { return partyOptions(['customer']); } },
    { k: 'unitId', label: 'Link to stock unit', type: 'select', options: function () { return S.units.map(function (u) { return { v: u.id, l: (u.chassisNo || u.serialNo) + ' · ' + (u.model || '') }; }); } },
    { k: 'vehicleNo', label: 'Vehicle / chassis / serial no.', span: 2 },
    { k: 'sumInsured', label: 'IDV / sum insured', type: 'number', step: '0.01' },
    { k: 'premium', label: 'Premium', type: 'number', step: '0.01' },
    { k: 'startDate', label: 'Policy start', type: 'date', def: today() },
    { k: 'dueDate', label: 'Renewal due date', type: 'date', required: true, def: addDays(today(), 365) },
    { k: 'agentName', label: 'Agent name' },
    { k: 'agentPhone', label: 'Agent phone', type: 'tel' },
    { k: 'remarks', label: 'Remarks', type: 'textarea', span: 2, rows: 2 }
  ];
  editEntity({
    title: isNew ? 'New insurance policy' : 'Edit policy',
    wide: true, rec: p, fields: fields,
    defaults: { startDate: today(), dueDate: addDays(today(), 365), policyType: 'comprehensive', premium: 0, sumInsured: 0 },
    onSave: function (v, old) {
      var rec = Object.assign({}, old || {}, v);
      if (!old) rec.id = uid('pol');
      if (rec.unitId && !rec.vehicleNo) {
        var u = unitOf(rec.unitId);
        rec.vehicleNo = u.chassisNo || u.serialNo || '';
      }
      upsert('policies', rec);
      toast(old ? 'Policy updated' : 'Policy added');
      Router.render();
    },
    onDelete: function (rec) { removeRec('policies', rec.id); toast('Policy deleted'); Router.render(); }
  });
}

function insurerForm(i) {
  editEntity({
    title: i ? 'Edit insurer' : 'New insurer / agent',
    wide: true, rec: i,
    defaults: { type: 'company', active: true },
    fields: [
      { k: 'name', label: 'Name', required: true, span: 2 },
      { k: 'type', label: 'Type', type: 'select', options: [['company', 'Insurance company'], ['agent', 'Agent / broker']], def: 'company' },
      { k: 'phone', label: 'Phone', type: 'tel' },
      { k: 'email', label: 'Email', type: 'email' },
      { k: 'address', label: 'Address', type: 'textarea', span: 2, rows: 2 },
      { k: 'active', label: 'Active', type: 'checkbox', def: true, help: 'Shown in policy dropdowns' }
    ],
    onSave: function (v, old) {
      var rec = Object.assign({}, old || {}, v);
      if (!old) rec.id = uid('ins');
      upsert('insurers', rec); toast('Saved'); Router.render();
    },
    onDelete: function (rec) {
      var used = S.policies.some(function (p) { return p.insurerId === rec.id; });
      if (used) { toast('Insurer has policies — deactivate instead', 'err'); return; }
      removeRec('insurers', rec.id); Router.render();
    }
  });
}


/* alias so Masters can open the insurer tab directly */
screen('insurers', {
  title: 'Insurance Companies',
  render: function (view) { Router.go('insurance', { tab: 'insurers' }); }
});

</script>
<script>
/* ==== js/exchange.js ==== */
/* ============================================================
   exchange.js — old tractor exchange (trade-in) against a sale
   ============================================================ */

screen('exchanges', {
  title: 'Tractor Exchange',
  render: function (view, params) {
    var list = sortBy(S.exchanges, 'date', 'desc');
    var totalVal = sum(list, 'value');
    var h = pageHead('Tractor Exchange', [{ label: 'New exchange', icon: 'plus', cls: 'primary', onClick: function () { exchangeForm(); } }],
      list.length + ' trade-ins · ' + inr(totalVal) + ' taken in');

    h += '<div class="stats">' +
      statCard('Trade-ins', String(list.length), 'old tractors taken') +
      statCard('Value taken in', inr(totalVal), 'at valuation', 'blue') +
      statCard('Adjusted on sales', inr(sum(list.filter(function (x) { return x.invoiceId; }), 'value')), 'against invoices', 'green') +
      statCard('Paid to customer', inr(sum(list.filter(function (x) { return !x.invoiceId || x.settle === 'pay'; }), 'value')), 'cash settlement', 'amber') +
      '</div>';

    h += '<div class="card tight">';
    if (!list.length) h += '<div class="empty small">No trade-ins yet. Exchange an old tractor against a new sale and it enters stock automatically.</div>';
    else h += list.map(function (x) {
      var id = 'ex' + x.id;
      setTimeout(function () {
        var e = document.getElementById(id); if (e) e.onclick = function () { exchangeDetail(x.id); };
      }, 0);
      var inv = x.invoiceId ? findOne('invoices', x.invoiceId) : null;
      return '<div class="rowcard" id="' + id + '"><div class="rc-main"><div class="rc-title">' + esc(x.no) + ' · ' + esc(partyName(x.customerId)) + '</div>' +
        '<div class="rc-sub">' + esc(x.oldModel || itemName(x.itemId)) + ' · ' + esc(x.chassisNo || '') + ' · ' + dmy(x.date) + '</div>' +
        '<div class="rc-sub">' + (inv ? 'Against ' + esc(inv.no) : 'Standalone purchase') + ' · ' + esc(x.settle === 'pay' ? 'paid to customer' : 'adjusted') + '</div></div>' +
        '<div class="rc-right">' + inr(x.value) + '<small>' + esc(branchName(x.branchId)) + '</small></div></div>';
    }).join('');
    h += '</div>';

    h += '<div class="card"><h3>How exchange is treated</h3><div class="tiny muted">' +
      'The old tractor comes into stock at its valuation and is tracked with its own chassis and engine number, so you can resell it like any other unit. ' +
      'When it is set against a new invoice, the invoice outstanding falls by the exchange value — no GST is charged on the trade-in and it does not count as sales revenue in the P&L.</div></div>';
    view.innerHTML = h;
  }
});

function exchangeForm(x) {
  var isNew = !x;
  var fields = [
    { k: 'date', label: 'Exchange date', type: 'date', required: true, def: today() },
    { k: 'customerId', label: 'Customer', type: 'select', required: true, options: function () { return partyOptions(['customer']); } },
    { k: 'itemId', label: 'Old tractor model', type: 'select', options: function () {
        return S.items.filter(function (i) { return i.category === 'tractor'; }).map(function (i) { return { v: i.id, l: i.name }; });
      } },
    { k: 'oldModel', label: 'Make / model (as seen)', placeholder: 'e.g. Mahindra 265 DI 2016' },
    { k: 'chassisNo', label: 'Old chassis no.', required: true },
    { k: 'engineNo', label: 'Old engine no.', required: true },
    { k: 'mfgYear', label: 'Year of manufacture', type: 'number' },
    { k: 'hours', label: 'Hour meter', type: 'number' },
    { k: 'condition', label: 'Condition', type: 'select', options: [['good', 'Good'], ['average', 'Average'], ['poor', 'Needs work']], def: 'average' },
    { k: 'value', label: 'Exchange valuation', type: 'number', step: '0.01', required: true },
    { k: 'invoiceId', label: 'Adjust against invoice', type: 'select', span: 2, options: function () {
        return S.invoices.filter(function (i) { return i.docType !== 'financer' && invoiceOutstanding(i) > 0.5; })
          .map(function (i) { return { v: i.id, l: i.no + ' · ' + partyName(i.partyId) + ' · open ' + inr(invoiceOutstanding(i)) }; });
      } },
    { k: 'settle', label: 'Settlement', type: 'select', options: [['adjust', 'Adjust against invoice'], ['pay', 'Pay the customer']], def: 'adjust' },
    { k: 'branchId', label: 'Branch', type: 'select', options: branchOptions, required: true, def: (S.branches[0] || {}).id },
    { k: 'brokerId', label: 'Broker (if any)', type: 'select', options: function () { return brokerList().map(function (b) { return { v: b.id, l: b.name }; }); } },
    { k: 'remarks', label: 'Remarks / valuation notes', type: 'textarea', span: 2, rows: 2 }
  ];
  editEntity({
    title: isNew ? 'New tractor exchange' : 'Edit exchange',
    wide: true, rec: x, fields: fields,
    defaults: { date: today(), settle: 'adjust', condition: 'average', branchId: (S.branches[0] || {}).id },
    validate: function (v, old) {
      if (!num(v.value)) return 'Enter the exchange valuation';
      if (v.settle !== 'pay' && v.invoiceId) {
        var inv = findOne('invoices', v.invoiceId);
        if (inv) {
          var open = invoiceOutstanding(inv) + (old && old.invoiceId === v.invoiceId ? num(old.value) : 0);
          if (num(v.value) > open + 0.5) {
            return 'Exchange value ' + inr(v.value) + ' is more than the invoice balance ' + inr(open) +
              '. Reduce the valuation or set settlement to "Pay the customer".';
          }
        }
      }
      var dup = S.units.find(function (u) {
        return u.chassisNo && String(u.chassisNo).toUpperCase() === String(v.chassisNo).toUpperCase();
      });
      if (dup && (!old || old.chassisNo !== v.chassisNo)) return 'This chassis number is already in stock';
      return null;
    },
    onSave: function (v, old) {
      var rec = Object.assign({}, old || {}, v);
      rec.value = num(v.value);
      rec.chassisNo = String(v.chassisNo || '').toUpperCase();
      rec.engineNo = String(v.engineNo || '').toUpperCase();
      if (rec.settle === 'pay') rec.invoiceId = '';
      if (rec.settle !== 'pay' && !rec.invoiceId) rec.settle = 'adjust';
      if (!old) rec.id = uid('exc');
      if (!rec.no) rec.no = nextNo('exc', settings().exchPrefix || 'EXC');
      upsert('exchanges', rec);

      // the old tractor enters stock as a used unit
      var unit = S.units.find(function (u) { return u.exchangeId === rec.id; });
      if (!unit) {
        unit = {
          id: uid('unt'), unitKind: 'tractor', unitType: 'used', itemId: rec.itemId || '',
          chassisNo: rec.chassisNo, engineNo: rec.engineNo, model: rec.oldModel || itemName(rec.itemId),
          colour: '', mfgYear: rec.mfgYear, hours: num(rec.hours), condition: rec.condition,
          cost: rec.value, branchId: rec.branchId, status: 'in_stock',
          source: 'exchange', exchangeId: rec.id, purchaseDate: rec.date, purchaseNo: rec.no
        };
        S.units.push(unit);
      } else {
        unit.chassisNo = rec.chassisNo; unit.engineNo = rec.engineNo; unit.cost = rec.value;
        unit.branchId = rec.branchId; unit.mfgYear = rec.mfgYear; unit.hours = num(rec.hours);
        unit.condition = rec.condition; unit.model = rec.oldModel || itemName(rec.itemId);
      }
      save(true);
      toast(old ? 'Exchange updated' : 'Exchange recorded — old tractor added to stock');
      Router.render();
    },
    onDelete: function (rec) {
      var unit = S.units.find(function (u) { return u.exchangeId === rec.id; });
      if (unit && unit.status === 'sold') { toast('The traded-in tractor is already sold — cannot delete', 'err'); return; }
      confirmDlg('Delete this exchange and remove the traded-in tractor from stock?', function () {
        if (unit) removeRec('units', unit.id);
        removeRec('exchanges', rec.id);
        toast('Exchange deleted'); Router.render();
      }, 'Delete');
    }
  });
}

function exchangeDetail(id) {
  var x = findOne('exchanges', id);
  if (!x) return;
  var unit = S.units.find(function (u) { return u.exchangeId === x.id; });
  var inv = x.invoiceId ? findOne('invoices', x.invoiceId) : null;
  var m = modal({
    title: x.no,
    wide: true,
    body: '<div class="kv"><span>Date</span><span>' + dmy(x.date) + '</span></div>' +
      '<div class="kv"><span>Customer</span><span>' + esc(partyName(x.customerId)) + '</span></div>' +
      '<div class="kv"><span>Old tractor</span><span>' + esc(x.oldModel || itemName(x.itemId)) + '</span></div>' +
      '<div class="kv"><span>Chassis</span><span class="mono">' + esc(x.chassisNo) + '</span></div>' +
      '<div class="kv"><span>Engine</span><span class="mono">' + esc(x.engineNo) + '</span></div>' +
      '<div class="kv"><span>Year / hours</span><span>' + esc(x.mfgYear || '—') + ' · ' + fmtQty(x.hours || 0) + ' h</span></div>' +
      '<div class="kv"><span>Condition</span><span>' + esc(x.condition || '') + '</span></div>' +
      '<div class="kv"><span>Valuation</span><span>' + inr(x.value) + '</span></div>' +
      '<div class="kv"><span>Adjusted against</span><span>' + (inv ? esc(inv.no) + ' · ' + inr(inv.total) : '—') + '</span></div>' +
      '<div class="kv"><span>Stock status</span><span>' + (unit ? badge(unit.status, statusTone(unit.status)) : 'removed') + '</span></div>' +
      (x.remarks ? '<div class="note">' + esc(x.remarks) + '</div>' : ''),
    footer: (unit ? '<button class="btn ghost" data-unit>Stock</button>' : '') +
      '<button class="btn ghost" data-print>' + icon('print') + 'PDF</button>' +
      '<button class="btn primary" data-edit>Edit</button>'
  });
  qs('[data-edit]', m.el).onclick = function () { m.close(); exchangeForm(x); };
  qs('[data-print]', m.el).onclick = function () { m.close(); printDoc('exchange', x.id); };
  var ub = qs('[data-unit]', m.el);
  if (ub) ub.onclick = function () { m.close(); unitDetail(unit.id); };
}

</script>
<script>
/* ==== js/masters2.js ==== */
/* ============================================================
   masters2.js — make/model, locations, financer, transport,
   bank accounts
   ============================================================ */

/* ================= MAKE / MODEL MASTER ================= */
var MAKE_CATS = [['tractor', 'Tractors'], ['implement', 'Implements'], ['accessory', 'Accessories']];

screen('makes', {
  title: 'Make / Model Master',
  render: function (view, params) {
    var cat = params.cat || 'tractor';
    var catName = (MAKE_CATS.find(function (c) { return c[0] === cat; }) || ['', 'Tractors'])[1];
    var makes = sortBy(S.makes.filter(function (m) { return (m.category || 'tractor') === cat; }), 'name');
    var models = sortBy(S.models.filter(function (md) {
      var mk = S.makes.find(function (m) { return m.id === md.makeId; });
      return mk && (mk.category || 'tractor') === cat;
    }), 'name');

    var h = pageHead('Make / Model Master', [
      { label: 'Add make', icon: 'plus', onClick: function () { makeForm(); } },
      { label: 'Add model', icon: 'plus', cls: 'primary', onClick: function () { modelForm(); } }
    ], catName + ' · ' + makes.length + ' makes · ' + models.length + ' models');

    h += '<div class="tabs">' + MAKE_CATS.map(function (c) {
      return '<button class="tab ' + (cat === c[0] ? 'on' : '') + '" data-cat="' + c[0] + '">' + c[1] + '</button>';
    }).join('') + '</div>';

    h += '<div class="card tight"><h3 style="padding:12px 14px 0">Makes — ' + esc(catName) + '</h3>';
    if (!makes.length) h += '<div class="empty small">No makes yet for ' + esc(catName.toLowerCase()) + '.</div>';
    else h += makes.map(function (mk) {
      var n = S.models.filter(function (x) { return x.makeId === mk.id; }).length;
      var id = 'mk' + mk.id;
      setTimeout(function () {
        var e = document.getElementById(id); if (e) e.onclick = function () { makeForm(mk); };
      }, 0);
      return '<div class="rowcard" id="' + id + '"><div class="rc-main"><div class="rc-title">' + esc(mk.name) +
        (mk.active === false ? ' ' + badge('inactive', 'grey') : '') + '</div>' +
        '<div class="rc-sub">' + n + ' model(s)</div></div><div class="rc-right">' + n + '</div></div>';
    }).join('');
    h += '</div>';

    h += '<div class="card tight"><h3 style="padding:12px 14px 0">Models — ' + esc(catName) + '</h3>';
    if (!models.length) h += '<div class="empty small">No models yet. Add models under each make.</div>';
    else h += models.map(function (md) {
      var used = S.items.filter(function (i) { return i.modelId === md.id; }).length;
      var id = 'md' + md.id;
      setTimeout(function () {
        var e = document.getElementById(id); if (e) e.onclick = function () { modelForm(md); };
      }, 0);
      return '<div class="rowcard" id="' + id + '"><div class="rc-main"><div class="rc-title">' + esc(md.name) + '</div>' +
        '<div class="rc-sub">' + esc(makeName(md.makeId)) + (md.hp ? ' · ' + md.hp + ' HP' : '') + ' · ' + used + ' item(s)</div></div>' +
        '<div class="rc-right">' + (md.active === false ? badge('off', 'grey') : '') + '</div></div>';
    }).join('');
    h += '</div>';

    h += '<div class="card"><h3>Separate masters per category</h3><div class="tiny muted">' +
      'Tractors, implements and accessories each keep their own makes and models, so a Mahindra tractor never appears in the implement picker. ' +

/* balance of one bank account from every cash movement tagged to it */
function bankEntries(bankId, from, to) {
  var out = [];
  S.payments.forEach(function (p) {
    if (p.bankAccountId !== bankId && !(bankId === 'all' && p.mode !== 'cash' && p.mode !== 'petty')) return;
    if (from && !inRange(p.date, from, to)) return;
    out.push({
      date: p.date, particulars: (p.type === 'in' ? 'Received from ' : 'Paid to ') + partyName(p.partyId),
      ref: p.refDocNo || p.refNo || '', mode: p.mode,
      inAmt: p.type === 'in' ? num(p.amount) : 0, outAmt: p.type === 'out' ? num(p.amount) : 0
    });
  });
  S.expenses.forEach(function (e) {
    if (e.bankAccountId !== bankId && !(bankId === 'all' && e.mode && e.mode !== 'cash')) return;
    if (from && !inRange(e.date, from, to)) return;
    out.push({ date: e.date, particulars: 'Expense: ' + (e.particulars || e.head), ref: '', mode: e.mode, inAmt: 0, outAmt: num(e.amount) });
  });
  S.marginReceipts.forEach(function (m) {
    if (m.bankAccountId !== bankId && !(bankId === 'all' && m.mode && m.mode !== 'cash')) return;
    if (from && !inRange(m.date, from, to)) return;
    out.push({ date: m.date, particulars: 'Margin money — ' + partyName(m.partyId), ref: m.no, mode: m.mode, inAmt: num(m.amount), outAmt: 0 });
  });
  return sortBy(out, 'date');
}
function bankBalance(bankId) {
  var b = bankAccount(bankId);
  var opening = num(b.openingBal);
  var rows = bankEntries(bankId);
  return r2(opening + sum(rows, 'inAmt') - sum(rows, 'outAmt'));
}

          var b = partyBalance(p.id);
          p.openingBal = Math.abs(b);
          p.openingType = b >= 0 ? 'dr' : 'cr';
        });
        settings().cashOpening = num(settings().cashOpening || 0);
        S.bankAccounts.forEach(function (b) { b.openingBal = bankBalance(b.id); });
        save(true);
        toast('Opening balances carried forward');
        Router.render();
      }, 'Carry forward');
    };

    document.getElementById('bSeries').onclick = function () {
      confirmDlg('Reset all document numbers for FY ' + fy + ' to start from 001?', function () {
        Object.keys(S.counters).forEach(function (k) {
          if (k.indexOf(fy) > -1) delete S.counters[k];
        });
        save(true);
        toast('Series reset for FY ' + fy);
        Router.render();
      }, 'Reset series');
    };

    document.getElementById('bClose').onclick = function () {
      confirmDlg('Close FY ' + fy + '? This records the closure in the log. Nothing is deleted.', function () {
        S.meta.fyClosings = S.meta.fyClosings || [];
        S.meta.fyClosings.push({
          fy: fy, on: today(), by: (me().name || ''),
          sales: sum(invs, 'taxable'), purchases: sum(purs, 'taxable'),
          receivable: recv, payable: pay
        });
        save(true);
        toast('FY ' + fy + ' closed');
        Router.render();
      }, 'Close FY');
    };
  }
});

<script>
/* ==== js/ledgers.js ==== */
/* ============================================================
   ledgers.js — bank book, TA ledger, incentive ledger,
   commission ledger (tractor / implements), transport ledger
