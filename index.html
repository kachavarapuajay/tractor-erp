<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f5132">
<meta name="mobile-web-app-capable" content="yes">
<title>Tractor ERP — Web</title>
<style>
:root{
  --bg:#f4f6f8; --card:#ffffff; --ink:#111c26; --muted:#65727f; --line:#e2e8ee;
  --brand:#0f5132; --brand2:#14794a; --accent:#e8a317; --blue:#1565c0;
  --green:#1b8a4b; --red:#c62828; --amber:#b26a00; --grey:#6b7785;
  --radius:14px; --shadow:0 1px 2px rgba(16,32,48,.06),0 4px 14px rgba(16,32,48,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.45;
  overscroll-behavior-y:none;-webkit-text-size-adjust:100%;
}
.ic{width:20px;height:20px;flex:0 0 auto}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px}

/* ---------- shell ---------- */
.shell{display:flex;flex-direction:column;min-height:100%}
.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;
  padding:calc(env(safe-area-inset-top) + 8px) 8px 10px;box-shadow:0 2px 10px rgba(0,0,0,.12);
}
.tb-title{flex:1;font-weight:650;font-size:16.5px;letter-spacing:.2px;padding-left:4px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;
  width:38px;height:38px;display:grid;place-items:center;padding:0}
.iconbtn:active{background:rgba(255,255,255,.28)}
.modal .iconbtn{background:#eef2f6;color:#33414f}
.view{flex:1;padding-bottom:calc(24px + env(safe-area-inset-bottom))}

/* ---------- drawer ---------- */
.drawer{
  position:fixed;top:0;left:0;bottom:0;width:284px;max-width:84vw;background:#fff;z-index:60;
  transform:translateX(-102%);transition:transform .22s ease;display:flex;flex-direction:column;
  box-shadow:4px 0 24px rgba(0,0,0,.16);padding-top:env(safe-area-inset-top);
}
.drawer.open{transform:translateX(0)}
.drawer-scrim{position:fixed;inset:0;background:rgba(8,18,28,.45);opacity:0;pointer-events:none;
  transition:opacity .2s;z-index:55}
.drawer-scrim.show{opacity:1;pointer-events:auto}
.drawer-head{display:flex;gap:10px;align-items:center;padding:16px 14px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
.orglogo{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-weight:700;font-size:19px}
.dorg{font-weight:650;font-size:15px}
.dsub{font-size:11.5px;opacity:.85}
.drawer-user{font-size:11.5px;color:var(--muted);padding:8px 16px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.5px}
.dnav{flex:1;overflow-y:auto;padding:6px 0}
.dgroup{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:#93a1af;padding:12px 16px 5px;font-weight:700}
.ditem{display:flex;align-items:center;gap:12px;padding:11px 16px;color:#22303d;text-decoration:none;font-size:14.5px}
.ditem .ic{color:#5c6b7a;width:19px;height:19px}
.ditem:active{background:#eef4f0}
.ditem.danger{color:var(--red)}
.ditem.danger .ic{color:var(--red)}
.drawer-foot{border-top:1px solid var(--line);padding:4px 0 calc(6px + env(safe-area-inset-bottom))}

/* ---------- page ---------- */
.pagehead{display:flex;align-items:flex-start;gap:10px;padding:14px 14px 6px;flex-wrap:wrap}
.pagehead h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.2px}
.pagehead .sub{font-size:12px;color:var(--muted);margin-top:2px}
.pagehead .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.pad{padding:0 14px 14px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin:0 14px 12px}
.card.tight{padding:0;overflow:hidden}
.card h3{margin:0 0 10px;font-size:14px;font-weight:700;color:#26333f}
.card h3 .more{float:right;font-size:12px;color:var(--blue);font-weight:600}
.note{font-size:12px;color:var(--muted);background:#f7fafc;border-left:3px solid var(--accent);padding:8px 10px;border-radius:6px;margin-top:10px}
.empty{text-align:center;padding:38px 16px;color:var(--muted)}
.empty .ic{width:40px;height:40px;opacity:.35;margin-bottom:8px}
.empty.small{padding:22px 12px;font-size:13px}
.empty p{margin:0 0 12px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;
  color:#22303d;border-radius:10px;padding:9px 13px;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn .ic{width:16px;height:16px}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{background:#fdecea;border-color:#f7c9c4;color:var(--red)}
.btn.ghost{background:#fff}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn.block{width:100%;justify-content:center;padding:13px}
.fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;
  background:var(--brand);color:#fff;border:0;display:grid;place-items:center;box-shadow:0 8px 22px rgba(15,81,50,.35);z-index:25}
.fab .ic{width:26px;height:26px}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:8px 14px 4px}
.stat{background:#fff;border-radius:var(--radius);padding:12px 13px;box-shadow:var(--shadow)}
.stat .slabel{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.stat .svalue{font-size:19px;font-weight:750;margin-top:5px;letter-spacing:-.4px}
.stat .ssub{font-size:11.5px;color:var(--muted);margin-top:3px}
.stat.green .svalue{color:var(--green)} .stat.red .svalue{color:var(--red)}
.stat.amber .svalue{color:var(--amber)} .stat.blue .svalue{color:var(--blue)}

/* ---------- list rows ---------- */
.rowcard{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);background:#fff}
.rowcard:last-child{border-bottom:0}
.rowcard:active{background:#f7f9fb}
.rc-main{flex:1;min-width:0}
.rc-title{font-weight:620;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-sub{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.rc-right{text-align:right;font-weight:680;font-size:14px;white-space:nowrap}
.rc-right small{display:block;font-weight:500;font-size:11px;color:var(--muted);margin-top:2px}
.badge{display:inline-block;font-size:10.5px;font-weight:700;padding:2.5px 7px;border-radius:20px;
  background:#eef2f6;color:#4c5a68;text-transform:uppercase;letter-spacing:.3px}
.badge.green{background:#e6f5ec;color:#137a42} .badge.red{background:#fdecea;color:#b3261e}
.badge.amber{background:#fff4e0;color:#8a5300} .badge.blue{background:#e7f0fb;color:#1558a8}
.badge.grey{background:#eef2f6;color:#5a6775}

/* ---------- tables ---------- */
.twrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
.tbl th{background:#f2f5f8;text-align:left;padding:9px 10px;font-size:11px;text-transform:uppercase;
  letter-spacing:.4px;color:#54636f;font-weight:700;white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tbody tr:active{background:#f7f9fb}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tfoot td{background:#f7fafc;font-weight:700;border-top:1px solid var(--line)}
.tbl.compact th,.tbl.compact td{padding:6px 7px;font-size:12px}

/* ---------- forms ---------- */
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:#44525f}
.fld.span2{grid-column:span 2}
.fld>span b{color:var(--red)}
.fld input,.fld select,.fld textarea{
  border:1px solid #d6dee6;border-radius:10px;padding:11px 12px;background:#fff;color:var(--ink);
  font-weight:500;width:100%;outline:none;transition:border .15s,box-shadow .15s}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(20,121,74,.12)}
.fld .help{font-weight:500;color:var(--muted);font-size:11px}
.switchrow{display:flex;align-items:center;gap:8px;padding-top:6px}
.switchrow input{width:18px;height:18px}
.formgrid .fld input[type=checkbox]{width:auto}
.confirmmsg{font-size:14.5px;margin:6px 0}

/* ---------- modal ---------- */
.modalwrap{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modalwrap .scrim{position:absolute;inset:0;background:rgba(8,18,28,.5);opacity:0;transition:opacity .18s}
.modalwrap.in .scrim{opacity:1}
.modal{position:relative;background:#fff;width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;
  border-radius:18px 18px 0 0;transform:translateY(24px);transition:transform .22s ease;overflow:hidden}
.modalwrap.in .modal{transform:translateY(0)}
.mhead{display:flex;align-items:center;gap:10px;padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.mtitle{flex:1;font-weight:700;font-size:16px}
.mbody{padding:14px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.mfoot{display:flex;gap:10px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fbfcfd}
.mfoot .btn{flex:1;justify-content:center;padding:12px}
@media(min-width:640px){.modalwrap{align-items:center}.modal{border-radius:18px}}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:80px;transform:translate(-50%,20px);background:#1e2b36;color:#fff;
  padding:11px 18px;border-radius:22px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;
  transition:all .22s;z-index:200;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:#b3261e}

/* ---------- charts ---------- */
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:flex;align-items:center;gap:8px;font-size:12px}
.bar-row .bl{width:82px;color:var(--muted);flex:0 0 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btrack{flex:1;height:9px;background:#eef2f6;border-radius:6px;overflow:hidden}
.bfill{height:100%;background:var(--brand2);border-radius:6px}
.bfill.blue{background:var(--blue)} .bfill.amber{background:var(--accent)} .bfill.red{background:var(--red)}
.bar-row .bv{width:74px;text-align:right;font-weight:650;font-variant-numeric:tabular-nums}
.linechart{width:100%;height:110px;display:block}
.xlabels{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:2px}

/* ---------- tabs / chips ---------- */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:6px 14px 10px;-webkit-overflow-scrolling:touch}
.tab{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 13px;font-size:12.5px;
  font-weight:650;color:#4c5a68;white-space:nowrap}
.tab.on{background:var(--brand);border-color:var(--brand);color:#fff}
.searchbar{display:flex;gap:8px;padding:8px 14px}
.searchbar input{flex:1;border:1px solid #d6dee6;border-radius:12px;padding:10px 12px;background:#fff;outline:none}

/* ---------- doc view ---------- */
.doc{background:#fff;border-radius:12px;padding:16px;font-size:13px}
.doc h2{font-size:15px;margin:0 0 2px}
.doc .docrow{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.doc .lbl{color:var(--muted)}
.doc hr{border:0;border-top:1px dashed var(--line);margin:10px 0}
.doc .grand{display:flex;justify-content:space-between;font-weight:750;font-size:15px;padding-top:8px;border-top:2px solid #22303d;margin-top:8px}
.doc .small{font-size:11px;color:var(--muted)}
.amount-big{font-size:26px;font-weight:800;letter-spacing:-.6px}
.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;background:#eef2f6;color:#4c5a68}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f1f4f7;font-size:13px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{font-weight:650}

/* ---------- auth ---------- */
.authwrap{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:26px 20px calc(26px + env(safe-area-inset-bottom));
  background:linear-gradient(160deg,#0f5132 0%,#14794a 45%,#0b3f27 100%);color:#fff}
.authcard{background:#fff;color:var(--ink);border-radius:20px;padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.28);max-width:460px;width:100%;margin:0 auto}
.authcard h1{margin:0 0 4px;font-size:21px}
.authcard p.sub{margin:0 0 18px;color:var(--muted);font-size:13px}
.authlogo{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,var(--brand),var(--brand2));
  color:#fff;display:grid;place-items:center;font-size:24px;font-weight:800;margin-bottom:14px}
.authcard .fld{margin-bottom:12px}
.authfoot{text-align:center;margin-top:14px;font-size:13px;color:var(--muted)}
.authfoot a{color:var(--brand);font-weight:700;text-decoration:none}
.steps{display:flex;gap:6px;margin-bottom:16px}
.step{flex:1;height:4px;border-radius:3px;background:#e6ebef}
.step.on{background:var(--brand2)}

/* ---------- misc ---------- */
.sep{height:1px;background:var(--line);margin:10px 0}
.muted{color:var(--muted)}
.right{text-align:right}
.mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.tiny{font-size:11px}
.strong{font-weight:700}
.green{color:var(--green)} .red{color:var(--red)} .amber{color:var(--amber)} .blue{color:var(--blue)}
.flex{display:flex;gap:8px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.chipset{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:12px;padding:5px 10px;border-radius:16px;background:#eef2f6;color:#3d4b58;font-weight:600}
.lineitem{display:grid;grid-template-columns:1fr auto;gap:4px;padding:10px 0;border-bottom:1px solid #f1f4f7}
.lineitem .li-title{font-weight:620;font-size:13.5px}
.lineitem .li-sub{font-size:11.5px;color:var(--muted)}
.lineitem .li-amt{text-align:right;font-weight:680;font-variant-numeric:tabular-nums}
.addline{width:100%;border:1px dashed #c9d3dc;background:#fbfcfd;color:var(--brand);border-radius:10px;
  padding:10px;font-weight:700;font-size:13px;margin-top:10px}
.section-label{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:#8b98a5;font-weight:700;margin:14px 0 6px}
@media print{body{background:#fff}.topbar,.drawer,.fab,.pagehead .acts{display:none!important}}

/* ---------- desktop / tablet landscape ---------- */
@media (min-width: 900px) {
  .shell { display: block; }
  .topbar { margin-left: 264px; padding: 10px 18px; }
  .drawer { transform: none; box-shadow: none; border-right: 1px solid var(--line); width: 264px; }
  .drawer-scrim { display: none !important; }
  .view { margin-left: 264px; max-width: 1180px; padding: 6px 18px 40px; }
  #btnMenu { display: none; }
  .pagehead { padding: 16px 0 6px; }
  .card { margin: 0 0 14px; }
  .stats { grid-template-columns: repeat(4, 1fr); padding: 8px 0 4px; }
  .tabs, .searchbar { padding-left: 0; padding-right: 0; }
  .modalwrap { align-items: center; }
  .modal { max-width: 760px; border-radius: 16px; }
  .modal.wide { max-width: 900px; }
  .authcard { max-width: 520px; }
  .rowcard { padding: 11px 14px; }
  .rowcard:hover { background: #f6f9fb; }
  .ditem:hover { background: #eef4f0; }
  .fab { right: calc(50% - 590px + 16px); }
}
@media (min-width: 1400px) {
  .view { max-width: 1280px; }
  .fab { right: calc(50% - 640px + 16px); }
}

</style>
<meta name="application-name" content="Tractor ERP">
</head>
<body>
<div id="root"></div>
<script>
/* ==== js/core.js ==== */
/* ============================================================
   TRACTOR ERP  —  core.js
   Storage, state, helpers, GST engine, numbering, seed data
   ============================================================ */
'use strict';

var DB_KEY = 'tractor_erp_v1';

/* ---- small polyfills for older WebViews ---- */
if (!String.prototype.padStart) {
  String.prototype.padStart = function (len, ch) {
    var s = String(this); ch = ch === undefined ? ' ' : String(ch);
    while (s.length < len) s = ch + s;
    return s;
  };
}
if (!Array.prototype.includes) {
  Array.prototype.includes = function (v) { return this.indexOf(v) > -1; };
}
if (!Array.prototype.find) {
  Array.prototype.find = function (fn) {
    for (var i = 0; i < this.length; i++) if (fn(this[i], i, this)) return this[i];
    return undefined;
  };
}
if (!Array.prototype.findIndex) {
  Array.prototype.findIndex = function (fn) {
    for (var i = 0; i < this.length; i++) if (fn(this[i], i, this)) return i;
    return -1;
  };
}

/* storage: native file store when running inside the Android app,
   localStorage otherwise (browser preview) */
var STORE = {
  get: function () {
    try {
      if (window.AppBridge && window.AppBridge.loadData) {
        var v = window.AppBridge.loadData();
        if (v) return v;
      }
    } catch (e) {}
    try { return localStorage.getItem(DB_KEY); } catch (e) { return null; }
  },
  set: function (val) {
    try {
      if (window.AppBridge && window.AppBridge.saveData) window.AppBridge.saveData(val);
    } catch (e) {}
    try { localStorage.setItem(DB_KEY, val); } catch (e) {}
  }
};
var S = null;

function blankState() {
  return {
    meta: { v: 1, setupDone: false, org: {}, createdAt: today() },
    counters: {},
    users: [], departments: [], employees: [], branches: [],
    parties: [], items: [], units: [], moves: [], transfers: [],
    quotations: [], invoices: [], purchases: [], payments: [], notes: [],
    expenses: [], jobcards: [], leads: [],
    insurers: [], policies: [], exchanges: [], marginReceipts: [], gstSlabs: defaultGstSlabs(),
    makes: [], models: [], uoms: defaultUoms(), mandals: [], districts: [], villages: [], states: defaultStates(),
    bankAccounts: [], transporters: [], transports: [],
    warranties: [], rta: [], hsrp: [], agreements: [],
    tradeAdvances: [], pdis: [],
    tombstones: {},
    attendance: [], salaries: [], tada: [], fuel: [], logbook: [], petty: [],
    session: { userId: null }
  };
}

function loadState() {
  if (S) return S;
  try {
    var raw = STORE.get();
    S = raw ? JSON.parse(raw) : blankState();
  } catch (e) { S = blankState(); }
  var b = blankState();
  Object.keys(b).forEach(function (k) { if (S[k] === undefined) S[k] = b[k]; });
  if (!S.meta) S.meta = b.meta;
  if (!S.session) S.session = b.session;
  return S;
}

var _saveTimer = null;
function save(now) {
  var write = function () {
    try { STORE.set(JSON.stringify(S)); }
    catch (e) { console.error('save failed', e); toast('Storage full — export a backup', 'err'); }
    if (window.Backup && Backup.maybe) { try { Backup.maybe(); } catch (e) {} }
    if (window.Sync && Sync.refreshOutbox) { try { Sync.refreshOutbox(); } catch (e) {} }
  };
  if (now) { write(); return; }
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(write, 120);
}

/* ---------------- ids, dates, numbers ---------------- */
var _seq = 0;
function deviceId() {
  if (!S.meta.deviceId) {
    S.meta.deviceId = 'D' + Math.random().toString(36).slice(2, 7).toUpperCase();
    save();
  }
  return S.meta.deviceId;
}
function stampRec(rec) {
  rec._u = Date.now();
  rec._d = deviceId();
  return rec;
}

function uid(p) {
  _seq++;
  return (p || 'id') + Date.now().toString(36) + _seq.toString(36) + Math.random().toString(36).slice(2, 6);
}
function pad(n) { n = String(n); return n.length < 2 ? '0' + n : n; }
function today() {
  var d = new Date();
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}
function thisMonth() { return today().slice(0, 7); }
function thisYear() { return today().slice(0, 4); }
function dmy(iso) {
  if (!iso) return '';
  var p = String(iso).slice(0, 10).split('-');

  parse: function () {
    var h = location.hash.replace(/^#\/?/, '');

    return { name: parts[0], params: params };

/* ---------------- form engine ---------------- */
function fieldHtml(f, val) {
  if (f.type === 'section') return '<div class="section-label span2">' + esc(f.label) + '</div>';
  var v = val === undefined || val === null ? (f.def !== undefined ? f.def : '') : val;
  var req = f.required ? ' required' : '';
  var h = '<label class="fld ' + (f.span === 2 ? 'span2' : '') + '"><span>' + esc(f.label) + (f.required ? ' <b>*</b>' : '') + '</span>';
  var name = 'name="' + f.k + '"';
  if (f.type === 'select') {
    var opts = typeof f.options === 'function' ? f.options() : (f.options || []);
    h += '<select ' + name + req + '>';
    if (!f.required || f.placeholder) h += '<option value="">' + esc(f.placeholder || '— select —') + '</option>';
    opts.forEach(function (o) {
      var ov = Array.isArray(o) ? o[0] : o.v, ol = Array.isArray(o) ? o[1] : o.l;
      h += '<option value="' + esc(ov) + '"' + (String(ov) === String(v) ? ' selected' : '') + '>' + esc(ol) + '</option>';
    });
    h += '</select>';
  } else if (f.type === 'textarea') {
    h += '<textarea ' + name + ' rows="' + (f.rows || 3) + '"' + req + ' placeholder="' + esc(f.placeholder || '') + '">' + esc(v) + '</textarea>';
  } else if (f.type === 'checkbox') {
    h += '<div class="switchrow"><input type="checkbox" ' + name + (v ? ' checked' : '') + '><span>' + esc(f.help || 'Enabled') + '</span></div>';
  } else {
    h += '<input type="' + (f.type || 'text') + '" ' + name + req +
      (f.step ? ' step="' + f.step + '"' : '') +
      (f.min !== undefined ? ' min="' + f.min + '"' : '') +
      (f.max !== undefined ? ' max="' + f.max + '"' : '') +
      (f.inputmode ? ' inputmode="' + f.inputmode + '"' : '') +
      ' value="' + esc(v) + '" placeholder="' + esc(f.placeholder || '') + '">';
  }
  if (f.help && f.type !== 'checkbox') h += '<small class="help">' + esc(f.help) + '</small>';
  return h + '</label>';
}
function formHtml(fields, values) {
  values = values || {};
  return '<div class="formgrid">' + fields.map(function (f) { return fieldHtml(f, values[f.k]); }).join('') + '</div>';
}
function readForm(root, fields) {
  var out = {};
  fields.forEach(function (f) {
    if (f.type === 'section' || !f.k) return;
    var e = root.querySelector('[name="' + f.k + '"]');
    if (!e) return;
    if (f.type === 'checkbox') out[f.k] = e.checked;
    else if (f.type === 'number') out[f.k] = e.value === '' ? '' : num(e.value);
    else out[f.k] = e.value;
  });
  return out;
}
function Form(cfg) {

  });
  qs('[data-cancel]', m.el).onclick = m.close;
  qs('[data-save]', m.el).onclick = function () {
    var vals = readForm(m.el, cfg.fields);
    var missing = cfg.fields.filter(function (f) { return f.required && (vals[f.k] === '' || vals[f.k] === undefined); });
    if (missing.length) { toast('Please fill: ' + missing.map(function (f) { return f.label; }).join(', '), 'err'); return; }

function barChart(data, opts) {

  var max = Math.max.apply(null, data.map(function (d) { return Math.abs(d.v); })) || 1;
  var h = '<div class="bars">';
  data.forEach(function (d) {
    var w = Math.round(Math.abs(d.v) / max * 100);
    h += '<div class="bar-row"><div class="bl">' + esc(d.l) + '</div>' +
      '<div class="btrack"><div class="bfill ' + (d.tone || '') + '" style="width:' + w + '%"></div></div>' +
      '<div class="bv">' + esc(opts.fmt ? opts.fmt(d.v) : fmt(d.v, 0)) + '</div></div>';
  });
  return h + '</div>';
}
function lineChart(data) {
  if (!data.length) return '<div class="empty small">No data</div>';
  var w = 320, hgt = 120, pad = 6;
  var max = Math.max.apply(null, data.map(function (d) { return d.v; })) || 1;
  var pts = data.map(function (d, i) {
    var x = pad + i * ((w - pad * 2) / Math.max(1, data.length - 1));
    var y = hgt - pad - (d.v / max) * (hgt - pad * 2);
    return x.toFixed(1) + ',' + y.toFixed(1);
  }).join(' ');
  var area = pad + ',' + (hgt - pad) + ' ' + pts + ' ' + (w - pad) + ',' + (hgt - pad);
  return '<svg class="linechart" viewBox="0 0 ' + w + ' ' + hgt + '" preserveAspectRatio="none">' +
    '<polygon points="' + area + '" fill="rgba(21,101,192,.12)"/>' +
    '<polyline points="' + pts + '" fill="none" stroke="#1565c0" stroke-width="2.2" stroke-linejoin="round"/></svg>' +
    '<div class="xlabels">' + data.map(function (d) { return '<span>' + esc(d.l) + '</span>'; }).join('') + '</div>';
}

</script>
<script>
/* ==== js/export.js ==== */
/* ============================================================
   export.js — Excel (.xls), PDF / print and CSV export,
   with single-row and bulk selection
   ============================================================ */

function xmlEsc(v) {
  return String(v === undefined || v === null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

var Export = {
  /* Excel 2003 SpreadsheetML — opens directly in Excel, WPS, Google Sheets */
  xls: function (name, cols, rows, title) {
    var h = '<?xml version="1.0"?>\n<?mso-application progid="Excel.Sheet"?>\n' +
      '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" ' +
      'xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">' +
      '<Styles><Style ss:ID="t"><Font ss:Bold="1" ss:Size="13"/></Style>' +
      '<Style ss:ID="h"><Font ss:Bold="1"/><Interior ss:Color="#E8F0EA" ss:Pattern="Solid"/>' +
      '<Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1"/></Borders></Style></Styles>' +
      '<Worksheet ss:Name="' + xmlEsc((title || 'Data').slice(0, 28).replace(/[\\\/\?\*\[\]:]/g, ' ')) + '"><Table>';
    h += '<Row><Cell ss:StyleID="t"><Data ss:Type="String">' + xmlEsc(title || name) + '</Data></Cell></Row>';
    h += '<Row><Cell><Data ss:Type="String">' + xmlEsc((org().name || '') + ' · generated ' + dmy(today())) + '</Data></Cell></Row><Row></Row>';
    h += '<Row>';
    cols.forEach(function (c) { h += '<Cell ss:StyleID="h"><Data ss:Type="String">' + xmlEsc(c.label) + '</Data></Cell>'; });
    h += '</Row>';
    rows.forEach(function (r) {
      h += '<Row>';
      cols.forEach(function (c) {
        var v = r[c.k];
        if (v === undefined || v === null) v = '';
        var isNum = typeof v === 'number';
        h += '<Cell><Data ss:Type="' + (isNum ? 'Number' : 'String') + '">' + xmlEsc(v) + '</Data></Cell>';
      });
      h += '</Row>';
    });
    h += '</Table></Worksheet></Workbook>';
    var fname = name.replace(/[^A-Za-z0-9._-]/g, '_') + '-' + today() + '.xls';
    this.deliver(fname, h, 'application/vnd.ms-excel');
    toast('Excel file ready');
  },

  csv: function (name, cols, rows) {
    var lines = [cols.map(function (c) { return c.label; }).join(',')];
    rows.forEach(function (r) {
      lines.push(cols.map(function (c) {
        var v = r[c.k] === undefined || r[c.k] === null ? '' : String(r[c.k]);
        return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
      }).join(','));
    });
    var fname = name.replace(/[^A-Za-z0-9._-]/g, '_') + '-' + today() + '.csv';
    this.deliver(fname, lines.join('\n'), 'text/csv');
    toast('CSV file ready');
  },

  pdf: function (title, cols, rows, sub) {
    var o = org();
    var html = '<!doctype html><html><head><meta charset="utf-8"><title>' + xmlEsc(title) + '</title><style>' +
      'body{font-family:Arial,sans-serif;font-size:10.5px;color:#111;padding:14px}' +
      'h1{font-size:15px;margin:0 0 2px}h2{font-size:11px;margin:0 0 10px;color:#555;font-weight:normal}' +
      'table{width:100%;border-collapse:collapse;margin-top:8px}' +
      'th{background:#eef3ef;text-align:left;padding:5px 6px;border-bottom:1px solid #999;font-size:9.5px;text-transform:uppercase}' +
      'td{padding:4px 6px;border-bottom:1px solid #e2e2e2;vertical-align:top}' +
      '.num{text-align:right}.f{margin-top:12px;font-size:9px;color:#666}' +
      '</style></head><body>' +
      '<h1>' + xmlEsc(o.name || '') + '</h1>' +
      '<h2>' + xmlEsc(title) + (sub ? ' · ' + xmlEsc(sub) : '') + ' · ' + dmy(today()) + '</h2>' +
      '<table><thead><tr>' + cols.map(function (c) { return '<th>' + xmlEsc(c.label) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      rows.map(function (r) {
        return '<tr>' + cols.map(function (c) {
          var v = r[c.k];
          if (v === undefined || v === null) v = '';
          var cls = (c.num || typeof v === 'number') ? ' class="num"' : '';
          return '<td' + cls + '>' + xmlEsc(typeof v === 'number' ? fmt(v) : v) + '</td>';
        }).join('') + '</tr>';
      }).join('') + '</tbody></table>' +
      '<div class="f">' + rows.length + ' row(s) · Generated from Tractor ERP on ' + dmy(today()) + '</div></body></html>';
    if (window.AppBridge && window.AppBridge.printHtml) {
      window.AppBridge.printHtml(html);
      toast('Choose "Save as PDF" in the print dialog');
    } else {
      var w = window.open('', '_blank');
      if (w) { w.document.write(html); w.document.close(); w.print(); }
      else window.print();
    }
  },

  deliver: function (fname, content, mime) {
    if (window.AppBridge && window.AppBridge.saveFile) {
      window.AppBridge.saveFile(fname, content);
    } else {
      var blob = new Blob([content], { type: mime || 'text/plain' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = fname;
      a.click();
    }
  },

  /* picker: single row or bulk (all ticked by default) */
  menu: function (title, cols, rows, opts) {
    opts = opts || {};
    if (!rows.length) { toast('Nothing to export', 'err'); return; }
    var sel = rows.map(function () { return true; });
    var body = '<div class="note">Choose what to export. Everything is ticked by default — untick rows for a single or partial export.</div>' +
      '<div class="between" style="margin:8px 0"><b>' + rows.length + ' row(s)</b>' +
      '<button class="btn sm" id="expAll">Toggle all</button></div>' +
      '<div style="max-height:42vh;overflow:auto;border:1px solid var(--line);border-radius:10px">' +
      rows.map(function (r, i) {
        var label = opts.label ? opts.label(r) : (r[cols[0].k] || 'Row ' + (i + 1));
        return '<label class="rowcard" style="padding:9px 10px"><div class="rc-main"><div class="rc-title" style="font-size:13px">' +
          esc(String(label).slice(0, 70)) + '</div></div>' +
          '<div class="rc-right"><input type="checkbox" data-exp="' + i + '" checked style="width:20px;height:20px"></div></label>';
      }).join('') + '</div>';
    var m = modal({
      title: 'Export · ' + title,
      wide: true,
      body: body,
      footer: '<button class="btn ghost" data-f="csv">CSV</button>' +
        '<button class="btn blue" data-f="xls">Excel</button>' +
        '<button class="btn primary" data-f="pdf">PDF / Print</button>'
    });
    qs('#expAll', m.el).onclick = function () {
      var anyOff = sel.some(function (v) { return !v; });
      sel = sel.map(function () { return anyOff; });
      qsa('[data-exp]', m.el).forEach(function (c) { c.checked = anyOff; });
    };
    qsa('[data-exp]', m.el).forEach(function (c) {
      c.onchange = function () { sel[Number(c.getAttribute('data-exp'))] = c.checked; };
    });
    qsa('[data-f]', m.el).forEach(function (b) {
      b.onclick = function () {
        var picked = rows.filter(function (r, i) { return sel[i]; });
        if (!picked.length) { toast('Select at least one row', 'err'); return; }
        var f = b.getAttribute('data-f');
        m.close();
        if (f === 'xls') Export.xls(title, cols, picked, title);
        else if (f === 'csv') Export.csv(title, cols, picked);
        else Export.pdf(title, cols, picked, opts.sub);
      };
    });
  },

  /* header action helper */
  action: function (title, colsFn, rowsFn, opts) {
    return {
      label: 'Export', icon: 'download',
      onClick: function () { Export.menu(title, colsFn(), rowsFn(), opts); }
    };
  }
};

</script>
<script>
/* ==== js/auth.js ==== */
/* ============================================================
   auth.js — first-run setup wizard, login, my account
   ============================================================ */

function hashPw(s) {
  var h = 5381, i;
  var str = 'terp$' + String(s);
  for (i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0;
  return 'h' + h.toString(16) + String(s).length;
}

/* ---------------- setup wizard ---------------- */
var setupDraft = { step: 1, org: {}, branch: {}, depts: [], admin: {} };

screen('setup', {
  title: 'Organisation Setup',
  render: function (view) {
    var d = setupDraft;
    if (!d.depts.length) {
      d.depts = ['Sales', 'Service', 'Accounts', 'Spares', 'Administration'].map(function (n) {
        return { id: uid('dep'), name: n, head: '' };
      });
    }
    function steps() {
      var h = '<div class="steps">';
      for (var i = 1; i <= 3; i++) h += '<div class="step ' + (d.step >= i ? 'on' : '') + '"></div>';
      return h + '</div>';
    }
    var body = '';
    if (d.step === 1) {
      body = '<h1>Set up your dealership</h1><p class="sub">Step 1 of 3 · Organisation &amp; head office</p>' + steps() +
        formHtml([
          { k: 'name', label: 'Business / Firm name', required: true, span: 2, placeholder: 'e.g. Sri Balaji Tractors' },
          { k: 'legalName', label: 'Legal name (for GST)', span: 2 },
          { k: 'gstin', label: 'GSTIN', placeholder: '36ABCDE1234F1Z5' },
          { k: 'pan', label: 'PAN' },
          { k: 'stateCode', label: 'State', type: 'select', required: true, options: function () { return STATES; }, def: '36' },
          { k: 'phone', label: 'Phone', type: 'tel' },
          { k: 'address', label: 'Address', type: 'textarea', span: 2, rows: 2 },
          { k: 'email', label: 'Email', type: 'email' },

        ], d.org) +
        '<div class="section-label">Head office branch</div>' +
        formHtml([
          { k: 'bname', label: 'Branch name', required: true, def: 'Head Office' },
          { k: 'bcode', label: 'Branch code', def: 'HO' },
          { k: 'bgstin', label: 'Branch GSTIN' },
          { k: 'bphone', label: 'Branch phone', type: 'tel' }
        ], d.branch);
    } else if (d.step === 2) {
      body = '<h1>Departments</h1><p class="sub">Step 2 of 3 · Who does what</p>' + steps() +
        '<div class="note">These can be edited later. Department heads are optional.</div>' +
        '<div id="deptList">' + d.depts.map(function (dp, i) {
          return '<div class="formgrid" style="margin-top:10px">' +
            fieldHtml({ k: 'dn' + i, label: 'Department ' + (i + 1), required: true }, dp.name) +
            fieldHtml({ k: 'dh' + i, label: 'Head / In-charge' }, dp.head) + '</div>';
        }).join('') + '</div>' +
        '<button class="addline" id="addDept">+ Add department</button>';
    } else {
      body = '<h1>Your admin account</h1><p class="sub">Step 3 of 3 · Owner / administrator login</p>' + steps() +
        formHtml([
          { k: 'name', label: 'Your name', required: true, span: 2 },
          { k: 'username', label: 'Username', required: true, placeholder: 'admin' },
          { k: 'phone', label: 'Mobile', type: 'tel' },
          { k: 'password', label: 'Password', type: 'password', required: true, help: 'Minimum 4 characters' },
          { k: 'password2', label: 'Confirm password', type: 'password', required: true }
        ], d.admin) +
        '<div class="note">This account gets full access to every module. You can create restricted logins for your team afterwards under <b>Users &amp; Permissions</b>.</div>';
    }
    view.innerHTML = '<div class="authwrap"><div class="authcard">' +
      '<div class="authlogo">' + icon('tractor') + '</div>' + body +
      '<div class="flex" style="margin-top:16px">' +
      (d.step > 1 ? '<button class="btn ghost" id="bPrev">Back</button>' : '') +
      '<button class="btn primary" id="bNext" style="flex:1;justify-content:center">' +
      (d.step === 3 ? 'Create organisation' : 'Continue') + '</button></div>' +
      '</div></div>';

    var prev = document.getElementById('bPrev');
    if (prev) prev.onclick = function () {
      if (d.step === 1) return;
      d.step--; Router.render();
    };
    var add = document.getElementById('addDept');
    if (add) add.onclick = function () {
      d.depts.push({ id: uid('dep'), name: '', head: '' });
      Router.render();
    };
    document.getElementById('bNext').onclick = function () {
      var root = document.querySelector('.authcard');
      if (d.step === 1) {
        var f1 = [
          { k: 'name', required: true }, { k: 'legalName' }, { k: 'gstin' }, { k: 'pan' },
          { k: 'stateCode', required: true }, { k: 'phone' }, { k: 'address' }, { k: 'email' }, { k: 'fyStart' },
          { k: 'bname', required: true }, { k: 'bcode' }, { k: 'bgstin' }, { k: 'bphone' }
        ];
        var v = readForm(root, f1);
        if (!v.name || !v.stateCode || !v.bname) { toast('Business name, state and branch name are required', 'err'); return; }
        d.org = v; d.branch = v; d.step = 2; Router.render();
      } else if (d.step === 2) {
        d.depts.forEach(function (dp, i) {
          var a = root.querySelector('[name="dn' + i + '"]');
          var b = root.querySelector('[name="dh' + i + '"]');
          dp.name = a ? a.value.trim() : dp.name;
          dp.head = b ? b.value.trim() : '';
        });
        d.depts = d.depts.filter(function (x) { return x.name; });
        d.step = 3; Router.render();
      } else {
        var v3 = readForm(root, [
          { k: 'name' }, { k: 'username' }, { k: 'phone' }, { k: 'password' }, { k: 'password2' }
        ]);
        if (!v3.name || !v3.username) { toast('Name and username are required', 'err'); return; }
        if ((v3.password || '').length < 4) { toast('Password must be at least 4 characters', 'err'); return; }
        if (v3.password !== v3.password2) { toast('Passwords do not match', 'err'); return; }
        finishSetup(v3);
      }
    };
  }
});

function finishSetup(admin) {
  var d = setupDraft;
  S.meta.org = {
    name: d.org.name, legalName: d.org.legalName || d.org.name, gstin: (d.org.gstin || '').toUpperCase(),
    pan: (d.org.pan || '').toUpperCase(), stateCode: d.org.stateCode, phone: d.org.phone,
    email: d.org.email, address: d.org.address, fyStart: d.org.fyStart || today()
  };
  S.meta.setupDone = true;
  var b = {
    id: uid('br'), name: d.branch.bname, code: d.branch.bcode || 'HO',
    gstin: (d.branch.bgstin || d.org.gstin || '').toUpperCase(), stateCode: d.org.stateCode,
    phone: d.branch.bphone || d.org.phone, address: d.org.address, active: true
  };
  S.branches = [b];
  S.departments = d.depts.map(function (x) { return { id: x.id, name: x.name, head: x.head, branchId: b.id }; });
  var u = {
    id: uid('usr'), name: admin.name, username: admin.username.toLowerCase(), phone: admin.phone,
    pass: hashPw(admin.password), role: 'owner', perms: permList().map(function (p) { return p[0]; }),
    branchId: b.id, deptId: (S.departments[0] || {}).id, active: true, createdAt: today()
  };
  S.users = [u];
  S.session.userId = u.id;
  settings();
  save(true);
  Shell.refreshDrawer();
  toast('Organisation created — your books are ready');
  Router.go('dashboard');
}

/* ---------------- login ---------------- */
screen('login', {
  title: 'Sign in',
  render: function (view) {
    view.innerHTML = '<div class="authwrap"><div class="authcard">' +
      '<div class="authlogo">' + icon('tractor') + '</div>' +
      '<h1>' + esc(org().name || 'Tractor ERP') + '</h1>' +

      formHtml([
        { k: 'username', label: 'Username', required: true },
        { k: 'password', label: 'Password', type: 'password', required: true }
      ]) +
      '<button class="btn primary block" id="bLogin" style="margin-top:16px">Sign in</button>' +
      '<div class="authfoot">Tractor ERP · offline business suite</div>' +
      '</div></div>';
    var root = document.querySelector('.authcard');
    function doLogin() {
      var v = readForm(root, [{ k: 'username' }, { k: 'password' }]);
      var u = S.users.find(function (x) {
        return x.username === String(v.username || '').trim().toLowerCase() && x.pass === hashPw(v.password || '') && x.active !== false;
      });
      if (!u) { toast('Invalid username or password', 'err'); return; }
      S.session.userId = u.id; save(true);

      Router.go('dashboard');

    });
  }
});

/* ---------------- my account ---------------- */
screen('myaccount', {
  title: 'My Account',
  render: function (view) {
    var u = me();
    var deptName = (dept(u.deptId) || {}).name || '—';
    view.innerHTML = '<div class="pagehead"><div><h1>' + esc(u.name || '') + '</h1><div class="sub">' +
      esc(u.username || '') + ' · ' + esc(u.role || '') + ' · ' + esc(deptName) + '</div></div></div>' +
      '<div class="card"><div class="kv"><span>Branch</span><span>' + esc(branchName(u.branchId)) + '</span></div>' +
      '<div class="kv"><span>Mobile</span><span>' + esc(u.phone || '—') + '</span></div>' +
      '<div class="kv"><span>Organisation</span><span>' + esc(org().name || '—') + '</span></div>' +
      '<div class="kv"><span>GSTIN</span><span class="mono">' + esc(org().gstin || '—') + '</span></div>' +
      '<div class="kv"><span>Financial year</span><span>' + fyOf(today()) + '</span></div></div>' +
      '<div class="card"><h3>Permissions</h3><div class="chipset">' +
      (u.role === 'owner' || u.role === 'admin' ? '<span class="chip">Full access</span>' :
        (u.perms || []).map(function (p) {
          var m = permList().find(function (x) { return x[0] === p; });
          return '<span class="chip">' + esc(m ? m[1] : p) + '</span>';
        }).join('')) + '</div></div>' +
      '<div class="card"><h3>Security</h3>' +
      '<button class="btn block" id="bPw">Change password</button>' +
      '<div style="height:8px"></div><button class="btn block" id="bBackup">Backup / Export data</button>' +
      '<div style="height:8px"></div><button class="btn block" id="bRestore">Restore from backup</button></div>' +
      '<div class="card"><h3>Data</h3>' +
      '<div class="kv"><span>Parties</span><span>' + S.parties.length + '</span></div>' +
      '<div class="kv"><span>Items</span><span>' + S.items.length + '</span></div>' +
      '<div class="kv"><span>Tractor units</span><span>' + S.units.length + '</span></div>' +
      '<div class="kv"><span>Invoices</span><span>' + S.invoices.length + '</span></div>' +
      '<div class="kv"><span>Storage used</span><span>' + (JSON.stringify(S).length / 1024).toFixed(0) + ' KB</span></div>' +
      '<div class="kv"><span>Device id</span><span class="mono">' + deviceId() + '</span></div>' +
      '<div class="kv"><span>Last backup</span><span>' + Backup.lastLabel() + '</span></div>' +
      '<div class="kv"><span>Backup folder</span><span class="tiny mono" style="text-align:right;word-break:break-all">' +
      esc(Backup.folderLabel()) + '</span></div>' +
      '<div class="kv"><span>Last sync</span><span>' + (S.meta.lastSyncAt ? Backup.ago(S.meta.lastSyncAt) : 'never') + '</span></div>' +
      '<div style="height:8px"></div><button class="btn primary block" id="bSync">Sync &amp; backup</button>' +
      '<div style="height:8px"></div><button class="btn danger block" id="bReset">Reset all data</button></div>';

    document.getElementById('bPw').onclick = function () {
      Form({
        title: 'Change password',
        fields: [
          { k: 'old', label: 'Current password', type: 'password', required: true },
          { k: 'p1', label: 'New password', type: 'password', required: true },
          { k: 'p2', label: 'Confirm new password', type: 'password', required: true }
        ],
        onSave: function (v) {
          if (hashPw(v.old) !== u.pass) { toast('Current password is wrong', 'err'); return; }
          if (v.p1.length < 4) { toast('Use at least 4 characters', 'err'); return; }
          if (v.p1 !== v.p2) { toast('Passwords do not match', 'err'); return; }
          u.pass = hashPw(v.p1); save(true); toast('Password changed');
        }
      });
    };
    document.getElementById('bBackup').onclick = function () {
      var data = JSON.stringify(S);
      var name = 'tractor-erp-backup-' + today() + '.json';
      if (window.AppBridge && window.AppBridge.saveFile) {
        window.AppBridge.saveFile(name, data);
      } else {
        var blob = new Blob([data], { type: 'application/json' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = name; a.click();
      }
      toast('Backup created');
    };
    document.getElementById('bRestore').onclick = function () {
      var inp = document.createElement('input');
      inp.type = 'file'; inp.accept = '.json,application/json';
      inp.onchange = function () {
        var f = inp.files[0]; if (!f) return;
        var rd = new FileReader();
        rd.onload = function () {
          try {
            var obj = JSON.parse(rd.result);
            if (!obj.meta || !obj.users) throw new Error('Not a valid backup file');
            confirmDlg('Replace all current data with this backup?', function () {
              S = obj; save(true); toast('Backup restored'); Router.go('dashboard');
            });

/* ---------- generic edit modal with delete ---------- */
function editEntity(cfg) {
  var isNew = cfg.isNew !== undefined ? cfg.isNew : !cfg.rec;
  var rec = Object.assign({}, cfg.defaults || {}, cfg.preset || cfg.rec || {});
  var body = formHtml(cfg.fields, rec) + (cfg.extraHtml ? cfg.extraHtml(rec) : '');
  var m = modal({
    title: cfg.title || (isNew ? 'Add' : 'Edit'),
    wide: cfg.wide,
    body: body,
    footer: (isNew ? '' : '<button class="btn danger" data-del>' + icon('trash') + '</button>') +
      '<button class="btn ghost" data-cancel>Cancel</button>' +
      '<button class="btn primary" data-save>' + (isNew ? 'Add' : 'Save') + '</button>'
  });
  qs('[data-cancel]', m.el).onclick = m.close;
  if (!isNew) {
    qs('[data-del]', m.el).onclick = function () {
      confirmDlg('Delete this record permanently?', function () { m.close(); cfg.onDelete(rec); }, 'Delete');
    };
  }
  if (cfg.onOpen) { try { cfg.onOpen(m.el, isNew); } catch (e) { console.error(e); } }
  qs('[data-save]', m.el).onclick = function () {
    var v = readForm(m.el, cfg.fields);
    var miss = cfg.fields.filter(function (f) { return f.required && (v[f.k] === '' || v[f.k] === undefined); });
    if (miss.length) { toast('Required: ' + miss.map(function (f) { return f.label; }).join(', '), 'err'); return; }
    if (cfg.validate) { var e = cfg.validate(v, isNew ? null : rec); if (e) { toast(e, 'err'); return; } }
    m.close();
    cfg.onSave(v, isNew ? null : rec);
  };
  return m;
}

function branchOptions() {
  return S.branches.filter(function (b) { return b.active !== false; }).map(function (b) { return { v: b.id, l: b.name }; });
}
function deptOptions() {
  return S.departments.map(function (d) { return { v: d.id, l: d.name }; });
}

/* ---------- generic list screen ---------- */
function crudScreen(cfg) {
  var self = function (view, params) {
    var q = params.q || '';
    var rows = coll(cfg.coll).filter(function (r) {
      if (cfg.filter && !cfg.filter(r)) return false;
      if (!q) return true;
      return cfg.search(r).toLowerCase().indexOf(q.toLowerCase()) > -1;
    });
    rows = cfg.sort ? cfg.sort(rows) : sortBy(rows, cfg.sortKey || 'name');
    var acts = [{ label: 'Add', icon: 'plus', cls: 'primary', onClick: function () { open(null); } }];
    if (cfg.exportCols) {
      acts.unshift({
        label: 'Export', icon: 'download',
        onClick: function () {
          Export.menu(cfg.title, cfg.exportCols, rows.map(cfg.exportRow), {
            label: function (r) { return r[cfg.exportCols[0].k]; }
          });
        }
      });
    }
    var h = pageHead(cfg.title, acts, cfg.sub);
    h += '<div class="searchbar"><input id="q" placeholder="' + esc(cfg.searchLabel || 'Search…') + '" value="' + esc(q) + '">' +
      (cfg.extraButton ? '<button class="btn" id="xbtn">' + esc(cfg.extraButton.label) + '</button>' : '') + '</div>';
    h += '<div class="card tight">';
    if (!rows.length) h += '<div class="empty small">' + esc(cfg.empty || 'Nothing here yet — tap Add to create the first record.') + '</div>';
    else h += rows.map(function (r) {
      var id = 'c' + r.id;
      setTimeout(function () {
        var e = document.getElementById(id);
        if (e) e.onclick = function () { open(r); };
      }, 0);
      return '<div class="rowcard" id="' + id + '"><div class="rc-main">' + cfg.row(r) + '</div>' +
        '<div class="rc-right">' + (cfg.rowRight ? cfg.rowRight(r) : '') + '</div></div>';
    }).join('');
    h += '</div>';
    view.innerHTML = h;

    function refresh(qq) {
      if (cfg.renderWith) cfg.renderWith(view, qq);
      else self(view, { q: qq });
    }
    var inp = document.getElementById('q');
    inp.oninput = function () {
      clearTimeout(inp._t);
      inp._t = setTimeout(function () { refresh(inp.value); }, 280);
    };
    if (cfg.extraButton) {
      document.getElementById('xbtn').onclick = function () { cfg.extraButton.onClick(); };
    }
    function open(r) {
      _itemCat = (r && r.category) || (typeof cfg.defaults === 'function' ? cfg.defaults().category : (cfg.defaults || {}).category) || 'spare';
      _itemMake = (r && r.makeId) || '';
      editEntity({
        title: cfg.title + (r ? '' : ' — new'),
        fields: cfg.fields,
        rec: r,
        defaults: (typeof cfg.defaults === 'function' ? cfg.defaults() : cfg.defaults),
        wide: cfg.wide,
        validate: cfg.validate,
        onOpen: cfg.onOpen,
        onSave: function (v, old) {
          var rec = Object.assign({}, old || {}, v);
          if (!old) rec.id = uid(cfg.coll.slice(0, 3));
          upsert(cfg.coll, rec);
          if (cfg.after) cfg.after(rec, !old);
          toast(old ? 'Saved' : 'Added');
          refresh(q);
        },
        onDelete: function (old) {
          if (cfg.beforeDelete && cfg.beforeDelete(old) === false) return;
          removeRec(cfg.coll, old.id);
          toast('Deleted');
          refresh(q);
        }
      });
    }
  };
  return self;
}

    if (!isAdmin()) { view.innerHTML = '<div class="pad"><div class="empty">Only administrators can manage users.</div></div>'; return; }
    var h = pageHead('Users & Permissions', [{ label: 'New user', icon: 'plus', cls: 'primary', onClick: function () { openUser(null); } }],
      'Control who can open which module');
    h += '<div class="card tight">';
    if (!S.users.length) h += '<div class="empty small">No users</div>';
    else h += S.users.map(function (u) {
      var id = 'u' + u.id;
      setTimeout(function () {
        var e = document.getElementById(id); if (e) e.onclick = function () { openUser(u); };
      }, 0);
      return '<div class="rowcard" id="' + id + '"><div class="rc-main"><div class="rc-title">' + esc(u.name) +
        (u.active === false ? ' ' + badge('disabled', 'red') : '') + '</div>' +
        '<div class="rc-sub">' + esc(u.username) + ' · ' + esc(u.role) + ' · ' + esc(branchName(u.branchId)) + '</div></div>' +
        '<div class="rc-right"><small>' + ((u.role === 'owner' || u.role === 'admin') ? 'full access' : (u.perms || []).length + ' modules') + '</small></div></div>';
    }).join('');
    h += '</div><div class="card"><h3>Role guide</h3><div class="tiny muted">' +
      '<b>Owner / Admin</b> — everything, including users and settings.<br>' +
      '<b>Manager</b> — modules you tick, can approve.<br>' +
      '<b>Staff</b> — ticked modules only, no deletions of documents.</div></div>';
    view.innerHTML = h;

    function openUser(u) {
      var isNew = !u;
      var rec = u || { role: 'staff', perms: ['sales'], branchId: (S.branches[0] || {}).id, active: true };
      var body = formHtml([
        { k: 'name', label: 'Full name', required: true, span: 2 },
        { k: 'username', label: 'Username', required: true },
        { k: 'phone', label: 'Mobile', type: 'tel' },
        { k: 'role', label: 'Role', type: 'select', required: true, options: [['owner', 'Owner'], ['admin', 'Administrator'], ['manager', 'Manager'], ['staff', 'Staff']] },
        { k: 'branchId', label: 'Branch', type: 'select', options: branchOptions },
        { k: 'deptId', label: 'Department', type: 'select', options: deptOptions },
        { k: 'password', label: isNew ? 'Password' : 'New password (optional)', type: 'password', span: 2 }
      ], rec) +
        '<div class="section-label">Module permissions</div><div class="formgrid">' +
        permList().map(function (p) {
          var on = (rec.perms || []).indexOf(p[0]) > -1;
          return '<label class="fld"><span>' + esc(p[1]) + '</span><div class="switchrow">' +
            '<input type="checkbox" name="perm_' + p[0] + '"' + (on ? ' checked' : '') + '><span>' + (on ? 'allowed' : 'blocked') + '</span></div></label>';
        }).join('') + '</div>' +
        '<label class="fld" style="margin-top:12px"><span>Account status</span><div class="switchrow">' +
        '<input type="checkbox" name="active"' + (rec.active !== false ? ' checked' : '') + '><span>Login enabled</span></div></label>';
      var m = modal({
        title: isNew ? 'New user' : 'Edit user',
        wide: true, body: body,
        footer: (isNew ? '' : '<button class="btn danger" data-del>' + icon('trash') + '</button>') +
          '<button class="btn ghost" data-cancel>Cancel</button><button class="btn primary" data-save>Save</button>'
      });
      qs('[data-cancel]', m.el).onclick = m.close;
      if (!isNew) qs('[data-del]', m.el).onclick = function () {
        if (u.id === S.session.userId) { toast('You cannot delete your own login', 'err'); return; }
        confirmDlg('Delete user ' + u.name + '?', function () { m.close(); removeRec('users', u.id); Router.render(); }, 'Delete');
      };
      qs('[data-save]', m.el).onclick = function () {
        var v = readForm(m.el, [{ k: 'name' }, { k: 'username' }, { k: 'phone' }, { k: 'role' }, { k: 'branchId' }, { k: 'deptId' }, { k: 'password' }]);
        if (!v.name || !v.username) { toast('Name and username required', 'err'); return; }
        var clash = S.users.find(function (x) { return x.username === v.username.toLowerCase() && (!u || x.id !== u.id); });
        if (clash) { toast('That username is already taken', 'err'); return; }
        var perms = permList().map(function (p) { return p[0]; }).filter(function (k) {
          var e = m.el.querySelector('[name="perm_' + k + '"]'); return e && e.checked;
        });
        var activeEl = m.el.querySelector('[name="active"]');
        var out = Object.assign({}, u || {}, {
          name: v.name, username: v.username.toLowerCase(), phone: v.phone, role: v.role,
          branchId: v.branchId, deptId: v.deptId, perms: perms, active: activeEl ? activeEl.checked : true
        });
        if (isNew) {
          if ((v.password || '').length < 4) { toast('Password must be at least 4 characters', 'err'); return; }
          out.id = uid('usr'); out.pass = hashPw(v.password); out.createdAt = today();
        } else if (v.password) {
          if (v.password.length < 4) { toast('Password too short', 'err'); return; }
          out.pass = hashPw(v.password);
        }
        upsert('users', out); m.close(); toast('User saved'); Router.render();
      };
    }
  }
});

</script>
<script>
/* ==== js/docs.js ==== */
/* ============================================================
   docs.js — document editor & viewer (invoice, quotation,
   purchase bill, job card, financer invoice)
   ============================================================ */

function empOptions(type) {
  return S.employees.filter(function (e) {
    return e.active !== false && (!type || e.empType === type);
  }).map(function (e) { return { v: e.id, l: e.name }; });
}
function partyOptions(types) {
  return S.parties.filter(function (p) { return types.indexOf(p.type) > -1; })
    .map(function (p) { return { v: p.id, l: p.name + (p.gstin ? ' (' + p.gstin + ')' : '') }; });
}
function shortCat(cat) {
  var c = (ITEM_CATS.find(function (x) { return x[0] === cat; }) || [cat, cat])[1];
  return String(c).replace(/\s*\(.*?\)/, '').trim();
}

/* one line carrying everything: name · category · make · model · GST */
function itemLabel(i) {
  if (!i || !i.id) return '';
  var cat = shortCat(i.category);
  var mk = makeName(i.makeId) || i.brand || '';
  var md = modelName(i.modelId) || i.model || '';
  var parts = [];
  [cat, mk, md].forEach(function (v) {
    if (!v) return;
    if (String(v).toLowerCase() === String(i.name).toLowerCase()) return; // don't repeat the name
    if (parts.some(function (p) { return p.toLowerCase() === String(v).toLowerCase(); })) return;
    parts.push(v);
  });
  var tail = [];
  if (i.partNo) tail.push(i.partNo);
  if (i.gstRate !== undefined && i.gstRate !== '') tail.push(i.gstRate + '%');
  return i.name + (parts.length ? ' · ' + parts.join(' · ') : '') + (tail.length ? ' · ' + tail.join(' · ') : '');
}

function itemOptions(filterFn) {
  return S.items.filter(function (i) { return !filterFn || filterFn(i); })
    .map(function (i) { return { v: i.id, l: itemLabel(i) }; });
}
/* items matching the chosen category / make / model (empty = everything) */
function itemsMatching(cat, makeId, modelId) {
  return S.items.filter(function (i) {
    if (cat && i.category !== cat) return false;
    if (makeId && i.makeId !== makeId) return false;
    if (modelId && i.modelId !== modelId) return false;
    return true;
  });
}
function itemOptionsFor(cat, makeId, modelId) {
  return itemsMatching(cat, makeId, modelId).map(function (i) { return { v: i.id, l: itemLabel(i) }; });
}

/* items of one make (empty make = everything) */
function itemOptionsForMake(makeId) {
  return itemOptions(function (i) { return !makeId || i.makeId === makeId; });
}

var DOCS = {
  invoice: {

/* The financer invoice mirrors a sale invoice exactly — same header fields and
   same printed layout — with the borrower and loan details added on top. */

  { k: 'loanAccountNo', label: 'Loan account no.' },
